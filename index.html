<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Français avec Abdoul Karim</title>
<meta name="theme-color" content="#1E3FAE">
<meta name="description" content="Apprends le français. Comprends. Pratique. Progresse. Cours, exercices et quiz de la 6e à la Terminale.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Le Français">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playwrite+FR+Trad:wght@100..400&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN : le cahier d'écolier
   Papier à grands carreaux, marge rouge, encre bleue, surligneur jaune,
   stylo rouge du professeur pour les corrections. Mode sombre = ardoise.
   ===================================================================== */
:root{
  --paper:#FBFCFF; --rule:#E4EBF8; --rule2:#F0F4FB; --margin:#F1B4BA;
  --surface:#FFFFFF; --surface2:#EEF2FA;
  --ink:#16213E; --muted:#56607A; --line:#C9D3E8;
  --brand:#1E3FAE; --brand-ink:#FFFFFF; --brand-soft:#E3E9FB;
  --hl:#FFE566; --hl-soft:#FFF5BC; --hl-ink:#3A3000;
  --ok:#1B7E52; --ok-soft:#DDF3E8; --bad:#C8283A; --bad-soft:#FCE3E6;
  --f-head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-hand:'Playwrite FR Trad','Segoe Script','Bradley Hand',cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16211E; --rule:#22312D; --rule2:#1B2825; --margin:#6B3A42;
    --surface:#1E2B28; --surface2:#111A18;
    --ink:#EEF2EA; --muted:#A3B4AD; --line:#33443F;
    --brand:#9DB8FF; --brand-ink:#0D1B40; --brand-soft:#243352;
    --hl:#F4D95B; --hl-soft:#3A3716; --hl-ink:#2C2500;
    --ok:#6FD3A0; --ok-soft:#1B3B2D; --bad:#FF8291; --bad-soft:#412027;
  }
}
:root[data-theme="dark"]{
  --paper:#16211E; --rule:#22312D; --rule2:#1B2825; --margin:#6B3A42;
  --surface:#1E2B28; --surface2:#111A18;
  --ink:#EEF2EA; --muted:#A3B4AD; --line:#33443F;
  --brand:#9DB8FF; --brand-ink:#0D1B40; --brand-soft:#243352;
  --hl:#F4D95B; --hl-soft:#3A3716; --hl-ink:#2C2500;
  --ok:#6FD3A0; --ok-soft:#1B3B2D; --bad:#FF8291; --bad-soft:#412027;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--surface2);color:var(--ink);font:17px/1.6 var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

#app{
  position:relative;max-width:480px;margin:0 auto;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--rule) 1px,transparent 1px),
    linear-gradient(90deg,var(--rule) 1px,transparent 1px),
    linear-gradient(var(--rule2) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,32px 8px;
}
#app::before{content:"";position:absolute;top:0;bottom:0;left:14px;width:2px;background:var(--margin);pointer-events:none}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.12)}}

.screen{position:relative;padding:14px 18px 130px 30px}
.head{position:relative;display:flex;align-items:center;gap:10px;padding:12px 18px 0 22px}
.head-t{font:700 15px var(--f-head);color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:24px;line-height:1;display:grid;place-items:center}

/* --- Typographie --- */
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.12;letter-spacing:-.015em}
h1.t1{font-size:30px;font-weight:800;color:var(--brand)}
h2.t2{font-size:21px;font-weight:800;margin:26px 0 10px}
h3.t3{font-size:17px;font-weight:700;margin:20px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.hand{font-family:var(--f-hand);font-size:20px;line-height:1.3;margin:0}
.lead{font-size:17px;color:var(--muted);margin:8px 0 18px}
b,strong{font-weight:700;background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 1px}
.btn b,.opt b,.chip b,.row b,.cico b,.tok b{background:none}

/* --- Marque --- */
.brand{position:relative;display:flex;align-items:center;gap:10px;padding:14px 18px 0 30px}
.logo{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--hl);color:var(--hl-ink);border:2px solid var(--ink);border-radius:9px;font:800 20px var(--f-head);transform:rotate(-5deg)}
.brand-name{font:800 13px/1.15 var(--f-head);color:var(--brand)}

/* --- Boutons --- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 18px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);color:var(--ink);font:700 17px var(--f-head);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-hl{background:var(--hl);color:var(--hl-ink)}
.btn-danger{background:var(--bad);color:#fff;border-color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:0 4px 0 var(--line);border-color:var(--line)}
.stack{display:grid;gap:14px;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.link{background:none;border:0;padding:6px 2px;color:var(--brand);font:700 inherit;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:700 14px var(--f-head)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--hl-soft);border:1.5px solid var(--hl);font:700 13px var(--f-head);color:var(--ink)}

/* --- Accueil --- */
.hero{position:relative;padding:20px 18px 8px 30px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.stamp{width:88px;height:88px;border:3px solid var(--bad);border-radius:50%;color:var(--bad);display:grid;place-content:center;text-align:center;transform:rotate(-11deg);font-family:var(--f-hand);line-height:1.1}
.stamp b{background:none;font:800 22px var(--f-head);display:block}
.stamp span{font-size:13px}
.hero-title{margin:22px 0 0;font:800 clamp(36px,11.5vw,48px)/1 var(--f-head);letter-spacing:-.025em;color:var(--brand)}
.hero-title .ul{position:relative;display:inline-block}
.hero-title .ul svg{position:absolute;left:0;bottom:-10px;width:100%;height:12px}
.hero-title .by{display:block;margin-top:20px;font:400 21px/1.3 var(--f-hand);letter-spacing:0;color:var(--ink)}
.hero-sub{margin:18px 0 22px;font-size:18px;color:var(--muted)}
.greet{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 18px 4px 30px}
.block{margin-top:26px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px 16px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px;margin-bottom:10px}
.row:active{background:var(--brand-soft)}
.row .grow{flex:1;display:grid}
.row small{color:var(--muted);font-size:14px}
.row .chev{font-size:26px;color:var(--muted)}
.row.soon{background:transparent;border-style:dashed;cursor:default}
.row.soon .grow b{color:var(--muted)}
.row.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.cico{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--cat,#1E3FAE) 16%,var(--surface));border:2px solid color-mix(in srgb,var(--cat,#1E3FAE) 55%,var(--surface))}
.num{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 14px var(--f-head);background:var(--surface)}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;margin:0 -18px 0 -2px;scroll-snap-type:x proximity}
.mini-card{flex:0 0 170px;scroll-snap-align:start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;border-top:6px solid var(--cat,#1E3FAE)}
.mini-card b{font:700 16px/1.2 var(--f-head)}
.mini-card small{color:var(--muted)}
.pbar{height:12px;border-radius:999px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.pbar.hl i{background:var(--hl)}

/* --- Formulaires --- */
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font:700 15px var(--f-head)}
.input{width:100%;min-height:56px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.pwrap{position:relative}
.pwrap .link{position:absolute;right:8px;top:8px;height:40px;padding:0 8px;font-size:15px}
.err{min-height:24px;color:var(--bad);font-weight:700;margin:4px 0 10px}
.alt{text-align:center;margin-top:18px}
.note{font-size:14px;color:var(--muted);margin-top:14px}

/* --- Classe --- */
.grp{font:700 15px var(--f-head);color:var(--muted);margin:22px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.classbtn{display:grid;gap:2px;text-align:left;min-height:84px;padding:14px 16px;background:var(--surface);border:2px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.classbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.classbtn b{font:800 28px/1 var(--f-head);background:none}
.classbtn small{color:var(--muted)}
.classbtn.on{background:var(--hl);color:var(--hl-ink)}
.classbtn.on small{color:var(--hl-ink)}

/* --- Cours --- */
.acc{margin-bottom:14px}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;background:var(--surface);border:2px solid var(--ink);border-left:8px solid var(--cat);border-radius:12px;text-align:left}
.acc-h .grow{flex:1;display:grid}
.acc-h b{font:800 18px var(--f-head);background:none}
.acc-h small{color:var(--muted)}
.acc-b{padding:12px 0 2px 12px}

/* --- Leçon --- */
.steps{display:flex;gap:8px;margin:6px 0 14px}
.step{flex:1;padding:6px 8px;border-radius:999px;border:2px solid var(--line);text-align:center;font:700 13px var(--f-head);color:var(--muted);background:var(--surface)}
.step.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sec-h{display:flex;align-items:center;gap:8px;font:800 19px var(--f-head);margin:26px 0 10px}
.callout{padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.callout.goal{background:var(--hl-soft);border-color:var(--hl)}
.callout.rule{background:var(--brand-soft);border-color:var(--brand)}
.callout.keep{background:var(--surface);border:2px solid var(--ink)}
.callout ul{margin:0;padding-left:20px}
.callout li{margin:6px 0}
.tbl-w{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
caption{text-align:left;font:700 15px var(--f-head);padding-bottom:6px}
th,td{border:1.5px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--brand-soft);font:700 14px var(--f-head)}
td:first-child{font-weight:700}
.ex{padding:12px 14px;border-left:6px solid var(--brand);background:var(--surface);border-radius:0 12px 12px 0;margin-bottom:10px;border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.ex p{margin:0}
.ex .n{color:var(--muted);font-size:14px;margin-top:4px}
.plus{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;background:transparent}

/* --- Questions --- */
.qtype{display:inline-block;font:700 13px var(--f-head);padding:2px 10px;border:1.5px solid var(--ink);border-radius:999px;margin-bottom:10px}
.qtext{font-size:19px;line-height:1.5;margin-bottom:14px}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--ink);text-align:center;font-weight:700;padding:0 6px}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.blank.bad{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;font-weight:700}
.opt.center{justify-content:center;font:800 18px var(--f-head)}
.opt:active{background:var(--brand-soft)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--line);display:grid;place-items:center;font:700 14px var(--f-head)}
.opt:disabled{color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tok{min-height:48px;padding:8px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px}
.tok.on{background:var(--hl);border-color:var(--ink);color:var(--hl-ink)}
.tok:disabled{color:var(--ink)}
.tok.ok{background:var(--ok-soft);border-color:var(--ok)}
.tok.bad{background:var(--bad-soft);border-color:var(--bad)}
.tok.miss{border-style:dashed;border-color:var(--ok)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.match>div{display:grid;gap:10px;align-content:start}
.mt{min-height:56px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;font-size:16px;line-height:1.25}
.mt.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--hl)}
.mt:disabled{color:var(--ink)}
.lk0{border-color:#2A6FB0;background:color-mix(in srgb,#2A6FB0 16%,var(--surface))}
.lk1{border-color:#C2571A;background:color-mix(in srgb,#C2571A 16%,var(--surface))}
.lk2{border-color:#8A4FB8;background:color-mix(in srgb,#8A4FB8 16%,var(--surface))}
.lk3{border-color:#0E7C86;background:color-mix(in srgb,#0E7C86 16%,var(--surface))}
.mt.ok{border-color:var(--ok);background:var(--ok-soft)}
.mt.bad{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:14px;color:var(--muted);margin:0 0 10px}
.fb{margin-top:16px;padding:12px 14px 6px;border-left:8px solid var(--ok);background:var(--ok-soft);border-radius:0 12px 12px 0}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb-h{font:800 18px var(--f-head);margin-bottom:6px}
.fb.ok .fb-h{color:var(--ok)}
.fb.bad .fb-h{color:var(--bad)}
.fb-tag{font-family:var(--f-hand);font-size:15px;color:var(--bad);margin:0 0 4px}

/* --- Série (exercices / quiz) --- */
.runtop{display:flex;align-items:center;gap:12px;padding:14px 18px 0 22px;position:relative}
.runtop .pbar{flex:1}
.cnt{font:700 15px var(--f-head);min-width:44px;text-align:right}
.runfoot{position:sticky;bottom:0;padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px)) 30px;background:linear-gradient(transparent,var(--paper) 30%)}
.runfoot:empty{display:none}

/* --- Résultat --- */
.score-big{font:800 40px/1.05 var(--f-head);margin:8px 0 6px}
.score-big span{color:var(--brand)}
.newbadge{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--hl);background:var(--hl-soft);border-radius:12px;margin-bottom:10px}
.newbadge .em{font-size:30px}
.rev{padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);margin-bottom:10px}
.rev.bad{border-left:8px solid var(--bad)}
.rev.ok{border-left:8px solid var(--ok)}
.rev p{margin:0 0 4px}
details{margin-top:16px}
summary{font:800 17px var(--f-head);min-height:44px;display:flex;align-items:center;cursor:pointer}

/* --- Progression --- */
.ringbox{display:flex;align-items:center;gap:18px}
.ring text{font:800 30px var(--f-head);fill:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.stat{padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.stat b{display:block;font:800 26px/1.1 var(--f-head);background:none;color:var(--brand)}
.stat span{font-size:14px;color:var(--muted)}
.cat-row{display:grid;grid-template-columns:28px 1fr 52px;gap:10px;align-items:center;margin-bottom:12px}
.cat-row .pbar i{background:var(--cat)}
.cat-row .pc{font:800 15px var(--f-head);text-align:right}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding:6px 4px 0}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars i{display:block;width:100%;background:var(--brand);border-radius:6px 6px 0 0;min-height:4px}
.bars i.zero{background:var(--line)}
.bars span{font:700 12px var(--f-head);color:var(--muted)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{padding:14px 10px;text-align:center;border:2px solid var(--ink);border-radius:12px;background:var(--surface)}
.badge .em{width:56px;height:56px;margin:0 auto 8px;border-radius:50%;background:var(--hl);border:2px solid var(--ink);display:grid;place-items:center;font-size:28px}
.badge b{display:block;font:700 15px/1.2 var(--f-head);background:none}
.badge small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:4px}
.badge.lock{border-color:var(--line);background:transparent}
.badge.lock .em{background:var(--surface2);border-color:var(--line);filter:grayscale(1);opacity:.6}

/* --- Profil --- */
.avatar{width:84px;height:84px;border-radius:50%;background:var(--brand);color:var(--brand-ink);border:3px solid var(--ink);display:grid;place-items:center;font:800 34px var(--f-head)}
.pid{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:5px;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
.seg button{min-height:46px;border:0;border-radius:10px;background:transparent;font:700 15px var(--f-head)}
.seg button[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink)}

/* --- Navigation basse --- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border-top:2px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;padding:6px 0;border:0;background:none;border-radius:12px;font:700 11.5px var(--f-head);color:var(--muted)}
.nav .ico{font-size:22px;line-height:1.2}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .lb{background:var(--hl);padding:0 6px;border-radius:4px}

/* --- Fenêtres et messages --- */

"gram-nom":{

"ortho-a":{

  regle:"**L'astuce du remplacement** : essaie de remplacer le mot par « **avait** ». Si la phrase garde un sens, écris **a** (sans accent). Sinon, écris **à** (avec accent).",

  retenir:["a (sans accent) = verbe avoir ; on peut le remplacer par « avait ».","à (avec accent) = petit mot qui relie ; on ne peut pas le remplacer par « avait ».","Dans « Il a mal à la tête », on trouve les deux !"],
  plus:"« À » peut exprimer le lieu (à Dakar), le moment (à midi), l'appartenance (ce livre est à moi) ou la manière (venir à pied). Ne le confonds pas non plus avec « as » : c'est le même verbe avoir, mais avec « tu » (tu as).",

    {t:'fill',q:"Le repas est prêt ___ midi.",a:["à"],e:"« À midi » indique le moment : petit mot qui relie."},
    {t:'qcm',q:"Dans « Elle a un chien », par quel mot peut-on remplacer « a » ?",o:["avait","allait","était"],a:0,e:"Elle avait un chien : le remplacement par « avait » fonctionne."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Il donne un cadeau à sa sœur.","Il donne un cadeau a sa sœur.","Il à donné un cadeau à sa sœur."],a:0,e:"« Il donne un cadeau avait sa sœur » n'a pas de sens : on écrit « à sa sœur »."},
    {t:'vf',q:"On écrit correctement : « Il va a l'école. »",a:false,e:"On ne peut pas dire « Il va avait l'école » : il faut écrire « à »."},
    {t:'fill',q:"Tu penses ___ ton avenir.",a:["à"],e:"« Penser à quelque chose » : « à » est un petit mot qui relie."},
    {t:'qcm',q:"Quelle phrase contient le verbe avoir ?",o:["Nous allons à Kaya.","Le chat a soif.","Je téléphone à ma mère."],a:1,e:"« Le chat avait soif » a un sens : c'est le verbe avoir."}
  ]
},

"voc-synonymes":{
  objectif:"Comprendre ce qu'est un synonyme et l'utiliser pour éviter les répétitions.",
  explication:[
    "Deux mots sont **synonymes** quand ils ont un sens proche : « content » et « heureux », « grand » et « immense ».",
    "Les synonymes rendent un texte plus riche : on évite de répéter toujours le même mot. Mais attention, deux synonymes n'ont presque jamais **exactement** le même sens : « épuisé » est plus fort que « fatigué »."
  ],
  regle:"Un bon synonyme a la **même nature** que le mot remplacé (un nom pour un nom, un verbe pour un verbe…) et convient au **contexte** et au **niveau de langue** : familier, courant ou soutenu.",
  tableaux:[{titre:"Trois niveaux de langue",entetes:["Familier","Courant","Soutenu"],lignes:[["un bouquin","un livre","un ouvrage"],["un boulot","un travail","une profession"],["une bagnole","une voiture","un véhicule"]]}],
  exemples:[
    {t:"Il est très **fatigué**. → Il est **épuisé**.",n:"Même nature (adjectif), sens plus fort."},
    {t:"Ce livre est **passionnant**. → Ce livre est **captivant**.",n:"Deux adjectifs de sens proche."},
    {t:"Elle **regarde** le ciel. → Elle **observe** le ciel.",n:"Deux verbes : observer insiste sur l'attention."}
  ],
  retenir:["Des synonymes ont un sens proche.","Ils ont la même nature : nom pour nom, verbe pour verbe.","Le contexte et le niveau de langue comptent.","Les synonymes servent à éviter les répétitions."],
  plus:"Certains synonymes changent le ton ou la nuance : « courageux », « brave » et « téméraire » se ressemblent, mais « téméraire » suggère qu'on prend trop de risques. Le bon écrivain choisit le mot juste, pas seulement un mot qui « ressemble ».",
  mini:{t:'qcm',q:"Quel mot est un synonyme de « grand » ?",o:["petit","immense","lent"],a:1,e:"« Immense » veut dire très grand. « Petit » est le contraire de « grand » : c'est un antonyme."},
  exercices:[
    {t:'qcm',q:"Quel est le synonyme de « content » ?",o:["heureux","triste","fâché"],a:0,e:"Content et heureux ont un sens proche. Triste est le contraire."},
    {t:'match',q:"Associe chaque mot à son synonyme.",pairs:[["commencer","débuter"],["un métier","une profession"],["fatigué","épuisé"],["la peur","la frayeur"]],e:"Chaque paire est composée de deux mots de même nature et de sens proche."},
    {t:'fill',q:"Remplace « très grand » par un seul mot : « ___ ».",a:["immense","énorme","gigantesque","colossal","géant"],e:"Plusieurs réponses sont possibles : immense, énorme, gigantesque, colossal, géant…"},
    {t:'find',q:"Touche les deux mots qui sont synonymes, puis valide.",s:"Le garçon était content et heureux de retrouver sa famille.",a:["content","heureux"],e:"Content et heureux sont deux adjectifs de sens proche."},
    {t:'vf',q:"Deux synonymes ont toujours exactement le même sens.",a:false,e:"Il y a presque toujours une petite nuance : « épuisé » est plus fort que « fatigué »."}
  ],
  quiz:[
    {t:'qcm',q:"Quel mot est un synonyme de « minuscule » ?",o:["tout petit","énorme","coloré"],a:0,e:"Minuscule veut dire très petit."},
    {t:'qcm',q:"Quel verbe est un synonyme de « bavarder » ?",o:["discuter","se taire","dormir"],a:0,e:"Bavarder et discuter ont un sens proche."},
    {t:'vf',q:"Deux synonymes peuvent appartenir à des niveaux de langue différents (un livre, un bouquin).",a:true,e:"Oui : « bouquin » est familier, « livre » est courant, « ouvrage » est soutenu."},
    {t:'qcm',q:"Quel mot peut remplacer « triste » dans « Awa est très triste » ?",o:["joyeuse","malheureuse","rapide"],a:1,e:"Malheureuse est un adjectif de sens proche."},
    {t:'fill',q:"Un synonyme de « commencer » est « ___ ».",a:["débuter","démarrer","entamer"],e:"Plusieurs réponses sont possibles : débuter, démarrer, entamer."},
    {t:'qcm',q:"Pourquoi utiliser des synonymes dans une rédaction ?",o:["Pour éviter les répétitions","Pour écrire plus long","Pour changer le sens de la phrase"],a:0,e:"Les synonymes évitent de répéter le même mot et rendent le texte plus agréable."},
    {t:'vf',q:"Un synonyme d'un verbe peut être un nom.",a:false,e:"Un synonyme a la même nature que le mot remplacé : un verbe se remplace par un verbe."},
    {t:'qcm',q:"Quel mot est un synonyme de « maison » ?",o:["habitation","jardin","toit"],a:0,e:"Une habitation est un lieu où l'on vit, comme une maison."},
    {t:'qcm',q:"Karim dit : « Je n'irai pas ! » d'une voix forte. Quel verbe remplace le mieux « dit » ?",o:["s'écrie","dort","lit"],a:0,e:"« S'écrie » est un synonyme de « dit » qui convient à une voix forte."},
    {t:'qcm',q:"Quel mot est un synonyme de « fatigué » ?",o:["épuisé","reposé","vif"],a:0,e:"Épuisé veut dire très fatigué."}
  ]
},

"expr-paragraphe":{
  objectif:"Écrire un paragraphe clair, organisé et facile à lire.",
  explication:[
    "Un **paragraphe** est un groupe de phrases qui développent **une seule idée**. Quand on change d'idée, on change de paragraphe.",
    "Pour montrer qu'on commence un nouveau paragraphe, on va à la ligne et on fait un **alinéa** : un petit retrait au début de la première ligne."
  ],
  regle:"Un bon paragraphe a trois parties : une **introduction** (on présente l'idée), un **développement** (on explique avec des arguments et des exemples) et une **conclusion** (une phrase finale). Les **connecteurs** (d'abord, ensuite, car, donc…) relient les phrases entre elles.",
  tableaux:[
    {titre:"Les trois parties",entetes:["Partie","Rôle","Exemple"],lignes:[["Introduction","Présenter l'idée","Le sport est bon pour la santé."],["Développement","Expliquer, donner un exemple","D'abord, il renforce le corps. Par exemple, courir muscle les jambes."],["Conclusion","Terminer","C'est pourquoi il faut bouger chaque jour."]]},
    {titre:"Des connecteurs utiles",entetes:["Pour…","Connecteurs"],lignes:[["ordonner","d'abord, ensuite, puis, enfin"],["expliquer la cause","car, en effet, parce que"],["donner la conséquence","donc, c'est pourquoi"],["opposer","mais, pourtant"],["illustrer","par exemple"]]}
  ],
  exemples:[
    {t:"L'école est importante pour l'avenir. **D'abord**, elle apprend à lire, à écrire et à compter. **Ensuite**, elle aide à découvrir des métiers. **Par exemple**, un élève curieux peut rêver de devenir médecin. **Enfin**, elle apprend à vivre avec les autres. **C'est pourquoi** chaque enfant devrait pouvoir y aller.",n:"Une idée principale, trois arguments, une conclusion."}
  ],
  retenir:["Un paragraphe = une idée principale.","Introduction, développement, conclusion.","Un alinéa marque le début d'un paragraphe.","Les connecteurs relient les phrases."],
  plus:"Dans un texte argumentatif, chaque paragraphe suit souvent le schéma **idée, argument, exemple** : on affirme, on explique pourquoi, puis on illustre. Varie les connecteurs pour éviter les répétitions comme « ensuite… ensuite… ».",
  mini:{t:'vf',q:"Un paragraphe développe une seule idée principale.",a:true,e:"Oui. Si tu changes d'idée, tu commences un nouveau paragraphe."},
  exercices:[
    {t:'qcm',q:"Un paragraphe développe…",o:["une seule idée principale","plusieurs sujets sans lien","un seul mot"],a:0,e:"Chaque paragraphe est consacré à une idée."},
    {t:'qcm',q:"Quel connecteur sert à donner un exemple ?",o:["Par exemple","Mais","Enfin"],a:0,e:"« Par exemple » introduit un exemple. « Mais » oppose, « enfin » termine."},
    {t:'vf',q:"On signale un nouveau paragraphe par un alinéa.",a:true,e:"Oui : on va à la ligne et on fait un petit retrait."},
    {t:'match',q:"Associe chaque connecteur à son rôle.",pairs:[["D'abord","commencer une liste d'idées"],["Car","donner une cause"],["Mais","opposer deux idées"],["Enfin","terminer une liste"]],e:"Ces connecteurs guident le lecteur dans ton raisonnement."},
    {t:'qcm',q:"Ton paragraphe parle de l'importance du sommeil. Quelle phrase peut le conclure ?",o:["C'est pourquoi il est important de bien dormir.","D'abord, on se couche tôt.","Par exemple, Awa dort huit heures."],a:0,e:"« C'est pourquoi » annonce une conclusion. « D'abord » et « par exemple » appartiennent au développement."}
  ],
  quiz:[
    {t:'qcm',q:"Un paragraphe est composé…",o:["de phrases qui parlent d'une même idée","d'un seul mot","de phrases sans lien"],a:0,e:"Toutes les phrases d'un paragraphe tournent autour de la même idée."},
    {t:'vf',q:"Un paragraphe peut se terminer par une phrase de conclusion.",a:true,e:"Oui : elle résume l'idée ou en tire une conséquence."},
    {t:'qcm',q:"Quel connecteur exprime la cause ?",o:["car","donc","mais"],a:0,e:"« Car » explique pourquoi."},
    {t:'qcm',q:"Quel connecteur exprime la conséquence ?",o:["donc","mais","car"],a:0,e:"« Donc » annonce le résultat."},
    {t:'qcm',q:"Quel mot convient pour commencer une énumération ?",o:["D'abord","Enfin","Pourtant"],a:0,e:"« D'abord » ouvre une liste d'idées."},
    {t:'vf',q:"Un alinéa est un petit retrait au début d'un paragraphe.",a:true,e:"C'est ce qui montre qu'un nouveau paragraphe commence."},
    {t:'fill',q:"Pour terminer une énumération, on écrit « ___ ».",a:["enfin"],e:"« Enfin » introduit la dernière idée."},
    {t:'qcm',q:"Quelle phrase peut servir d'introduction ?",o:["Le sport est très bon pour la santé.","Enfin, il faut bouger.","Par exemple, Awa court chaque jour."],a:0,e:"Elle présente l'idée du paragraphe. Les autres appartiennent au développement."},
    {t:'qcm',q:"Pourquoi donne-t-on un exemple ?",o:["Pour illustrer une idée","Pour allonger le texte","Pour changer de sujet"],a:0,e:"Un exemple rend l'idée plus concrète."},
    {t:'vf',q:"Un paragraphe peut parler de trois sujets sans lien.",a:false,e:"Un paragraphe développe une seule idée."}
  ]
},

"litt-recit":{
  objectif:"Reconnaître un récit et repérer ses éléments : personnages, lieu, temps, narrateur et événements.",
  explication:[
    "Un **récit** raconte une histoire : des **personnages** vivent des **événements** dans un **lieu** et à un **moment** précis.",
    "Les contes qu'on raconte le soir, les romans, les fables et les légendes sont des récits. Un récit peut être inventé ou raconter des faits réels.",
    "Toute histoire est racontée par quelqu'un : le **narrateur**. Ce n'est pas forcément l'auteur du livre !"
  ],
  regle:"Pour repérer les éléments d'un récit, pose ces questions : **Qui ?** (les personnages), **Où ?** (le lieu), **Quand ?** (le temps), **Que se passe-t-il ?** (les événements). Si le narrateur dit « **je** » ou « **nous** », il fait partie de l'histoire. S'il dit « **il** » ou « **elle** », il raconte de l'extérieur.",
  tableaux:[{titre:"Le schéma narratif",entetes:["Étape","Ce qui se passe"],lignes:[["Situation initiale","On présente les personnages, le lieu, le temps."],["Élément perturbateur","Un événement change la situation."],["Péripéties","Les aventures et les difficultés s'enchaînent."],["Dénouement","Le problème trouve une solution."],["Situation finale","Une nouvelle situation s'installe."]]}],
  exemples:[
    {t:"**Un matin**, **Moussa** partit à la pêche **au bord du fleuve**.",n:"Quand ? un matin. Qui ? Moussa. Où ? au bord du fleuve."},
    {t:"**Je** marchais vers le village quand la pluie a commencé.",n:"Le narrateur dit « je » : il fait partie de l'histoire."},
    {t:"**Il était une fois** une petite fille très curieuse.",n:"Formule classique pour ouvrir un conte (situation initiale)."}
  ],
  retenir:["Un récit raconte une histoire.","Il y a des personnages, un lieu, un temps et des événements.","Le narrateur raconte : ce n'est pas toujours l'auteur.","Schéma narratif : situation initiale, élément perturbateur, péripéties, dénouement, situation finale."],
  plus:"Dans un roman à la première personne, le narrateur est souvent un personnage inventé, différent de l'auteur. On distingue aussi le **point de vue** : interne (on voit avec les yeux d'un personnage), externe (on observe de l'extérieur) ou omniscient (le narrateur sait tout). Au passé, on emploie le passé simple pour les actions principales et l'imparfait pour les descriptions.",
  mini:{t:'qcm',q:"Dans « Il était une fois un roi très sage », qui est le personnage ?",o:["un roi très sage","Il était une fois","très"],a:0,e:"Le personnage est celui dont on parle : le roi. « Il était une fois » ouvre l'histoire."},
  exercices:[
    {t:'qcm',q:"À quoi sert un récit ?",o:["À raconter une histoire","À donner un ordre","À faire une liste de courses"],a:0,e:"Un récit raconte des événements vécus par des personnages."},
    {t:'vf',q:"Dans « Je marchais vers le village », le narrateur fait partie de l'histoire.",a:true,e:"Il dit « je » : c'est un personnage de l'histoire."},
    {t:'match',q:"Associe chaque question à l'élément du récit.",pairs:[["Qui ?","les personnages"],["Où ?","le lieu"],["Quand ?","le temps"],["Que se passe-t-il ?","les événements"]],e:"Ces quatre questions t'aident à comprendre n'importe quel récit."},
    {t:'qcm',q:"Dans « Un matin, Moussa partit à la pêche au bord du fleuve. », quelle expression indique le temps ?",o:["Un matin","Moussa","au bord du fleuve"],a:0,e:"« Un matin » répond à la question Quand ?"},
    {t:'qcm',q:"Quelle étape vient en premier dans le schéma narratif ?",o:["La situation initiale","Le dénouement","La situation finale"],a:0,e:"On commence par présenter les personnages, le lieu et le temps."}
  ],
  quiz:[
    {t:'qcm',q:"Quel est le rôle du narrateur ?",o:["Raconter l'histoire","Écrire le livre","Corriger les fautes"],a:0,e:"Le narrateur est celui qui raconte."},
    {t:'vf',q:"Le narrateur et l'auteur sont toujours la même personne.",a:false,e:"Le narrateur peut être un personnage inventé par l'auteur."},
    {t:'qcm',q:"« Il était une fois » annonce…",o:["le début d'un conte","la fin d'un récit","une recette de cuisine"],a:0,e:"C'est une formule classique pour ouvrir un conte."},
    {t:'qcm',q:"Quelle étape correspond à l'événement qui change la situation ?",o:["L'élément perturbateur","La situation initiale","La situation finale"],a:0,e:"L'élément perturbateur lance l'histoire."},
    {t:'vf',q:"Un récit comporte des personnages.",a:true,e:"Sans personnages, il n'y a pas d'histoire."},
    {t:'qcm',q:"Lequel de ces textes est un récit ?",o:["Un conte","Une recette de cuisine","Un mode d'emploi"],a:0,e:"Un conte raconte une histoire."},
    {t:'qcm',q:"Dans « Nous avons marché longtemps », le narrateur…",o:["fait partie de l'histoire","n'est pas dans l'histoire","est l'auteur du livre"],a:0,e:"Il dit « nous » : il est l'un des personnages."},
    {t:'qcm',q:"Que trouve-t-on à la fin d'un récit ?",o:["La situation finale","La situation initiale","L'élément perturbateur"],a:0,e:"La situation finale montre comment l'histoire se termine."},
    {t:'vf',q:"La situation initiale présente les personnages et le lieu.",a:true,e:"C'est le point de départ de l'histoire."},
    {t:'fill',q:"Le lieu répond à la question « ___ ? »",a:["où"],e:"Où ? le lieu. Qui ? les personnages. Quand ? le temps."}
  ]
},

/* ---- Leçons ajoutées (V1.1) ---- */
"gram-determinant":{
  objectif:"Reconnaître les déterminants, en distinguer les grandes familles et les accorder avec le nom.",
  explication:[
    "Le **déterminant** est un petit mot placé **devant le nom**. Il apporte deux informations : le **genre** (masculin ou féminin) et le **nombre** (singulier ou pluriel). Dans « la mangue », « la » est le déterminant : il nous dit que « mangue » est féminin et singulier.",
    "Il existe plusieurs familles de déterminants. Les **articles** : le, la, les (définis) et un, une, des (indéfinis). Les **déterminants possessifs** : mon, ma, mes, ton, ta, tes, son, sa, ses, notre, votre, leur… Les **déterminants démonstratifs** : ce, cet, cette, ces. Enfin les **déterminants numéraux** : deux, trois, dix…",
    "Le déterminant **s'accorde** avec le nom : on dit « un cahier » mais « une table », « ce livre » mais « cette histoire », « mon frère » mais « mes frères ». Quand le nom change, le déterminant change aussi."
  ],
  regle:"Le déterminant se place **devant le nom** et **s'accorde en genre et en nombre** avec lui. Un nom commun est presque toujours précédé d'un déterminant.",
  tableaux:[{titre:"Les principaux déterminants",entetes:["Famille","Masculin singulier","Féminin singulier","Pluriel"],lignes:[["Article défini","le (l')","la (l')","les"],["Article indéfini","un","une","des"],["Possessif (à moi)","mon","ma","mes"],["Démonstratif","ce (cet)","cette","ces"]]}],
  exemples:[
    {t:"**Mon** frère range **ses** livres.",n:"« Mon » et « ses » sont des déterminants possessifs : ils indiquent à qui appartiennent le frère et les livres."},
    {t:"**Cette** mangue est mûre.",n:"« Cette » est un déterminant démonstratif, féminin singulier : il sert à montrer la mangue."},
    {t:"**Les** élèves écoutent **le** maître.",n:"« Les » et « le » sont des articles définis, accordés avec « élèves » (pluriel) et « maître » (masculin singulier)."}
  ],
  retenir:["Le déterminant se place devant le nom.","Il indique le genre et le nombre du nom.","Articles, possessifs, démonstratifs et numéraux sont des déterminants.","Le déterminant s'accorde avec le nom."],
  plus:"Devant un nom **féminin qui commence par une voyelle**, on emploie « mon », « ton », « son » : on dit « mon amie » et non « ma amie ». Devant un nom masculin qui commence par une voyelle, « ce » devient « cet » : « cet arbre ». Attention à « leur » : comme déterminant, il s'accorde en nombre (« leur cahier », « leurs cahiers »), alors que le pronom « leur » (« Je leur parle ») ne change jamais.",
  mini:{t:'qcm',q:"Dans « Cette maison est grande », quel mot est un déterminant ?",o:["Cette","est","grande"],a:0,e:"« Cette » est placé devant le nom « maison » et s'accorde avec lui : c'est un déterminant démonstratif."},
  exercices:[
    {t:'qcm',q:"Quel groupe nominal est correct ?",o:["une cahier","un cahier","des cahier"],a:1,e:"« Cahier » est un nom masculin singulier : on écrit « un cahier »."},
    {t:'fill',q:"Complète avec l'article défini pluriel : ___ élèves jouent dans la cour.",a:["les"],e:"« Élèves » est au pluriel : l'article défini pluriel est « les »."},
    {t:'find',q:"Touche tous les déterminants de la phrase, puis valide.",s:"Ma sœur mange une mangue avec ces bananes.",a:["Ma","une","ces"],e:"« Ma » (possessif), « une » (article indéfini) et « ces » (démonstratif) précèdent chacun un nom."},
    {t:'match',q:"Associe chaque déterminant à sa famille.",pairs:[["le","article défini"],["un","article indéfini"],["mon","déterminant possessif"],["cette","déterminant démonstratif"]],e:"« Le » est défini, « un » indéfini, « mon » indique la possession et « cette » sert à montrer."},
    {t:'vf',q:"Le déterminant se place après le nom.",a:false,e:"Le déterminant se place toujours devant le nom : « la table », et non « table la »."}
  ],
  quiz:[
    {t:'qcm',q:"À quoi sert un déterminant ?",o:["À accompagner un nom et donner son genre et son nombre","À exprimer une action","À remplacer un nom"],a:0,e:"Le déterminant précède le nom et lui donne son genre et son nombre."},
    {t:'qcm',q:"Dans « un stylo bleu », quel mot est le déterminant ?",o:["un","stylo","bleu"],a:0,e:"« Un » est placé devant le nom « stylo » : c'est le déterminant."},
    {t:'fill',q:"Complète avec un démonstratif : ___ chaise est cassée.",a:["cette"],e:"« Chaise » est féminin singulier : on écrit « cette chaise »."},
    {t:'vf',q:"« Des » est un article indéfini.",a:true,e:"Oui : « un », « une » et « des » sont les articles indéfinis."},
    {t:'qcm',q:"Quel groupe est correct ?",o:["ce arbre","cet arbre","cette arbre"],a:1,e:"Devant un nom masculin qui commence par une voyelle, on écrit « cet » : cet arbre."},
    {t:'fill',q:"Complète avec un possessif : Karim range ___ affaires. (les affaires de Karim, au pluriel)",a:["ses"],e:"Les affaires sont plusieurs et elles appartiennent à Karim : « ses affaires »."},
    {t:'qcm',q:"Quel mot est un déterminant possessif ?",o:["mes","les","ces"],a:0,e:"« Mes » indique la possession : mes cahiers. « Les » est un article et « ces » un démonstratif."},
    {t:'vf',q:"Un nom commun est le plus souvent précédé d'un déterminant.",a:true,e:"C'est presque toujours le cas : le chat, une école, mes amis."},
    {t:'qcm',q:"Quel est le pluriel de « une mangue » ?",o:["des mangues","une mangues","des mangue"],a:0,e:"Le déterminant et le nom prennent la marque du pluriel : des mangues."},
    {t:'fix',q:"Corrige la phrase : « Les élève écoutent le maître. »",o:["Les élèves écoutent le maître.","Les élève écoutent les maître.","Le élèves écoutent le maître."],a:0,e:"Le déterminant « les » est au pluriel : le nom « élèves » doit l'être aussi."}
  ]
},

"gram-adjectif":{
  objectif:"Reconnaître un adjectif qualificatif, savoir à quel nom il se rapporte et l'accorder correctement.",
  explication:[
    "L'**adjectif qualificatif** apporte une précision sur un nom : il dit comment est une personne, un animal ou une chose. Dans « une **grande** maison », « grande » est un adjectif qui qualifie « maison ». Il répond à la question : comment est-il ?",
    "L'adjectif peut se placer **juste à côté du nom** (« un **petit** chat ») ou être séparé du nom par un verbe comme **être, sembler, paraître, devenir, rester** (« Le chat est **petit** »). Dans ce second cas, on dit que l'adjectif est **attribut** du sujet.",
    "L'adjectif **s'accorde** en genre et en nombre avec le nom qu'il qualifie : « un livre intéressant », « une histoire intéressante », « des histoires intéressantes ». Au féminin, on ajoute en général un **-e** ; au pluriel, on ajoute en général un **-s**."
  ],
  regle:"L'adjectif **s'accorde en genre et en nombre** avec le nom auquel il se rapporte : on ajoute **-e** au féminin et **-s** au pluriel. Pour trouver le nom qu'il qualifie, pose la question : « Qui est… ? / Qu'est-ce qui est… ? ».",
  tableaux:[{titre:"Former le féminin de l'adjectif",entetes:["Masculin","Féminin","Ce qui change"],lignes:[["grand","grande","on ajoute -e"],["joyeux","joyeuse","-eux devient -euse"],["gentil","gentille","on double le l"],["bon","bonne","on double le n"]]}],
  exemples:[
    {t:"Une **belle** fleur **rouge** pousse dans le jardin.",n:"« Belle » et « rouge » qualifient le nom « fleur » : ils sont au féminin singulier."},
    {t:"Les élèves sont **attentifs**.",n:"« Attentifs » est attribut du sujet « les élèves » : il s'accorde au masculin pluriel."},
    {t:"Awa semble **fatiguée**.",n:"Après le verbe « sembler », l'adjectif s'accorde avec le sujet Awa : féminin singulier."}
  ],
  retenir:["L'adjectif qualificatif précise un nom.","Il s'accorde en genre et en nombre avec ce nom.","Au féminin on ajoute en général -e, au pluriel -s.","Il peut être séparé du nom par le verbe être (attribut)."],
  plus:"Au masculin pluriel, les adjectifs en **-al** font en général **-aux** : un problème national, des problèmes nationaux. Quelques-uns prennent un simple -s (des combats navals, des rires fatals). Les adjectifs de couleur formés à partir d'un nom sont **invariables** : des chaussures marron, des robes orange. Et lorsqu'un adjectif qualifie plusieurs noms de genres différents, il se met au **masculin pluriel** : « un garçon et une fille contents ».",
  mini:{t:'qcm',q:"Dans « un gros ballon rouge », combien y a-t-il d'adjectifs qualificatifs ?",o:["1","2","3"],a:1,e:"« Gros » et « rouge » précisent tous les deux le nom « ballon » : il y a deux adjectifs."},
  exercices:[
    {t:'find',q:"Touche tous les adjectifs qualificatifs, puis valide.",s:"Le vieux marchand vend des mangues sucrées.",a:["vieux","sucrées"],e:"« Vieux » qualifie le marchand et « sucrées » qualifie les mangues."},
    {t:'fill',q:"Accorde l'adjectif : une histoire ___ (amusant)",a:["amusante"],e:"« Histoire » est un nom féminin singulier : on ajoute un -e à l'adjectif."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Les fleurs sont belles.","Les fleurs sont beau.","Les fleurs sont beaux."],a:0,e:"« Fleurs » est féminin pluriel : l'adjectif s'écrit « belles »."},
    {t:'fix',q:"Corrige la phrase : « Mes sœurs sont content. »",o:["Mes sœurs sont contentes.","Mes sœurs sont contents.","Mes sœurs est contentes."],a:0,e:"« Contentes » s'accorde avec « sœurs » (féminin pluriel) et le verbe s'écrit « sont »."},
    {t:'match',q:"Associe chaque adjectif à son féminin.",pairs:[["gentil","gentille"],["joyeux","joyeuse"],["bon","bonne"],["grand","grande"]],e:"« Gentil » double son l, « joyeux » devient « joyeuse », « bon » double son n, « grand » prend simplement un e."}
  ],
  quiz:[
    {t:'qcm',q:"À quoi sert un adjectif qualificatif ?",o:["À apporter une précision sur un nom","À exprimer une action","À remplacer un nom"],a:0,e:"L'adjectif qualificatif dit comment est la personne, l'animal ou la chose désignée par le nom."},
    {t:'qcm',q:"Dans « une petite fille », quel mot est l'adjectif ?",o:["petite","fille","une"],a:0,e:"« Petite » précise le nom « fille » : c'est l'adjectif."},
    {t:'fill',q:"Accorde l'adjectif : des livres ___ (intéressant)",a:["intéressants"],e:"« Livres » est masculin pluriel : l'adjectif prend un -s."},
    {t:'vf',q:"L'adjectif qualificatif s'accorde avec le nom qu'il qualifie.",a:true,e:"C'est la règle d'accord de l'adjectif : même genre, même nombre que le nom."},
    {t:'qcm',q:"Quel est le féminin de « joyeux » ?",o:["joyeuse","joyeuxe","joyeuze"],a:0,e:"Les adjectifs en -eux font -euse au féminin."},
    {t:'fill',q:"Accorde l'adjectif : Awa est très ___ (content).",a:["contente"],e:"Awa est une fille : l'adjectif attribut s'accorde au féminin."},
    {t:'vf',q:"Dans « Le ciel est bleu », le mot « bleu » est un verbe.",a:false,e:"« Bleu » est un adjectif, attribut du sujet « le ciel »."},
    {t:'qcm',q:"Dans « Les enfants semblent heureux », à quel mot se rapporte l'adjectif « heureux » ?",o:["enfants","semblent","Les"],a:0,e:"L'adjectif attribut se rapporte au sujet : les enfants sont heureux."},
    {t:'fill',q:"Complète avec le féminin de « bon » : une ___ idée.",a:["bonne"],e:"Au féminin, « bon » double son n : bonne."},
    {t:'fix',q:"Corrige le groupe nominal : « Des chaussures noire »",o:["Des chaussures noires","Des chaussure noire","Des chaussures noirs"],a:0,e:"« Chaussures » est féminin pluriel : l'adjectif s'écrit « noires »."}
  ]
},

"gram-pronom":{
  objectif:"Reconnaître les pronoms personnels et retrouver à quel mot ils renvoient.",
  explication:[
    "Le **pronom** est un mot qui **remplace** un nom ou un groupe de mots déjà cité, pour éviter les répétitions. Dans « Awa aime lire. **Elle** lit tous les soirs », le pronom « elle » remplace « Awa ».",
    "Les **pronoms personnels sujets** sont : je, tu, il, elle, on, nous, vous, ils, elles. Ils désignent celui qui parle (je, nous), celui à qui l'on parle (tu, vous) ou celui dont on parle (il, elle, ils, elles).",
    "Le pronom peut aussi être un **complément** du verbe : « Je **le** vois », « Je **lui** parle », « Il **nous** appelle ». Pour bien le comprendre, il faut toujours chercher **le mot qu'il remplace**."
  ],
  regle:"Un pronom **remplace un nom ou un groupe nominal**. Pour comprendre une phrase, cherche toujours **de quel mot il tient la place**. Le pronom a le même genre et le même nombre que le mot qu'il remplace.",
  tableaux:[{titre:"Les pronoms personnels sujets",entetes:["Personne","Singulier","Pluriel"],lignes:[["1re personne (celui qui parle)","je","nous"],["2e personne (celui à qui l'on parle)","tu","vous"],["3e personne (celui dont on parle)","il, elle, on","ils, elles"]]}],
  exemples:[
    {t:"Fatou et Awa sont amies. **Elles** jouent ensemble.",n:"« Elles » remplace « Fatou et Awa » : féminin pluriel."},
    {t:"J'ai acheté un cahier. Je **l'**ai posé sur la table.",n:"« L' » remplace « un cahier » pour éviter de le répéter."},
    {t:"**Nous** allons au marché.",n:"« Nous » désigne celui qui parle et une ou plusieurs autres personnes."}
  ],
  retenir:["Le pronom remplace un nom ou un groupe nominal.","Je et nous : celui qui parle ; tu et vous : celui à qui l'on parle.","Il, elle, ils, elles : celui ou ceux dont on parle.","Le pronom est du même genre et du même nombre que ce qu'il remplace."],
  plus:"Le pronom « **on** » se conjugue comme « il » : on chante, on finit. À l'oral, il remplace souvent « nous », mais à l'écrit, le verbe reste toujours à la 3e personne du singulier. Les pronoms « **y** » et « **en** » remplacent un lieu ou un groupe introduit par « à » ou « de » : « Il va au marché → Il **y** va » ; « Elle parle de son voyage → Elle **en** parle ».",
  mini:{t:'qcm',q:"« Karim est fatigué. ___ dort. » Quel pronom convient ?",o:["Il","Elle","Ils"],a:0,e:"Karim est un garçon (masculin singulier) : le pronom qui le remplace est « il »."},
  exercices:[
    {t:'qcm',q:"Dans « Les enfants jouent. Ils rient. », quel groupe de mots le pronom « ils » remplace-t-il ?",o:["Les enfants","jouent","rient"],a:0,e:"« Ils » remplace « les enfants » : masculin pluriel."},
    {t:'fill',q:"Complète avec un pronom : Fatou est gentille. ___ aide sa mère.",a:["elle"],e:"Fatou est féminin singulier : le pronom est « elle »."},
    {t:'find',q:"Touche tous les pronoms personnels de la phrase, puis valide.",s:"Elle pense que tu viens avec nous.",a:["Elle","tu","nous"],e:"« Elle », « tu » et « nous » sont des pronoms personnels."},
    {t:'vf',q:"Le pronom remplace un nom pour éviter une répétition.",a:true,e:"C'est son rôle principal : « pro-nom » signifie « à la place du nom »."},
    {t:'match',q:"Associe chaque pronom à ce qu'il désigne.",pairs:[["je","celui qui parle"],["tu","celui à qui l'on parle"],["elles","plusieurs filles dont on parle"],["nous","celui qui parle et d'autres personnes"]],e:"Je et nous désignent celui qui parle, tu désigne celui à qui l'on parle, elles désigne plusieurs filles ou choses féminines dont on parle."}
  ],
  quiz:[
    {t:'qcm',q:"Que fait un pronom ?",o:["Il remplace un nom ou un groupe nominal","Il précise un nom","Il exprime une action"],a:0,e:"Le pronom tient la place d'un nom ou d'un groupe nominal."},
    {t:'qcm',q:"Quel mot est un pronom ?",o:["nous","nouveau","notre"],a:0,e:"« Nous » remplace des personnes. « Notre » est un déterminant et « nouveau » un adjectif."},
    {t:'fill',q:"Complète : Mon frère joue au football. ___ marque un but.",a:["il"],e:"Mon frère est masculin singulier : on le remplace par « il »."},
    {t:'vf',q:"« Je » est un pronom de la 3e personne.",a:false,e:"« Je » est un pronom de la 1re personne : c'est celui qui parle."},
    {t:'qcm',q:"Fatou et sa sœur chantent. ___ sont contentes.",o:["Elles","Ils","Elle"],a:0,e:"Fatou et sa sœur sont deux filles : féminin pluriel, donc « elles »."},
    {t:'fill',q:"Complète : Toi et moi, ___ irons au marché.",a:["nous"],e:"Toi et moi, cela fait plusieurs personnes dont celui qui parle : « nous »."},
    {t:'vf',q:"Le pronom « tu » désigne celui à qui l'on parle.",a:true,e:"Oui : « tu » est la 2e personne du singulier."},
    {t:'qcm',q:"Dans « J'ai vu Karim et je lui ai parlé », que remplace le pronom « lui » ?",o:["Karim","je","ai vu"],a:0,e:"« Lui » remplace « Karim » : je ai parlé à Karim."},
    {t:'qcm',q:"Quel pronom peut remplacer « Awa et toi » ?",o:["vous","ils","nous"],a:0,e:"Quand on s'adresse à plusieurs personnes, on emploie « vous »."},
    {t:'fix',q:"Corrige : « Les filles chantent. Ils sont heureuses. »",o:["Elles sont heureuses.","Ils sont heureuses.","Elle est heureuses."],a:0,e:"Le pronom doit être féminin pluriel pour remplacer « les filles » : « elles »."}
  ]
},

"gram-verbe":{
  objectif:"Reconnaître un verbe, trouver son infinitif et son sujet, et comprendre qu'il se conjugue.",
  explication:[
    "Le **verbe** exprime une **action** (courir, manger, lire) ou un **état** (être, sembler, paraître). C'est le mot le plus important de la phrase : c'est autour de lui que la phrase s'organise. C'est aussi le seul mot qui **change de forme** selon la personne et le temps : « je mange », « nous mangions », « ils mangeront ».",
    "Pour nommer un verbe, on utilise son **infinitif** : chanter, finir, prendre. Dans « elles chantaient », l'infinitif est « chanter ». C'est sous cette forme que l'on cherche un verbe dans le dictionnaire.",
    "Le verbe **s'accorde avec son sujet**. Pour trouver le sujet, on pose la question « **Qui est-ce qui ?** » (ou « Qu'est-ce qui ? ») devant le verbe : « Les élèves écoutent. » → Qui est-ce qui écoute ? Les élèves."
  ],
  regle:"Le verbe s'accorde **en personne et en nombre** avec son **sujet**. Pour trouver le sujet : « **Qui est-ce qui** + verbe ? ». Pour trouver l'infinitif, on met la phrase avec « il faut » ou on pense à « Je voudrais… ».",
  tableaux:[{titre:"Les trois groupes de verbes",entetes:["Groupe","Infinitif en…","Exemples"],lignes:[["1er groupe","-er (sauf aller)","chanter, manger, jouer"],["2e groupe","-ir (avec -issons)","finir, grandir, choisir"],["3e groupe","tous les autres verbes","prendre, faire, aller, venir, être, avoir"]]}],
  exemples:[
    {t:"Les élèves **écoutent** le maître.",n:"Infinitif : écouter. Le verbe s'accorde avec « les élèves » (3e personne du pluriel)."},
    {t:"Fatou **est** contente.",n:"« Est » exprime un état : c'est le verbe être."},
    {t:"Nous **finissons** nos devoirs.",n:"Infinitif : finir. C'est un verbe du 2e groupe (finissons)."}
  ],
  retenir:["Le verbe exprime une action ou un état.","Il se conjugue : il change selon la personne et le temps.","On le nomme par son infinitif.","Il s'accorde avec son sujet."],
  plus:"Le verbe peut être formé de **deux mots** : un auxiliaire (avoir ou être) et un participe passé. Dans « Nous avons mangé », le verbe est « avons mangé ». La négation encadre le verbe conjugué : « Il **ne** mange **pas** ». Attention aux verbes à l'infinitif : dans « Je veux partir », seul « veux » est conjugué ; « partir » reste à l'infinitif.",
  mini:{t:'qcm',q:"Quel est l'infinitif de « nous finissons » ?",o:["finir","finisser","finer"],a:0,e:"Le verbe est « finir » : c'est un verbe du 2e groupe."},
  exercices:[
    {t:'find',q:"Touche tous les verbes conjugués, puis valide.",s:"Awa lit un livre et Karim écoute.",a:["lit","écoute"],e:"« Lit » (lire) et « écoute » (écouter) sont conjugués : ce sont les verbes de la phrase."},
    {t:'qcm',q:"Quel est l'infinitif de « elles prennent » ?",o:["prendre","prener","prenner"],a:0,e:"« Prennent » est une forme du verbe « prendre »."},
    {t:'fill',q:"Conjugue au présent : Les enfants ___ dans la cour. (jouer)",a:["jouent"],e:"Le sujet « les enfants » est à la 3e personne du pluriel : jouent."},
    {t:'vf',q:"Le verbe ne change jamais de forme.",a:false,e:"Le verbe change de forme selon la personne et le temps : il se conjugue."},
    {t:'qcm',q:"Dans « Mes amis arrivent demain », quel est le sujet du verbe ?",o:["Mes amis","demain","arrivent"],a:0,e:"Qui est-ce qui arrive ? Mes amis : c'est le sujet."}
  ],
  quiz:[
    {t:'qcm',q:"Que peut exprimer un verbe ?",o:["Une action ou un état","Un lieu","Une qualité"],a:0,e:"Le verbe exprime ce que fait le sujet ou l'état dans lequel il se trouve."},
    {t:'qcm',q:"Quel mot est un verbe ?",o:["courir","course","coureur"],a:0,e:"« Courir » exprime une action et se conjugue."},
    {t:'fill',q:"Conjugue au présent : Tu ___ bien. (chanter)",a:["chantes"],e:"Avec « tu », les verbes du 1er groupe se terminent par -es."},
    {t:'vf',q:"L'infinitif de « nous prenons » est « prendre ».",a:true,e:"Oui : « prenons » est une forme conjuguée du verbe « prendre »."},
    {t:'qcm',q:"À quel groupe appartient le verbe « finir » ?",o:["1er groupe","2e groupe","3e groupe"],a:1,e:"Finir a un infinitif en -ir et donne « nous finissons » : 2e groupe."},
    {t:'qcm',q:"Dans « Les oiseaux chantent », quel est le sujet ?",o:["Les oiseaux","chantent","les"],a:0,e:"Qui est-ce qui chante ? Les oiseaux."},
    {t:'fill',q:"Conjugue au présent : Fatou et Awa ___ au ballon. (jouer)",a:["jouent"],e:"Deux sujets : le verbe est à la 3e personne du pluriel."},
    {t:'vf',q:"Le verbe « être » exprime une action.",a:false,e:"Le verbe « être » exprime un état."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Ils mangent du riz.","Ils mange du riz.","Ils mangez du riz."],a:0,e:"Avec « ils », le verbe du 1er groupe se termine par -ent."},
    {t:'fix',q:"Corrige la phrase : « Les élèves écoute le maître. »",o:["Les élèves écoutent le maître.","Les élèves écoutes le maître.","Les élève écoute le maître."],a:0,e:"Le verbe s'accorde avec son sujet « les élèves » : il se termine par -ent."}
  ]
},

"gram-cod":{
  objectif:"Reconnaître le complément d'objet direct (COD) et le complément d'objet indirect (COI) d'un verbe.",
  explication:[
    "Un **complément d'objet** est un groupe de mots qui complète le verbe : il dit **sur quoi ou sur qui porte l'action**. Sans lui, la phrase est souvent incomplète : « Le maître corrige… » (quoi ?).",
    "Le **COD** (complément d'objet **direct**) est relié au verbe **sans préposition**. Pour le trouver, on pose la question « **qui ?** » ou « **quoi ?** » après le verbe : « Awa lit **un roman**. » → Awa lit quoi ? Un roman.",
    "Le **COI** (complément d'objet **indirect**) est relié au verbe **par une préposition** (à, de, sur…). On pose les questions « **à qui ?**, **à quoi ?**, **de qui ?**, **de quoi ?** » : « Awa parle **à sa mère**. » → Awa parle à qui ? À sa mère."
  ],
  regle:"**COD** : placé après le verbe, **sans préposition** (question « qui ? quoi ? »). **COI** : placé après le verbe, **avec une préposition** (à, de…). Le COD peut être remplacé par **le, la, les** ; le COI de personne par **lui, leur**.",
  tableaux:[{titre:"COD ou COI ?",entetes:["","COD","COI"],lignes:[["Lien avec le verbe","direct, sans préposition","indirect, avec à, de…"],["Question","Qui ? Quoi ?","À qui ? À quoi ? De qui ? De quoi ?"],["Exemple","Karim mange une mangue.","Karim parle à Awa."],["Pronom de remplacement","le, la, les","lui, leur (pour des personnes)"]]}],
  exemples:[
    {t:"Le maître corrige **les cahiers**.",n:"COD : le maître corrige quoi ? Les cahiers. Aucune préposition."},
    {t:"Fatou téléphone **à sa grand-mère**.",n:"COI : Fatou téléphone à qui ? À sa grand-mère. La préposition « à » relie le complément au verbe."},
    {t:"Je vois mes amis. → Je **les** vois.",n:"Le COD « mes amis » est remplacé par le pronom « les »."}
  ],
  retenir:["Le COD complète le verbe sans préposition.","Le COI complète le verbe avec une préposition (à, de…).","On trouve le COD avec « qui ? / quoi ? » après le verbe.","Le COD se remplace par le, la, les ; le COI par lui, leur."],
  plus:"Un COD peut se trouver **avant** le verbe quand c'est un pronom ou une question : « Ce livre, je **l'**ai lu. » Cela a une grande importance pour l'accord du participe passé avec **avoir** : il s'accorde avec le COD s'il est placé avant le verbe (« les mangues que j'ai mangé**es** »).",
  mini:{t:'qcm',q:"Dans « Le chat attrape la souris », quel est le COD ?",o:["la souris","Le chat","attrape"],a:0,e:"Le chat attrape quoi ? La souris : c'est le COD."},
  exercices:[
    {t:'find',q:"Touche tous les mots qui forment le COD, puis valide.",s:"Karim mange une mangue.",a:["une","mangue"],e:"Karim mange quoi ? Une mangue : le COD est « une mangue »."},
    {t:'qcm',q:"Quelle phrase contient un COI ?",o:["Il parle à son ami.","Il mange une pomme.","Il ouvre la porte."],a:0,e:"« À son ami » est relié au verbe par la préposition « à » : c'est un COI."},
    {t:'vf',q:"Un COD est relié au verbe par une préposition.",a:false,e:"C'est le COI qui est relié par une préposition. Le COD est direct : sans préposition."},
    {t:'fill',q:"Remplace le COD par un pronom : Je vois Awa. → Je ___ vois.",a:["la"],e:"Awa est féminin singulier : le pronom COD est « la »."},
    {t:'match',q:"Associe chaque phrase à la fonction du groupe souligné.",pairs:[["Il lit un livre.","COD : un livre"],["Il parle à Awa.","COI : à Awa"],["Elle mange du riz.","COD : du riz"],["Elle pense à son avenir.","COI : à son avenir"]],e:"Quand une préposition (à) relie le complément au verbe, c'est un COI. Sinon, c'est un COD."}
  ],
  quiz:[
    {t:'qcm',q:"Comment trouve-t-on le COD ?",o:["En posant « qui ? » ou « quoi ? » après le verbe","En cherchant le sujet","En cherchant le nom propre"],a:0,e:"On pose la question « qui ? » ou « quoi ? » juste après le verbe."},
    {t:'qcm',q:"Dans « Le berger garde les moutons », quel est le COD ?",o:["les moutons","Le berger","garde"],a:0,e:"Le berger garde quoi ? Les moutons."},
    {t:'vf',q:"Dans « Il parle à son père », « à son père » est un COD.",a:false,e:"Le groupe est introduit par la préposition « à » : c'est un COI."},
    {t:'qcm',q:"Quel pronom peut remplacer le COD « les cahiers » ?",o:["les","lui","leur"],a:0,e:"Le COD pluriel se remplace par « les » : je les range."},
    {t:'fill',q:"Remplace le COD par un pronom : Il regarde Awa. → Il ___ regarde.",a:["la"],e:"Awa est féminin singulier : on emploie « la »."},
    {t:'qcm',q:"Quelle phrase contient un COI ?",o:["Nous téléphonons à Karim.","Nous lisons le journal.","Nous mangeons du riz."],a:0,e:"« À Karim » est relié au verbe par la préposition « à »."},
    {t:'vf',q:"Le COI est introduit par une préposition comme « à » ou « de ».",a:true,e:"C'est ce qui le distingue du COD."},
    {t:'qcm',q:"Dans « Elle a offert un cadeau à sa sœur », quel est le COI ?",o:["à sa sœur","un cadeau","Elle"],a:0,e:"Elle a offert un cadeau à qui ? À sa sœur : COI. « Un cadeau » est le COD."},
    {t:'qcm',q:"Dans « Karim aide sa sœur », quelle question permet de trouver le COD ?",o:["Karim aide qui ?","Karim aide à qui ?","Qui aide sa sœur ?"],a:0,e:"Le COD se trouve avec « qui ? » directement après le verbe."},
    {t:'fill',q:"Remplace le COI par un pronom : Je parle à Fatou. → Je ___ parle.",a:["lui"],e:"Le COI de personne au singulier se remplace par « lui »."}
  ]
},

"gram-types":{
  objectif:"Reconnaître les quatre types de phrases et les utiliser avec la bonne ponctuation.",
  explication:[
    "Toute phrase appartient à un **type** : il dit ce que l'on veut faire en parlant. On peut informer, poser une question, donner un ordre ou exprimer une émotion.",
    "La phrase **déclarative** donne une information ou raconte quelque chose : « Le soleil se lève. » Elle se termine par un **point**. La phrase **interrogative** pose une question : « Où vas-tu ? » Elle se termine par un **point d'interrogation**.",
    "La phrase **impérative** exprime un ordre, un conseil ou une interdiction : « Range ta chambre. » Son verbe est à l'**impératif** et, le plus souvent, n'a pas de sujet. La phrase **exclamative** exprime une émotion (joie, surprise, colère) : « Quelle belle journée ! » Elle se termine par un **point d'exclamation**."
  ],
  regle:"Il y a **quatre types de phrases** : **déclarative** (.), **interrogative** (?), **impérative** (. ou !) et **exclamative** (!). Le type se reconnaît à ce que dit la phrase, à sa ponctuation et, pour l'impérative, au verbe sans sujet.",
  tableaux:[{titre:"Les quatre types de phrases",entetes:["Type","Sert à…","Exemple"],lignes:[["Déclarative","informer, raconter","Il pleut depuis ce matin."],["Interrogative","poser une question","Est-ce que tu viens ?"],["Impérative","ordonner, conseiller","Ouvre la fenêtre !"],["Exclamative","exprimer une émotion","Comme il fait chaud !"]]}],
  exemples:[
    {t:"Il pleut depuis ce matin.",n:"Phrase déclarative : elle donne une information et se termine par un point."},
    {t:"Est-ce que tu viens ?",n:"Phrase interrogative : elle pose une question et se termine par un point d'interrogation."},
    {t:"Ouvre la fenêtre !",n:"Phrase impérative : elle donne un ordre, le verbe est à l'impératif et n'a pas de sujet."},
    {t:"Quelle belle surprise !",n:"Phrase exclamative : elle exprime une émotion."}
  ],
  retenir:["Quatre types : déclarative, interrogative, impérative, exclamative.","Déclarative : point. Interrogative : point d'interrogation.","Impérative : verbe à l'impératif, souvent sans sujet.","Exclamative : point d'exclamation, elle exprime une émotion."],
  plus:"La phrase interrogative peut être **totale** (la réponse est oui ou non : « Viens-tu ? ») ou **partielle** (elle contient un mot interrogatif : où, quand, comment, pourquoi, combien). Attention : un **point d'exclamation ne suffit pas** à rendre une phrase exclamative. « Range ta chambre ! » reste une phrase **impérative**, même avec un point d'exclamation.",
  mini:{t:'qcm',q:"« Quelle heure est-il ? » est une phrase…",o:["interrogative","déclarative","impérative"],a:0,e:"Elle pose une question et se termine par un point d'interrogation."},
  exercices:[
    {t:'qcm',q:"Quel est le type de la phrase « Ferme la porte, s'il te plaît. » ?",o:["impérative","exclamative","interrogative"],a:0,e:"Elle donne un ordre poli et le verbe « ferme » est à l'impératif, sans sujet."},
    {t:'vf',q:"Une phrase exclamative exprime une émotion.",a:true,e:"Joie, surprise, colère… c'est le rôle de la phrase exclamative."},
    {t:'fill',q:"Complète : une phrase qui pose une question est une phrase ___ .",a:["interrogative"],e:"La phrase interrogative sert à poser une question."},
    {t:'match',q:"Associe chaque phrase à son type.",pairs:[["Le train arrive à midi.","déclarative"],["Où est ton cahier ?","interrogative"],["Écoute bien la leçon.","impérative"],["Quelle belle surprise !","exclamative"]],e:"Une information, une question, un ordre, une émotion : ce sont les quatre types de phrases."},
    {t:'fix',q:"Corrige la ponctuation : « Où habites-tu. »",o:["Où habites-tu ?","Où habites-tu !","Où habites-tu…"],a:0,e:"La phrase pose une question : elle se termine par un point d'interrogation."}
  ],
  quiz:[
    {t:'qcm',q:"Combien y a-t-il de types de phrases ?",o:["4","3","5"],a:0,e:"Déclarative, interrogative, impérative et exclamative."},
    {t:'qcm',q:"Quel type de phrase est « Le soleil se couche. » ?",o:["déclarative","interrogative","exclamative"],a:0,e:"Elle donne une information : c'est une phrase déclarative."},
    {t:'vf',q:"Une phrase interrogative se termine par un point d'interrogation.",a:true,e:"C'est sa ponctuation habituelle."},
    {t:'qcm',q:"Quelle phrase est impérative ?",o:["Prends ton cahier.","Tu prends ton cahier.","Prends-tu ton cahier ?"],a:0,e:"« Prends ton cahier » donne un ordre : verbe à l'impératif, sans sujet."},
    {t:'fill',q:"Complète : « Comme il est gentil ! » est une phrase ___ .",a:["exclamative"],e:"Elle exprime une émotion : c'est une phrase exclamative."},
    {t:'qcm',q:"Quelle phrase est interrogative ?",o:["Comment t'appelles-tu ?","Tu t'appelles Awa.","Dis-moi ton nom."],a:0,e:"Elle pose une question et contient le mot interrogatif « comment »."},
    {t:'vf',q:"Une phrase impérative ne peut jamais se terminer par un point.",a:false,e:"Elle peut se terminer par un point ou par un point d'exclamation."},
    {t:'qcm',q:"Quel est le type de « Range ta chambre ! » ?",o:["impérative","exclamative","interrogative"],a:0,e:"Elle donne un ordre : le point d'exclamation ne change pas son type."},
    {t:'fill',q:"Complète : Une phrase qui donne un ordre est une phrase ___ .",a:["impérative"],e:"L'ordre, le conseil et l'interdiction sont exprimés par la phrase impérative."},
    {t:'fix',q:"Corrige la ponctuation : « Quel beau paysage. » (on veut exprimer l'admiration)",o:["Quel beau paysage !","Quel beau paysage ?","Quel beau paysage,"],a:0,e:"Pour exprimer une émotion, on termine la phrase exclamative par un point d'exclamation."}
  ]
