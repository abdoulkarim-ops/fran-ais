"ortho-son":{
  objectif:"Ne plus confondre « son » (déterminant) et « sont » (verbe être).",
  explication:[
    "« **sont** » est le verbe **être** conjugué à la 3e personne du **pluriel** : « Ils **sont** contents. » On peut le remplacer par « **étaient** » : « Ils étaient contents. » Il est toujours précédé d'un sujet pluriel (ils, elles, les enfants…).",
    "« **son** » est un **déterminant possessif** : il se place devant un nom masculin singulier et indique à qui appartient ce nom : « Il range **son** cahier. » On peut le remplacer par « **mon** » ou « **ton** » : « Il range mon cahier. »",
    "Dans une même phrase, on peut trouver les deux : « **Son** frère et sa sœur **sont** arrivés. » Le premier se remplace par « mon », le second par « étaient »."
  ],
  regle:"Remplace par « **étaient** » : si la phrase garde un sens, écris **sont**. Remplace par « **mon** » : si la phrase garde un sens, écris **son**.",
  exemples:[
    {t:"Les enfants **sont** dans la cour.",n:"« Les enfants étaient dans la cour » a un sens : c'est le verbe être."},
    {t:"Karim range **son** cahier.",n:"« Karim range mon cahier » a un sens : c'est le déterminant possessif."},
    {t:"**Son** père et sa mère **sont** partis.",n:"Le premier mot se remplace par « mon », le second par « étaient »."}
  ],
  retenir:["sont = verbe être, remplaçable par « étaient ».","son = déterminant possessif, remplaçable par « mon » ou « ton ».","« sont » a toujours un sujet pluriel.","Astuce : essaie « étaient » puis « mon »."],
  plus:"Le mot « **son** » peut aussi être un **nom** qui désigne ce que l'on entend : « le **son** de la cloche ». Dans ce cas, on ne peut pas le remplacer par « mon » : il est précédé d'un article (le son). Ne le confonds pas non plus avec « **ses** » (les livres de quelqu'un : ses livres) : au pluriel, « son » devient « ses ».",
  mini:{t:'qcm',q:"Les élèves ___ attentifs. Quel mot convient ?",o:["sont","son"],a:0,e:"« Les élèves étaient attentifs » a un sens : verbe être."},
  exercices:[
    {t:'fill',q:"Complète : Mes cousins ___ arrivés hier.",a:["sont"],e:"« Mes cousins étaient arrivés » a un sens : verbe être."},
    {t:'fill',q:"Complète : Awa lit ___ livre préféré.",a:["son"],e:"« Awa lit mon livre préféré » a un sens : déterminant possessif."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Son frère et sa sœur sont contents.","Sont frère et sa sœur son contents.","Son frère et sa sœur son contents."],a:0,e:"Le premier mot se remplace par « mon », le second par « étaient »."},
    {t:'fix',q:"Corrige la phrase : « Les enfants son dans la cour. »",o:["Les enfants sont dans la cour.","Les enfants son dans la cour.","Les enfants sons dans la cour."],a:0,e:"« Les enfants étaient dans la cour » : verbe être, on écrit « sont »."},
    {t:'vf',q:"« Sont » peut être remplacé par « étaient ».",a:true,e:"C'est l'astuce pour reconnaître le verbe être au pluriel."}
  ],
  quiz:[
    {t:'qcm',q:"Ils ___ en retard. Quel mot convient ?",o:["sont","son"],a:0,e:"« Ils étaient en retard » : verbe être."},
    {t:'qcm',q:"Karim a oublié ___ sac. Quel mot convient ?",o:["son","sont"],a:0,e:"« Karim a oublié mon sac » a un sens."},
    {t:'vf',q:"« Son » est un verbe.",a:false,e:"« Son » est un déterminant possessif (ou un nom, le son)."},
    {t:'fill',q:"Complète : Les filles ___ dans le jardin.",a:["sont"],e:"« Les filles étaient dans le jardin » : verbe être."},
    {t:'fill',q:"Complète : Il a perdu ___ stylo.",a:["son"],e:"« Il a perdu mon stylo » a un sens."},
    {t:'qcm',q:"Par quel mot remplace-t-on « son » ?",o:["mon","étaient","ses"],a:0,e:"« Son » se remplace par « mon » ou « ton »."},
    {t:'vf',q:"« Sont » s'écrit avec un sujet pluriel.",a:true,e:"Ils sont, elles sont, les enfants sont."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Ses amis sont gentils.","Ses amis son gentils.","Sont amis sont gentils."],a:0,e:"« Ses » est le pluriel de « son » ; « sont » est le verbe être."},
    {t:'fill',q:"Complète : Mes voisins ___ partis en voyage.",a:["sont"],e:"« Mes voisins étaient partis » : verbe être."},
    {t:'fix',q:"Corrige la phrase : « Sont père travaille au marché. »",o:["Son père travaille au marché.","Sont père travaille au marché.","Sons père travaille au marché."],a:0,e:"« Mon père travaille au marché » a un sens : on écrit « son »."}
  ]
},

"ortho-ou":{
  objectif:"Ne plus confondre « ou » (choix) et « où » (lieu ou temps).",
  explication:[
    "« **où** » (avec un accent grave) indique un **lieu** ou un **temps** : « **Où** vas-tu ? » « La maison **où** j'habite est grande. » « Le jour **où** il est venu. » On peut le remplacer par « **à quel endroit** » ou « **dans lequel** ».",
    "« **ou** » (sans accent) exprime un **choix** entre deux possibilités : « Veux-tu du thé **ou** du café ? » On peut le remplacer par « **ou bien** » : « du thé ou bien du café ».",
    "Pour choisir : si « ou bien » a un sens, on écrit **ou** sans accent. Sinon, c'est le lieu ou le temps : on écrit **où** avec accent."
  ],
  regle:"**ou** (sans accent) = choix, on peut le remplacer par « **ou bien** ». **où** (avec accent) = lieu ou temps.",
  exemples:[
    {t:"**Où** habites-tu ?",n:"« Ou bien habites-tu ? » n'a pas de sens : c'est le lieu, on écrit « où »."},
    {t:"Tu veux du riz **ou** des pâtes ?",n:"« Du riz ou bien des pâtes » a un sens : c'est un choix."},
    {t:"C'est la ville **où** je suis né.",n:"« où » reprend « la ville » : c'est un lieu."}
  ],
  retenir:["ou = choix, remplaçable par « ou bien ».","où = lieu ou temps, avec un accent grave.","Où introduit souvent une question sur le lieu.","Astuce : essaie « ou bien »."],
  plus:"On retrouve le même accent dans « **d'où** » (« D'où viens-tu ? »), « **là où** » et « **par où** ». Même en majuscule, on garde l'accent : « **Où** est ta sœur ? » Enfin, « où » peut exprimer le temps : « Le jour **où** tu es né » ; ne le remplace jamais par « ou bien » dans ce cas.",
  mini:{t:'qcm',q:"Tu prends du thé ___ du café ? Quel mot convient ?",o:["ou","où"],a:0,e:"« Du thé ou bien du café » a un sens : c'est un choix."},
  exercices:[
    {t:'fill',q:"Complète : ___ vas-tu ce soir ?",a:["où"],e:"On demande le lieu : « où » avec un accent."},
    {t:'fill',q:"Complète : Veux-tu un livre ___ un cahier ?",a:["ou"],e:"« Un livre ou bien un cahier » : c'est un choix."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["La ville où j'habite est grande.","La ville ou j'habite est grande.","La ville où bien j'habite est grande."],a:0,e:"« où » désigne le lieu : il prend un accent."},
    {t:'fix',q:"Corrige la phrase : « Ou est ton cahier ? »",o:["Où est ton cahier ?","Ou est ton cahier ?","Ou bien est ton cahier ?"],a:0,e:"On demande le lieu : « où » avec un accent grave, même en majuscule."},
    {t:'vf',q:"« Où » s'écrit avec un accent grave quand il indique un lieu.",a:true,e:"C'est la règle à retenir."}
  ],
  quiz:[
    {t:'qcm',q:"___ habites-tu ? Quel mot convient ?",o:["Où","Ou"],a:0,e:"Il s'agit du lieu : « où » avec un accent."},
    {t:'qcm',q:"Tu viens demain ___ après-demain ? Quel mot convient ?",o:["ou","où"],a:0,e:"Un choix entre deux jours : « ou »."},
    {t:'vf',q:"« Ou » (choix) porte un accent.",a:false,e:"Le « ou » du choix s'écrit sans accent."},
    {t:'fill',q:"Complète : Le village ___ je suis né est petit.",a:["où"],e:"« où » reprend « le village » : c'est un lieu."},
    {t:'fill',q:"Complète : Tu préfères rester ___ partir ?",a:["ou"],e:"« Rester ou bien partir » : c'est un choix."},
    {t:'qcm',q:"Par quelle expression remplace-t-on « ou » ?",o:["ou bien","à quel endroit","et puis"],a:0,e:"« Ou » (choix) se remplace par « ou bien »."},
    {t:'vf',q:"« Où » peut indiquer le temps : « le jour où il est venu ».",a:true,e:"Le « où » peut exprimer le lieu ou le temps."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["D'où viens-tu ?","D'ou viens-tu ?","D'ou bien viens-tu ?"],a:0,e:"« D'où » garde l'accent."},
    {t:'fill',q:"Complète : C'est la cour ___ nous jouons.",a:["où"],e:"« où » désigne le lieu."},
    {t:'fix',q:"Corrige la phrase : « Tu veux du riz où du pain ? »",o:["Tu veux du riz ou du pain ?","Tu veux du riz où du pain ?","Tu veux du riz ou bien où du pain ?"],a:0,e:"Il s'agit d'un choix : « ou » sans accent."}
  ]
},

"ortho-ce":{
  objectif:"Ne plus confondre « ce » (démonstratif) et « se » (pronom réfléchi).",
  explication:[
    "« **ce** » est un **déterminant démonstratif** placé devant un nom masculin : « **Ce** livre est passionnant. » On peut le remplacer par « **cette** » ou « **ces** » : « cette histoire », « ces livres ». Il peut aussi être un **pronom démonstratif** : « **Ce** qui compte, c'est de réussir. » et « c'est ».",
    "« **se** » est un **pronom personnel** qui se place **devant un verbe** pour former un verbe pronominal : « Il **se** lève tôt. » On peut le remplacer par « **me** » ou « **te** » : « Je me lève », « Tu te lèves ».",
    "Pour choisir : si le mot est **devant un verbe** et qu'on peut mettre « me » à la place, écris **se**. S'il est **devant un nom** (et qu'on peut mettre « cette »), écris **ce**."
  ],
  regle:"**se** est devant un **verbe** (on peut mettre « me / te »). **ce** est devant un **nom** (on peut mettre « cette »).",
  exemples:[
    {t:"**Ce** garçon **se** lave les mains.",n:"« Ce » précède le nom « garçon » ; « se » précède le verbe « lave »."},
    {t:"Awa **se** souvient de **ce** jour.",n:"« Se » : verbe pronominal « se souvenir ». « Ce » : devant le nom « jour »."},
    {t:"**Ce** qui compte, c'est de **se** préparer.",n:"« Ce » est ici un pronom (ce qui). « Se » précède le verbe « préparer »."}
  ],
  retenir:["se = pronom devant un verbe, remplaçable par « me » ou « te ».","ce = devant un nom masculin, remplaçable par « cette ».","« ce qui », « ce que », « c'est » : ce est un pronom.","Astuce : essaie « me » puis « cette »."],
  plus:"Devant une voyelle, « se » s'écrit « **s'** » (« Il s'habille ») et « ce » s'écrit « **c'** » (« c'est »). On écrit « ce » devant un nom qui commence par une voyelle en « **cet** » : « cet arbre ». Le verbe pronominal existe toujours avec « se » à l'infinitif : « **se** laver », « **se** souvenir ».",
  mini:{t:'qcm',q:"Il ___ lève tôt. Quel mot convient ?",o:["se","ce"],a:0,e:"« Il me lève » n'a pas de sens, mais « je me lève » : « se » est devant un verbe."},
  exercices:[
    {t:'fill',q:"Complète : Karim ___ lave les mains.",a:["se"],e:"« Se » est devant le verbe « laver » (verbe pronominal)."},
    {t:'fill',q:"Complète : ___ garçon est mon cousin.",a:["ce"],e:"« Ce » est devant le nom « garçon » : on peut mettre « cette »."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Ce chat se repose sur le canapé.","Se chat ce repose sur le canapé.","Ce chat ce repose sur le canapé."],a:0,e:"« Ce » précède le nom, « se » précède le verbe."},
    {t:'fix',q:"Corrige la phrase : « Awa ce souvient de son enfance. »",o:["Awa se souvient de son enfance.","Awa ce souvient de son enfance.","Awa ses souvient de son enfance."],a:0,e:"« Se souvenir » est un verbe pronominal : on écrit « se »."},
    {t:'vf',q:"« Se » se place devant un nom.",a:false,e:"« Se » se place devant un verbe. « Ce » se place devant un nom."}
  ],
  quiz:[
    {t:'qcm',q:"___ livre est intéressant. Quel mot convient ?",o:["Ce","Se"],a:0,e:"« Ce » précède un nom : « cette histoire »."},
    {t:'qcm',q:"Elle ___ prépare pour l'examen. Quel mot convient ?",o:["se","ce"],a:0,e:"« Se préparer » est un verbe pronominal."},
    {t:'vf',q:"« Se » peut être remplacé par « me » ou « te ».",a:true,e:"Je me prépare, tu te prépares, il se prépare."},
    {t:'fill',q:"Complète : Il ___ couche à vingt heures.",a:["se"],e:"« Se coucher » est un verbe pronominal."},
    {t:'fill',q:"Complète : Regarde ___ oiseau sur la branche.",a:["cet"],e:"Devant un nom masculin qui commence par une voyelle, on écrit « cet »."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Ce matin, il se lève tôt.","Se matin, il ce lève tôt.","Ce matin, il ce lève tôt."],a:0,e:"« Ce » précède « matin », « se » précède « lève »."},
    {t:'fix',q:"Corrige la phrase : « Se garçon ce lave. »",o:["Ce garçon se lave.","Se garçon se lave.","Ce garçon ce lave."],a:0,e:"« Ce » précède le nom, « se » précède le verbe."},
    {t:'vf',q:"Dans « Ce qui compte, c'est de réussir », « ce » est un pronom.",a:true,e:"« Ce qui » est une tournure avec un pronom démonstratif."},
    {t:'fill',q:"Complète : Nous ___ voyons demain. (nous voir l'un l'autre : forme pronominale)",a:["nous"],e:"Avec « nous », le pronom réfléchi est « nous » : nous nous voyons."},
    {t:'qcm',q:"Par quel mot remplace-t-on « ce » devant un nom ?",o:["cette","me","te"],a:0,e:"« Ce garçon » → « cette fille »."}
  ]
},

"ortho-ces":{
  objectif:"Distinguer « ces », « ses », « c'est » et « s'est ».",
  explication:[
    "« **ces** » est un **déterminant démonstratif** pluriel : « **Ces** livres sont à moi. » Au singulier, il devient « ce » : « ce livre ». « **ses** » est un **déterminant possessif** pluriel : « Karim range **ses** livres. » Au singulier, il devient « son » : « son livre ».",
    "« **c'est** » est le pronom « ce » suivi du verbe être : « **C'est** beau ! » On peut le remplacer par « **c'était** » : « C'était beau ! » « **s'est** » est le pronom « se » suivi du verbe être, dans les verbes pronominaux au passé composé : « Il **s'est** lavé. » On peut le remplacer par « **s'était** » : « Il s'était lavé. »",
    "Astuce générale : **mets la phrase au singulier** pour distinguer « ces » (ce) et « ses » (son) ; **mets-la à l'imparfait** pour distinguer « c'est » (c'était) et « s'est » (s'était)."
  ],
  regle:"**ces** → « ce » au singulier. **ses** → « son » au singulier. **c'est** → « c'était ». **s'est** → « s'était ».",
  tableaux:[{titre:"Quatre homophones",entetes:["Mot","Nature","Astuce"],lignes:[["ces","déterminant démonstratif pluriel","singulier : ce, cet, cette"],["ses","déterminant possessif pluriel","singulier : son, sa"],["c'est","ce + verbe être","c'était"],["s'est","se + verbe être","s'était"]]}],
  exemples:[
    {t:"**Ces** fleurs sentent bon.",n:"Au singulier : « cette fleur » : c'est « ces »."},
    {t:"Awa range **ses** affaires.",n:"Au singulier : « son affaire » : c'est « ses »."},
    {t:"**C'est** vrai : il **s'est** trompé.",n:"« C'était vrai » : c'est ; « il s'était trompé » : s'est."}
  ],
  retenir:["ces → ce ; ses → son.","c'est → c'était ; s'est → s'était.","« s'est » se trouve dans les verbes pronominaux au passé composé.","Toujours vérifier avec l'astuce du singulier ou de l'imparfait."],
  plus:"Pour « **s'est** », le participe passé suivant s'accorde souvent avec le sujet : « Elle **s'est** lav**ée** », « Ils **se sont** lav**és** ». Attention à « **sait** » (verbe savoir : « Il **sait** la leçon ») qui se prononce comme « c'est » et « s'est ». Enfin, « **c'est** » peut être suivi d'un pluriel dans la langue courante (« c'est des livres »), mais à l'écrit on préfère « ce sont ».",
  mini:{t:'qcm',q:"___ enfants jouent dans la cour. (les enfants que je montre)",o:["Ces","Ses"],a:0,e:"« Ce garçon » au singulier : on écrit « ces »."},
  exercices:[
    {t:'fill',q:"Complète : Awa a perdu ___ clés. (les clés d'Awa)",a:["ses"],e:"Au singulier on dirait « sa clé » : le possessif pluriel est « ses »."},
    {t:'fill',q:"Complète : Il ___ trompé de chemin.",a:["s'est"],e:"« Il s'était trompé » a un sens : « s'est »."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Ces livres sont à moi et c'est vrai.","Ses livres sont à moi et ces vrai.","Ces livres sont à moi et s'est vrai."],a:0,e:"« Ces » montre des livres ; « c'est » se remplace par « c'était »."},
    {t:'fix',q:"Corrige la phrase : « Elle ces lavée avant le repas. »",o:["Elle s'est lavée avant le repas.","Elle c'est lavée avant le repas.","Elle ses lavée avant le repas."],a:0,e:"« Elle s'était lavée » a un sens : « s'est »."},
    {t:'match',q:"Associe chaque mot à son astuce.",pairs:[["ces","ce au singulier"],["ses","son au singulier"],["c'est","c'était"],["s'est","s'était"]],e:"Chaque homophone a son remplacement."}
  ],
  quiz:[
    {t:'qcm',q:"Karim range ___ affaires. (les affaires de Karim)",o:["ses","ces"],a:0,e:"« Son affaire » : possessif pluriel « ses »."},
    {t:'qcm',q:"___ génial ! Quel mot convient ?",o:["C'est","S'est"],a:0,e:"« C'était génial » a un sens."},
    {t:'vf',q:"« S'est » peut se remplacer par « s'était ».",a:true,e:"Il s'est lavé → il s'était lavé."},
    {t:'fill',q:"Complète : Regarde ___ oiseaux ! (montre-les)",a:["ces"],e:"« Cet oiseau » au singulier : « ces »."},
    {t:'fill',q:"Complète : Il ___ blessé en jouant.",a:["s'est"],e:"« Il s'était blessé » : « s'est »."},
    {t:'qcm',q:"Par quoi remplace-t-on « c'est » ?",o:["c'était","s'était","son"],a:0,e:"C'est → c'était."},
    {t:'vf',q:"« Ses » est le pluriel de « son ».",a:true,e:"Son livre → ses livres."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Elle s'est levée tôt.","Elle c'est levée tôt.","Elle ses levée tôt."],a:0,e:"C'est un verbe pronominal au passé composé : « s'est »."},
    {t:'fill',q:"Complète : Fatou range ___ cahiers. (les cahiers de Fatou)",a:["ses"],e:"« Son cahier » au singulier : « ses »."},
    {t:'fix',q:"Corrige la phrase : « Ses vrai : il c'est trompé. »",o:["C'est vrai : il s'est trompé.","Ses vrai : il s'est trompé.","C'est vrai : il c'est trompé."],a:0,e:"« C'était vrai » : c'est ; « il s'était trompé » : s'est."}
  ]
},

"voc-propre-figure":{
  objectif:"Distinguer le sens propre et le sens figuré d'un mot ou d'une expression.",
  explication:[
    "Beaucoup de mots ont **plusieurs sens**. Le **sens propre** est le sens premier, concret, celui que l'on comprend à la lettre : « La glace **fond** au soleil. » Le **sens figuré** est un sens imagé, souvent plus abstrait, qui vient du premier : « Il a **fondu** en larmes. »",
    "Les expressions imagées fonctionnent presque toujours au sens figuré : « avoir un **cœur d'or** » (être très généreux), « être **dans la lune** » (être distrait), « **mettre la main à la pâte** » (participer au travail). Si on les comprenait à la lettre, elles n'auraient aucun sens.",
    "Pour distinguer les deux sens, on peut se demander : **est-ce que la phrase se comprend à la lettre ?** Si c'est absurde, c'est un sens figuré. Le dictionnaire aide aussi : il indique « fig. » devant le sens figuré."
  ],
  regle:"**Sens propre** : sens premier et concret. **Sens figuré** : sens imagé, dérivé du sens propre. Une expression qui n'a pas de sens à la lettre est au sens figuré.",
  tableaux:[{titre:"Propre ou figuré ?",entetes:["Sens propre","Sens figuré"],lignes:[["La glace fond au soleil.","Il fond en larmes."],["Il déchire une feuille.","Cette nouvelle lui déchire le cœur."],["Elle a une main dans la poche.","Elle a la main verte : elle réussit avec les plantes."],["Le vent souffle.","Il souffle sur les braises de la discorde."]]}],
  exemples:[
    {t:"La glace **fond** au soleil.",n:"Sens propre : la glace devient liquide."},
    {t:"Karim est **dans la lune**.",n:"Sens figuré : il est distrait, il n'écoute pas."},
    {t:"Elle a un **cœur d'or**.",n:"Sens figuré : elle est très généreuse. Son cœur n'est pas en or !"}
  ],
  retenir:["Sens propre = sens premier, concret.","Sens figuré = sens imagé, souvent abstrait.","Les expressions imagées sont au sens figuré.","Si la phrase n'a pas de sens à la lettre, c'est du figuré."],
  plus:"Un sens figuré très courant finit parfois par ne plus être ressenti comme une image : on parle alors de **métaphore lexicalisée** (« le pied de la montagne », « les racines d'un problème »). Cette **polysémie** (un mot, plusieurs sens) est une richesse de la langue, mais elle demande de la vigilance : traduire mot à mot une expression figurée d'une langue à l'autre donne souvent un contresens.",
  mini:{t:'qcm',q:"« Il a un cœur de pierre. » Cette expression est au sens…",o:["figuré","propre"],a:0,e:"Son cœur n'est pas en pierre : cela veut dire qu'il est sans pitié."},
  exercices:[
    {t:'qcm',q:"Dans quelle phrase « brûler » est-il employé au sens propre ?",o:["Le bois brûle dans le feu.","Il brûle d'impatience.","Elle brûle les étapes."],a:0,e:"Le bois se consume vraiment : c'est le sens propre."},
    {t:'match',q:"Associe chaque expression à son sens.",pairs:[["être dans la lune","être distrait"],["avoir un chat dans la gorge","avoir la voix enrouée"],["mettre la main à la pâte","participer au travail"],["avoir le cœur sur la main","être généreux"]],e:"Ce sont des expressions figurées."},
    {t:'vf',q:"Une expression figurée se comprend à la lettre.",a:false,e:"Au sens propre, elle serait absurde : c'est ce qui prouve qu'elle est figurée."},
    {t:'fill',q:"Complète : Le sens premier et concret d'un mot est le sens ___ .",a:["propre"],e:"Sens propre / sens figuré."},
    {t:'qcm',q:"Dans « Cette nouvelle m'a glacé le sang », « glacer » est employé au sens…",o:["figuré","propre"],a:0,e:"Le sang n'est pas devenu de la glace : l'expression traduit la peur."}
  ],
  quiz:[
    {t:'qcm',q:"Qu'est-ce que le sens figuré ?",o:["Un sens imagé, dérivé du sens premier","Le sens premier du mot","Un sens contraire"],a:0,e:"Le sens figuré est imagé et souvent abstrait."},
    {t:'qcm',q:"« Elle a un cœur d'or » est une expression…",o:["figurée","propre"],a:0,e:"Elle signifie « elle est généreuse »."},
    {t:'vf',q:"Dans « La rivière coule », « couler » est employé au sens propre.",a:true,e:"L'eau s'écoule vraiment."},
    {t:'qcm',q:"Que signifie « avoir le cœur sur la main » ?",o:["être généreux","être malade","être en colère"],a:0,e:"C'est une expression figurée pour dire « donner volontiers »."},
    {t:'qcm',q:"Dans « Le prix de l'essence s'envole », « s'envoler » est au sens…",o:["figuré","propre"],a:0,e:"Le prix ne vole pas : il augmente très vite."},
    {t:'vf',q:"Le dictionnaire indique « fig. » pour le sens figuré.",a:true,e:"C'est l'abréviation de « figuré »."},
    {t:'fill',q:"Complète : Le mot « pied » au sens ___ désigne la partie du corps. (propre ou figuré)",a:["propre"],e:"Le pied du corps : sens propre. Le pied de la montagne : sens figuré."},
    {t:'qcm',q:"Quelle phrase utilise « pied » au sens figuré ?",o:["Nous campons au pied de la montagne.","Il a mal au pied.","Elle enlève ses chaussures du pied."],a:0,e:"La montagne n'a pas de pied : c'est une image."},
    {t:'qcm',q:"Que signifie « être dans la lune » ?",o:["être distrait","être content","être malade"],a:0,e:"C'est une expression figurée pour « ne pas écouter »."},
    {t:'fix',q:"Améliore la phrase pour employer le sens propre : « Il a de la glace dans le cœur. »",o:["Il a de la glace dans le verre.","Il a de la glace dans le cœur.","Il a de la glace dans les idées."],a:0,e:"« De la glace dans le verre » : sens propre. « Dans le cœur » : sens figuré."}
  ]
},

"voc-champ-lexical":{
  objectif:"Repérer un champ lexical dans un texte et le distinguer d'une famille de mots et d'un champ sémantique.",
  explication:[
    "Un **champ lexical** est l'ensemble des mots d'un texte qui se rapportent à **un même thème**. Autour de la mer : vague, navire, marin, port, plage, écume. Ces mots peuvent être de **natures différentes** (noms, verbes, adjectifs) et n'ont **pas le même radical**.",
    "Il ne faut pas confondre le champ lexical avec la **famille de mots**. Une famille regroupe des mots de **même radical** (mer, marin, maritime). Un champ lexical regroupe des mots de **même thème** (mer, vague, navire, plage).",
    "Le **champ sémantique** d'un mot, lui, est l'ensemble de **ses sens**. Le mot « glace » peut désigner l'eau gelée, un miroir ou un dessert. Repérer un champ lexical dominant est utile pour analyser un texte : il révèle le **thème** et l'**atmosphère**. Un champ lexical de la peur (trembler, cri, obscurité, frisson) crée une atmosphère angoissante."
  ],
  regle:"**Champ lexical** = mots de **même thème** (radicaux différents). **Famille de mots** = mots de **même radical**. **Champ sémantique** = ensemble des **sens** d'un mot.",
  tableaux:[{titre:"Famille de mots ou champ lexical ?",entetes:["","Famille de mots","Champ lexical"],lignes:[["Lien","même radical","même thème"],["Exemple","mer, marin, maritime","mer, vague, navire, plage"],["Natures","dérivés d'un même mot","noms, verbes, adjectifs variés"]]}],
  exemples:[
    {t:"**bateau, voile, vent, marin, quai**",n:"Ces mots forment le champ lexical de la navigation."},
    {t:"**trembler, cri, obscurité, frisson**",n:"Ces mots forment le champ lexical de la peur : ils créent une atmosphère angoissante."},
    {t:"**glace** : eau gelée, miroir, dessert",n:"C'est le champ sémantique du mot « glace » : ses différents sens."}
  ],
  retenir:["Champ lexical : mots d'un même thème.","Famille de mots : même radical.","Champ sémantique : les différents sens d'un mot.","Le champ lexical dominant révèle le thème et l'atmosphère d'un texte."],
  plus:"Pour relever un champ lexical dans un texte, **souligne** d'abord les mots liés au thème, puis **classe-les** (noms, verbes, adjectifs). Demande-toi enfin : **quel effet produit cette accumulation ?** Un champ lexical de la lumière (briller, éclat, aube) crée une impression de joie ; un champ lexical de la nuit (ombre, noir, silence) crée une impression de mystère ou d'angoisse. Les mots peuvent aussi être **connotés** : « demeure » ne dit pas seulement « maison », il ajoute une idée de noblesse.",
  mini:{t:'qcm',q:"Quel groupe de mots forme un champ lexical de l'école ?",o:["cahier, leçon, maître, cartable","mer, marin, maritime","chanter, chanteur, chant"],a:0,e:"Ces mots renvoient tous au thème de l'école."},
  exercices:[
    {t:'find',q:"Touche les mots du champ lexical de l'école, puis valide.",s:"Karim range son cahier dans son cartable avant la leçon",a:["cahier","cartable","leçon"],e:"Cahier, cartable et leçon renvoient au thème de l'école."},
    {t:'qcm',q:"Quelle série est une famille de mots ?",o:["chanter, chanteur, chant","mer, vague, navire","forêt, arbre, feuille"],a:0,e:"Même radical « chant » : c'est une famille de mots."},
    {t:'match',q:"Associe chaque groupe de mots à son thème.",pairs:[["trembler, cri, frisson","la peur"],["vague, écume, navire","la mer"],["soleil, éclat, briller","la lumière"],["cahier, leçon, maître","l'école"]],e:"Ces séries forment des champs lexicaux."},
    {t:'vf',q:"Les mots d'un champ lexical ont tous le même radical.",a:false,e:"C'est la famille de mots qui a le même radical."},
    {t:'fill',q:"Complète : Un mot qui a plusieurs sens a un champ ___ (lexical ou sémantique ?)",a:["sémantique"],e:"Le champ sémantique regroupe les sens d'un mot."}
  ],
  quiz:[
    {t:'qcm',q:"Qu'est-ce qu'un champ lexical ?",o:["Des mots d'un même thème","Des mots de même radical","Des mots de sens contraire"],a:0,e:"Un champ lexical rassemble les mots qui renvoient à un même thème."},
    {t:'qcm',q:"Quel groupe forme le champ lexical de la mer ?",o:["vague, port, navire, plage","forêt, feuille, branche","cahier, stylo, règle"],a:0,e:"Ce sont des mots de la mer."},
    {t:'vf',q:"Les mots « chant », « chanter » et « chanteur » forment une famille de mots.",a:true,e:"Ils ont le même radical « chant » : c'est une famille de mots, pas seulement un champ lexical."},
    {t:'qcm',q:"Quel effet produit un champ lexical de la peur ?",o:["Une atmosphère angoissante","Une ambiance joyeuse","Un rythme rapide"],a:0,e:"Trembler, cri, obscurité : ces mots créent l'angoisse."},
    {t:'qcm',q:"Quel mot n'appartient pas au champ lexical de la forêt ?",o:["cartable","arbre","feuille"],a:0,e:"Le cartable appartient au thème de l'école."},
    {t:'fill',q:"Complète : L'ensemble des sens d'un mot est son champ ___ .",a:["sémantique"],e:"« Glace » : eau gelée, miroir, dessert."},
    {t:'vf',q:"Un champ lexical peut réunir des noms, des verbes et des adjectifs.",a:true,e:"Ce qui compte, c'est le thème commun."},
    {t:'qcm',q:"Quelle série n'est PAS un champ lexical mais une famille de mots ?",o:["terre, terrain, terrasse","arbre, feuille, branche","vague, plage, port"],a:0,e:"Le radical « terr- » se retrouve dans chaque mot."},
    {t:'fill',q:"Complète : « Glace » a plusieurs sens : c'est le ___ sémantique du mot.",a:["champ"],e:"Le champ sémantique regroupe les sens d'un mot."},
    {t:'fix',q:"Corrige : « Le champ lexical, c'est un ensemble de mots de même radical. »",o:["Le champ lexical, c'est un ensemble de mots de même thème.","Le champ lexical, c'est un ensemble de mots de même radical.","Le champ lexical, c'est un ensemble de mots de sens contraire."],a:0,e:"Ce sont les mots de même radical qui forment une famille."}
  ]
},

"voc-registres":{
  objectif:"Reconnaître les niveaux de langue (familier, courant, soutenu) et choisir celui qui convient à la situation.",
  explication:[
    "On ne parle pas de la même façon à un ami, à un professeur ou lors d'un discours officiel. On distingue trois **niveaux de langue**. Le **langage familier** s'emploie entre amis ou en famille, à l'oral : « Il a une **bagnole** ». Le **langage courant** convient à la plupart des situations, à l'école comme dans la vie quotidienne : « Il a une **voiture** ». Le **langage soutenu** s'emploie dans les textes littéraires, les discours et les écrits officiels : « Il possède une **automobile** ».",
    "Chaque niveau se reconnaît au **vocabulaire** (bouquin / livre / ouvrage), à la **construction des phrases** (« T'as vu ? » / « Tu as vu ? » / « As-tu vu ? ») et au respect de la négation complète (« Je sais pas » / « Je ne sais pas »).",
    "Il n'y a pas de bon ou de mauvais niveau en soi : ce qui compte, c'est de **choisir celui qui convient** à la situation et à la personne à qui l'on s'adresse. Écrire un devoir ou une lettre demande un langage courant ou soutenu, jamais familier."
  ],
  regle:"**Familier** (entre proches) → **courant** (usage général) → **soutenu** (discours, littérature). On choisit le niveau selon **la situation** et **l'interlocuteur**.",
  tableaux:[{titre:"Trois niveaux, un même sens",entetes:["Familier","Courant","Soutenu"],lignes:[["bagnole","voiture","automobile"],["bouquin","livre","ouvrage"],["boulot","travail","labeur"],["baraque","maison","demeure"],["bouffer","manger","se restaurer"]]}],
  exemples:[
    {t:"J'ai plus de fric.",n:"Langage familier : « fric » est familier et la négation est incomplète."},
    {t:"Je n'ai plus d'argent.",n:"Langage courant : la négation est complète et le vocabulaire standard."},
    {t:"Je suis dépourvu de ressources.",n:"Langage soutenu : le vocabulaire est recherché."}
  ],
  retenir:["Trois niveaux : familier, courant, soutenu.","Chaque niveau a son vocabulaire et sa construction.","On choisit selon la situation et l'interlocuteur.","À l'écrit scolaire, on évite le langage familier."],
  plus:"Le langage **familier** est fréquent à l'oral, mais ses tournures ne conviennent pas à un devoir ou à une lettre formelle. Le **soutenu** peut sonner étrange dans une conversation courante. Il ne faut pas confondre les niveaux de langue avec les **variations régionales** : chaque pays francophone a aussi ses expressions propres, qui ne sont ni « fautives » ni « familières » par nature. Le niveau de langue dépend de la situation ; la variation régionale, du lieu.",
  mini:{t:'qcm',q:"« Il est parti au boulot. » Quel niveau de langue ?",o:["familier","courant","soutenu"],a:0,e:"« Boulot » est familier ; le mot courant est « travail »."},
  exercices:[
    {t:'qcm',q:"Quel mot est du langage soutenu ?",o:["demeure","baraque","maison"],a:0,e:"« Demeure » est soutenu ; « maison » est courant ; « baraque » est familier."},
    {t:'match',q:"Associe chaque mot à son niveau de langue.",pairs:[["bagnole","familier"],["voiture","courant"],["automobile","soutenu"]],e:"Bagnole est familier, voiture est courant, automobile est soutenu."},
    {t:'vf',q:"Dans un devoir, on doit employer le langage familier.",a:false,e:"Un devoir demande un langage courant ou soutenu."},
    {t:'fill',q:"Complète : Le niveau de langue utilisé avec ses amis est le langage ___ .",a:["familier"],e:"Entre amis, on parle le plus souvent en langage familier."},
    {t:'fix',q:"Réécris en langage courant : « Il bouffe du riz. »",o:["Il mange du riz.","Il bouffe du riz.","Il se restaure de riz."],a:0,e:"« Manger » est le verbe courant."}
  ],
  quiz:[
    {t:'qcm',q:"Combien y a-t-il de niveaux de langue ?",o:["3","2","5"],a:0,e:"Familier, courant et soutenu."},
    {t:'qcm',q:"Quel mot est familier ?",o:["boulot","travail","labeur"],a:0,e:"« Boulot » est le mot familier."},
    {t:'vf',q:"Le langage soutenu s'emploie dans les discours officiels.",a:true,e:"C'est l'un de ses usages courants."},
    {t:'qcm',q:"Quel mot est du langage courant ?",o:["maison","baraque","demeure"],a:0,e:"« Maison » est courant."},
    {t:'fill',q:"Complète : Le langage qui convient à la plupart des situations est le langage ___ .",a:["courant"],e:"C'est le niveau standard."},
    {t:'qcm',q:"Quelle phrase est au langage familier ?",o:["T'as vu ce film ?","Avez-vous vu ce film ?","Tu as vu ce film ?"],a:0,e:"« T'as » est une forme familière."},
    {t:'vf',q:"Le langage familier convient à une lettre à un directeur.",a:false,e:"Une lettre formelle demande un langage courant ou soutenu."},
    {t:'qcm',q:"Quel mot est du langage soutenu ?",o:["labeur","travail","boulot"],a:0,e:"« Labeur » est soutenu."},
    {t:'fill',q:"Complète : Un mot recherché, employé dans un discours officiel, est du niveau ___ .",a:["soutenu"],e:"Soutenu = recherché."},
    {t:'fix',q:"Transforme en langage courant : « J'ai pas de fric. »",o:["Je n'ai pas d'argent.","J'ai pas de fric.","Je ne dispose d'aucune ressource."],a:0,e:"Négation complète et vocabulaire courant."}
  ]
},

"expr-recit":{
  objectif:"Écrire un récit cohérent en suivant le schéma narratif, avec des temps du passé et des connecteurs de temps.",
  explication:[
    "**Raconter**, c'est présenter une suite d'événements dans un ordre clair. Avant d'écrire, prépare ton histoire : qui sont les personnages ? où et quand se passe-t-elle ? quel problème doivent-ils résoudre ? Le récit suit le **schéma narratif** : situation initiale, élément perturbateur, péripéties, dénouement, situation finale.",
    "Choisis un **narrateur** : à la 1re personne (« je ») ou à la 3e (« il », « elle »), et **garde-le du début à la fin**. Choisis aussi ton temps du passé : l'**imparfait** pour le décor, le **passé simple** (ou le passé composé) pour les actions qui font avancer l'histoire. Les **connecteurs de temps** relient les événements : d'abord, puis, soudain, alors, ensuite, enfin, quelques jours plus tard.",
    "Pour rendre ton récit vivant, ajoute des détails que l'on voit, entend ou sent, quelques **dialogues**, les **sentiments** du personnage. Commence par une phrase qui donne envie de lire. Enfin, **relis-toi** : corrige l'orthographe et supprime les répétitions (« et puis… et puis… »)."
  ],
  regle:"**Récit = schéma narratif + temps du passé cohérents** (imparfait pour le décor, passé simple ou passé composé pour les actions) **+ connecteurs de temps**, avec un narrateur qui ne change pas.",
  tableaux:[{titre:"Le schéma narratif",entetes:["Étape","Rôle","Exemple"],lignes:[["Situation initiale","présenter personnages, lieu, époque","Il était une fois un village au bord du fleuve."],["Élément perturbateur","rompre l'équilibre","Un matin, la rivière cessa de couler."],["Péripéties","les actions pour résoudre le problème","Le jeune Karim partit chercher la source."],["Dénouement","le problème est résolu","Il dégagea le passage et l'eau revint."],["Situation finale","la nouvelle situation","Depuis ce jour, le village vécut en paix."]]}],
  exemples:[
    {t:"Il **était** une fois un pêcheur qui **vivait** près du fleuve.",n:"Situation initiale, à l'imparfait : on présente le personnage et le lieu."},
    {t:"**Soudain**, un cri **retentit**.",n:"Élément perturbateur : le connecteur « soudain » et le passé simple marquent l'événement qui change tout."},
    {t:"**Quelques jours plus tard**, tout **était** rentré dans l'ordre.",n:"Situation finale, avec un connecteur de temps."}
  ],
  retenir:["Un récit suit le schéma narratif.","Garder le même narrateur du début à la fin.","Imparfait pour le décor, passé simple ou passé composé pour les actions.","Les connecteurs de temps organisent l'histoire."],
  plus:"Le récit joue sur le **rythme**. Une **scène** (souvent avec un dialogue) ralentit le récit et fait vivre l'action ; un **sommaire** l'accélère (« Pendant trois ans, il travailla sans repos ») ; une **pause** arrête l'action pour décrire ; une **ellipse** saute une période sans la raconter. Choisir avec soin ces procédés rend le récit plus intéressant.",
  mini:{t:'qcm',q:"Dans « Il pleuvait quand un cri retentit », le verbe à l'imparfait décrit…",o:["le décor","une action rapide","un ordre"],a:0,e:"« Pleuvait » installe le décor ; « retentit » est l'action qui arrive."},
  exercices:[
    {t:'match',q:"Associe chaque étape du schéma narratif à son rôle.",pairs:[["Situation initiale","présente personnages et lieu"],["Élément perturbateur","rompt l'équilibre"],["Péripéties","les actions pour résoudre le problème"],["Dénouement","le problème est résolu"]],e:"Ce sont les grandes étapes d'un récit."},
    {t:'qcm',q:"Quel mot est un connecteur de temps ?",o:["Soudain","Parce que","Donc"],a:0,e:"« Soudain » marque le moment où quelque chose arrive."},
    {t:'fill',q:"Conjugue à l'imparfait : Il ___ (pleuvoir) depuis le matin quand un cri retentit.",a:["pleuvait"],e:"Le décor se met à l'imparfait."},
    {t:'vf',q:"On peut changer de narrateur à chaque phrase.",a:false,e:"Le narrateur doit rester le même du début à la fin."},
    {t:'qcm',q:"Quelle phrase est une situation initiale ?",o:["Il était une fois un pêcheur qui vivait près du fleuve.","Soudain, un cri retentit.","Depuis ce jour, tout était calme."],a:0,e:"Elle présente le personnage et le lieu, à l'imparfait."}
  ],
  quiz:[
    {t:'qcm',q:"Quelle est la première étape du schéma narratif ?",o:["La situation initiale","Le dénouement","Les péripéties"],a:0,e:"On présente d'abord les personnages, le lieu et l'époque."},
    {t:'qcm',q:"Quel temps emploie-t-on pour décrire le décor dans un récit au passé ?",o:["L'imparfait","Le futur","L'impératif"],a:0,e:"L'imparfait sert à décrire et à installer le décor."},
    {t:'vf',q:"Les connecteurs de temps aident à organiser les événements.",a:true,e:"D'abord, puis, ensuite, enfin…"},
    {t:'qcm',q:"Qu'est-ce que l'élément perturbateur ?",o:["L'événement qui rompt l'équilibre du début","La fin de l'histoire","La description du lieu"],a:0,e:"Il lance l'histoire."},
    {t:'fill',q:"Complète : Il était une fois un roi qui ___ (vivre) dans un grand palais.",a:["vivait"],e:"Situation initiale : imparfait."},
    {t:'qcm',q:"Quel connecteur de temps convient au début d'un dénouement ?",o:["Enfin","Mais","Parce que"],a:0,e:"« Enfin » annonce la résolution."},
    {t:'vf',q:"Un récit doit garder le même narrateur du début à la fin.",a:true,e:"C'est un principe de cohérence."},
    {t:'qcm',q:"À quoi sert la situation finale ?",o:["À montrer la nouvelle situation après l'histoire","À présenter les personnages","À créer le problème"],a:0,e:"Elle boucle le récit."},
    {t:'fill',q:"Complète : Le récit se termine par la situation ___ .",a:["finale"],e:"Schéma narratif : situation finale."},
    {t:'fix',q:"Corrige le mélange des temps : « Il marche dans la forêt quand il entendait un cri. »",o:["Il marchait dans la forêt quand il entendit un cri.","Il marche dans la forêt quand il entendait un cri.","Il marchera dans la forêt quand il entendait un cri."],a:0,e:"Décor à l'imparfait (« marchait »), action au passé simple (« entendit »)."}
  ]
},

"expr-dialogue":{
  objectif:"Insérer un dialogue dans un récit en respectant la ponctuation et distinguer discours direct et discours indirect.",
  explication:[
    "Rapporter les paroles d'un personnage, c'est faire un **dialogue**. Au **discours direct**, on reproduit les paroles exactes : on les annonce par deux-points et on les met entre **guillemets** ou après un **tiret**. À chaque **changement de locuteur**, on va à la ligne et on ouvre un nouveau tiret. « — Où vas-tu ? demande Awa. — Au marché, répond Karim. »",
    "Le **verbe de parole** peut précéder ou suivre les paroles. Quand il les suit, il s'écrit dans une **incise**, **sans majuscule**, même après un point d'interrogation ou d'exclamation : « — Viens ! dit-elle. » On choisit des verbes précis : demander, répondre, s'écrier, murmurer, ajouter, protester.",
    "Au **discours indirect**, les paroles sont intégrées à la phrase, sans guillemets, dans une **subordonnée** introduite par « que », « si » ou un mot interrogatif. Il faut adapter les **pronoms**, les **temps** et les **marqueurs de temps** : « Il a dit : « J'arriverai demain. » » devient « Il a dit qu'il arriverait **le lendemain**. »"
  ],
  regle:"**Discours direct** : paroles exactes, entre guillemets ou après un tiret, avec incise sans majuscule. **Discours indirect** : subordonnée sans guillemets, avec adaptation des pronoms et des temps.",
  tableaux:[{titre:"Direct et indirect",entetes:["Discours direct","Discours indirect"],lignes:[["Il dit : « Je viens. »","Il dit qu'il vient."],["Elle demande : « Où va-t-il ? »","Elle demande où il va."],["Il a dit : « J'arriverai demain. »","Il a dit qu'il arriverait le lendemain."]]}],
  exemples:[
    {t:"— Où vas-tu ? demande Awa.",n:"Discours direct : le tiret annonce la réplique, l'incise « demande Awa » ne commence pas par une majuscule."},
    {t:"— Au marché, répond Karim.",n:"Le changement de locuteur est marqué par un retour à la ligne et un nouveau tiret."},
    {t:"Awa demande à Karim où il va.",n:"Discours indirect : la question devient une subordonnée, sans guillemets ni point d'interrogation."}
  ],
  retenir:["Direct : guillemets ou tirets, verbes de parole en incise.","Un changement de locuteur = retour à la ligne + tiret.","Indirect : subordonnée, pas de guillemets.","Au discours indirect, on adapte pronoms, temps et marqueurs de temps."],
  plus:"Un dialogue bien écrit ne ressemble pas à une conversation enregistrée : il est **plus vif et plus dense**. Il doit **révéler le caractère** des personnages, **faire avancer l'action** et rester **vraisemblable**. On alterne les répliques avec de courtes phrases qui décrivent les gestes (« Karim baissa les yeux ») pour éviter que le texte ne soit qu'une liste de répliques. Enfin, le **discours indirect libre** (« Il pensa : elle viendrait sûrement ») mêle les pensées du personnage au récit sans verbe de parole ni guillemets.",
  mini:{t:'qcm',q:"Quel signe annonce des paroles au discours direct ?",o:["Les deux-points suivis de guillemets ou un tiret","Le point-virgule","Les points de suspension"],a:0,e:"Les deux-points, puis les guillemets ou le tiret, ouvrent la parole."},
  exercices:[
    {t:'qcm',q:"Quelle phrase est au discours indirect ?",o:["Il dit qu'il viendra demain.","Il dit : « Je viendrai demain. »","— Je viendrai demain, dit-il."],a:0,e:"Il n'y a pas de guillemets et la phrase contient une subordonnée en « que »."},
    {t:'fix',q:"Corrige la ponctuation : « — Viens ! Dit-elle. »",o:["— Viens ! dit-elle.","— Viens ! Dit-elle.","— Viens, ! dit-elle."],a:0,e:"L'incise ne prend pas de majuscule, même après un point d'exclamation."},
    {t:'fill',q:"Complète : Elle a dit : « Je viens. » → Elle a dit qu'___ venait.",a:["elle"],e:"Au discours indirect, « je » devient « elle » et « viens » devient « venait »."},
    {t:'match',q:"Associe chaque verbe de parole à son sens.",pairs:[["demander","poser une question"],["s'écrier","dire en criant"],["murmurer","parler à voix basse"],["répondre","donner la réponse"]],e:"Chaque verbe précise la manière de parler."},
    {t:'vf',q:"Au discours indirect, on garde les guillemets.",a:false,e:"Le discours indirect n'a pas de guillemets."}
  ],
  quiz:[
    {t:'qcm',q:"Comment marque-t-on un changement de locuteur au discours direct ?",o:["Retour à la ligne et nouveau tiret","Point-virgule","Point d'exclamation"],a:0,e:"C'est la convention du dialogue."},
    {t:'qcm',q:"Quelle phrase est au discours direct ?",o:["Il dit : « Je viens. »","Il dit qu'il vient.","Il dit de venir."],a:0,e:"Les paroles sont reproduites entre guillemets."},
    {t:'vf',q:"L'incise ne commence pas par une majuscule.",a:true,e:"« — Viens ! dit-elle. »"},
    {t:'fill',q:"Complète : Il dit : « Je viens. » → Il dit qu'___ vient.",a:["il"],e:"« Je » devient « il » au discours indirect."},
    {t:'qcm',q:"Quel verbe de parole exprime l'idée de crier ?",o:["s'écrier","murmurer","ajouter"],a:0,e:"S'écrier = dire en criant."},
    {t:'qcm',q:"Au discours indirect, « demain » devient souvent…",o:["le lendemain","hier","aujourd'hui"],a:0,e:"On adapte les marqueurs de temps."},
    {t:'vf',q:"Un dialogue doit être une copie exacte d'une conversation.",a:false,e:"Il est plus vif et plus dense qu'une vraie conversation."},
    {t:'fill',q:"Complète : Elle demande : « Où va-t-il ? » → Elle demande où il ___ .",a:["va"],e:"On garde le verbe, sans inversion."},
    {t:'qcm',q:"Comment appelle-t-on la courte proposition qui indique qui parle (« dit-elle ») ?",o:["une incise","une épithète","un COD"],a:0,e:"C'est une incise."},
    {t:'fix',q:"Corrige : « Il a dit qu'il viendrait demain. » (le narrateur raconte le lendemain)",o:["Il a dit qu'il viendrait le lendemain.","Il a dit qu'il viendrait demain.","Il a dit qu'il viendra demain."],a:0,e:"« Demain » devient « le lendemain » au discours indirect passé."}
  ]
},

"expr-resume":{
  objectif:"Résumer un texte en gardant l'essentiel, avec ses propres mots, dans une longueur donnée.",
  explication:[
    "**Résumer**, c'est **réduire un texte en gardant l'essentiel**, avec ses propres mots. On ne recopie pas des phrases entières, on ne juge pas le texte et on n'y ajoute rien. La longueur est souvent imposée : par exemple **le quart** ou **le tiers** du texte, avec une marge de plus ou moins dix pour cent.",
    "Voici la méthode. **1. Lire** le texte deux fois pour en comprendre le sujet et le plan. **2. Repérer** l'idée principale de chaque paragraphe (soulignée ou notée en marge). **3. Supprimer** les exemples, les anecdotes, les répétitions, les images. **4. Reformuler** avec ses mots, en regroupant plusieurs idées en une seule phrase. **5. Compter** les mots et **relire**.",
    "On respecte l'**ordre des idées** du texte et son **point de vue**. On emploie des **mots de liaison** qui montrent la logique (mais, donc, en effet…), sans copier ceux du texte. Selon la consigne du professeur, on peut aussi introduire le résumé par une formule comme « L'auteur explique que… » : il faut donc toujours **lire la consigne**."
  ],
  regle:"**Résumer = garder l'idée principale, supprimer exemples et détails, reformuler avec ses mots**, respecter l'ordre du texte et la longueur demandée.",
  tableaux:[{titre:"Que garder, que supprimer ?",entetes:["On garde","On supprime"],lignes:[["les idées principales","les exemples et les anecdotes"],["l'enchaînement logique","les répétitions et les reformulations"],["les mots de liaison essentiels (mais, donc…)","les images et les comparaisons"],["le point de vue de l'auteur","son avis personnel de celui qui résume"]]}],
  exemples:[
    {t:"Les enfants qui lisent chaque jour un roman ou un journal enrichissent progressivement leur vocabulaire.",n:"Phrase du texte de départ."},
    {t:"La lecture régulière enrichit le vocabulaire.",n:"Contraction : on garde l'essentiel avec un nom (« la lecture ») au lieu de la longue subordonnée."},
    {t:"Résumé du quart : un texte de 400 mots donne un résumé d'environ 100 mots.",n:"Le résumé suit la longueur imposée, avec une petite marge."}
  ],
  retenir:["Résumer, c'est garder l'essentiel avec ses propres mots.","On supprime exemples, anecdotes, répétitions et images.","On respecte l'ordre des idées et la longueur demandée.","On n'ajoute ni jugement ni idée personnelle."],
  plus:"Pour réduire une phrase, on peut **transformer un verbe en nom** (« les enfants lisent beaucoup » → « la lecture intensive »), **remplacer une énumération** par un mot général (« pommes, poires, bananes » → « des fruits »), utiliser des **synonymes plus courts** et supprimer les **adverbes** inutiles. Évite de **paraphraser** (redire la même chose avec d'autres mots) : un résumé n'est pas un texte plus court qui suit chaque phrase, c'est une **synthèse** des idées.",
  mini:{t:'qcm',q:"Quel élément peut-on supprimer dans un résumé ?",o:["Les exemples et les anecdotes","L'idée principale","L'enchaînement logique"],a:0,e:"Les exemples illustrent les idées : ils ne sont pas indispensables au résumé."},
  exercices:[
    {t:'qcm',q:"Un texte de 400 mots doit être résumé au quart. Combien de mots vise-t-on ?",o:["environ 100","environ 200","environ 300"],a:0,e:"Le quart de 400 fait 100."},
    {t:'vf',q:"Dans un résumé, on peut donner son avis personnel.",a:false,e:"Le résumé reste fidèle au texte : on n'y ajoute ni avis ni idée."},
    {t:'qcm',q:"Quelle phrase est la meilleure contraction de : « Il mange des pommes, des poires et des bananes chaque jour. » ?",o:["Il mange des fruits chaque jour.","Il mange chaque jour.","Il aime beaucoup les fruits."],a:0,e:"On remplace l'énumération par un mot général en gardant le sens."},
    {t:'match',q:"Associe chaque élément à son traitement dans un résumé.",pairs:[["idée principale","on la garde"],["exemple","on le supprime"],["répétition","on la supprime"],["mot de liaison essentiel (mais, donc)","on le garde sous une forme reformulée"]],e:"On garde ce qui structure le raisonnement."},
    {t:'fill',q:"Complète : Résumer, c'est garder l'___ du texte.",a:["essentiel"],e:"L'essentiel : les idées principales."}
  ],
  quiz:[
    {t:'qcm',q:"Résumer un texte, c'est…",o:["le réduire en gardant l'essentiel","le recopier","le critiquer"],a:0,e:"Le résumé conserve l'essentiel."},
    {t:'qcm',q:"Que fait-on en premier dans la méthode ?",o:["Lire le texte","Compter les mots","Écrire la conclusion"],a:0,e:"On lit d'abord pour comprendre."},
    {t:'vf',q:"On peut recopier des phrases entières du texte dans un résumé.",a:false,e:"On reformule avec ses propres mots."},
    {t:'qcm',q:"Un texte de 300 mots doit être résumé au tiers. Combien de mots ?",o:["environ 100","environ 150","environ 200"],a:0,e:"Le tiers de 300 fait 100."},
    {t:'vf',q:"On respecte l'ordre des idées du texte.",a:true,e:"C'est une règle du résumé."},
    {t:'qcm',q:"Quel élément est le plus utile à supprimer ?",o:["Un exemple détaillé","L'idée directrice","Un mot de liaison logique important"],a:0,e:"Les exemples illustrent, ils ne portent pas l'idée."},
    {t:'fill',q:"Complète : Pour résumer, on reformule avec ses ___ mots.",a:["propres"],e:"On ne recopie pas le texte."},
    {t:'qcm',q:"« Pommes, poires, bananes » peut se résumer par…",o:["des fruits","des pommes","des légumes"],a:0,e:"On remplace l'énumération par un terme général."},
    {t:'vf',q:"Il est utile de compter les mots à la fin.",a:true,e:"On vérifie que la longueur est respectée."},
    {t:'fix',q:"Améliore : « Résumé : l'auteur est un peu trop sévère, à mon avis. »",o:["Résumé : l'auteur critique la place des écrans chez les jeunes.","Résumé : l'auteur est un peu trop sévère, à mon avis.","Résumé : je pense que l'auteur a tort."],a:0,e:"Un résumé rapporte les idées de l'auteur, sans jugement personnel."}
  ]
},

"litt-conte":{
  objectif:"Reconnaître le conte et la légende, connaître leurs caractéristiques et leur lien avec la tradition orale, notamment en Afrique.",
  explication:[
    "Le **conte** est un récit **imaginaire**, souvent **transmis oralement** de génération en génération. Il commence souvent par une formule (« Il était une fois… ») et suit un schéma stable : une situation de départ, des épreuves, une fin. Les personnages sont des **types** : le héros courageux, le rusé, le méchant, l'aide magique. Le **merveilleux** y est naturel : animaux qui parlent, objets magiques. Beaucoup de contes se terminent par une **morale**.",
    "La **légende** est un récit qui mêle **faits réels** (un personnage, un lieu, une époque) et éléments **merveilleux**. Elle sert à expliquer l'origine d'un lieu, d'un peuple ou à honorer un héros. La légende de **Soundiata Keïta**, fondateur de l'empire du Mali, en est un exemple célèbre : elle a été transmise par les griots et mise par écrit par Djibril Tamsir Niane dans « Soundjata ou l'épopée mandingue » (1960).",
    "En Afrique de l'Ouest, la **tradition orale** est très riche. Le **griot** est à la fois conteur, musicien et gardien de la mémoire du peuple. Dans de nombreux contes, le lièvre rusé et la hyène naïve s'affrontent. Le poète et conteur sénégalais **Birago Diop** a mis par écrit ces récits dans « Les Contes d'Amadou Koumba » (1947)."
  ],
  regle:"**Conte** : récit imaginaire, personnages types, merveilleux, structure stable, souvent avec une morale. **Légende** : récit qui mêle fait réel et merveilleux, transmis pour honorer un héros ou expliquer une origine.",
  tableaux:[{titre:"Conte et légende",entetes:["","Conte","Légende"],lignes:[["Origine","imaginaire","souvent un fait ou un personnage réel"],["But","divertir, instruire (morale)","honorer, expliquer, garder la mémoire"],["Merveilleux","présent","présent"],["Exemple","Les Contes d'Amadou Koumba","la légende de Soundiata Keïta"]]}],
  exemples:[
    {t:"Il était une fois un lièvre très rusé qui vivait au bord d'un fleuve.",n:"La formule « Il était une fois » ouvre un conte : le lièvre représente la ruse."},
    {t:"Quand le griot commença son récit, tout le village se tut.",n:"Le griot transmet la mémoire du peuple par la parole."},
    {t:"Le roi Soundiata, dit la légende, ne marchait pas encore à sept ans, puis il se dressa et arracha un baobab.",n:"Un fait historique (un roi) mêlé à du merveilleux (la force extraordinaire) : c'est une légende."}
  ],
  retenir:["Le conte est imaginaire ; la légende s'appuie sur un fait ou un personnage réel.","Le merveilleux est présent dans les deux.","La tradition orale transmet contes et légendes.","Le griot est le gardien de la mémoire en Afrique de l'Ouest."],
  plus:"Le **schéma quinaire** du conte suit les cinq étapes : situation initiale, élément perturbateur, péripéties, dénouement, situation finale. Les personnages répondent souvent au **schéma actantiel** : un héros veut obtenir un objet ou atteindre un but, avec l'aide d'un **adjuvant** et contre un **opposant**. Le conte oral est **vivant** : le conteur adapte les paroles, les gestes, les silences selon son public, ce qui explique les nombreuses variantes d'un même conte.",
  mini:{t:'qcm',q:"Quelle formule ouvre souvent un conte ?",o:["Il était une fois","Selon les sources","À ce sujet"],a:0,e:"C'est la formule d'ouverture traditionnelle."},
  exercices:[
    {t:'match',q:"Associe chaque mot à sa définition.",pairs:[["conte","récit imaginaire souvent transmis oralement"],["légende","récit mêlant faits réels et merveilleux"],["griot","gardien de la tradition orale"],["morale","leçon que l'on tire de l'histoire"]],e:"Ce sont les notions de base."},
    {t:'qcm',q:"Qui était Soundiata Keïta ?",o:["Le fondateur de l'empire du Mali, héros d'une légende","Un poète du XIXe siècle","Un personnage de conte européen"],a:0,e:"Il est le fondateur de l'empire du Mali (XIIIe siècle)."},
    {t:'vf',q:"Le conte se transmet souvent à l'oral.",a:true,e:"Le conteur transmet les récits par la parole."},
    {t:'fill',q:"Complète : Un récit qui mêle réalité historique et merveilleux est une ___ .",a:["légende"],e:"La légende s'appuie sur un fait réel."},
    {t:'qcm',q:"Quel personnage type trouve-t-on souvent dans les contes ?",o:["le héros","le narrateur-auteur","le photographe"],a:0,e:"Le héros, le rusé, le méchant, l'aide magique."}
  ],
  quiz:[
    {t:'qcm',q:"Qu'est-ce qu'un conte ?",o:["Un récit imaginaire souvent transmis oralement","Un récit d'histoire","Un poème"],a:0,e:"Le conte est fictif et populaire."},
    {t:'qcm',q:"Quelle est la différence essentielle entre conte et légende ?",o:["La légende s'appuie sur des faits ou des personnages réels","La légende n'a pas de personnages","Le conte est toujours écrit"],a:0,e:"La légende mêle réalité et merveilleux."},
    {t:'vf',q:"Le griot est un gardien de la tradition orale.",a:true,e:"Conteur, musicien et gardien de la mémoire."},
    {t:'qcm',q:"Quel élément est typique du conte ?",o:["Le merveilleux","Le compte rendu","Le résumé"],a:0,e:"Le conte accueille le merveilleux."},
    {t:'fill',q:"Complète : Beaucoup de contes se terminent par une ___ .",a:["morale"],e:"La morale est une leçon."},
    {t:'qcm',q:"Qui a mis par écrit « Les Contes d'Amadou Koumba » ?",o:["Birago Diop","Victor Hugo","Molière"],a:0,e:"Birago Diop, poète et conteur sénégalais."},
    {t:'vf',q:"Un conte est toujours écrit par un seul auteur connu.",a:false,e:"Beaucoup de contes viennent de la tradition orale et ont plusieurs variantes."},
    {t:'qcm',q:"Comment appelle-t-on l'aide du héros dans le schéma actantiel ?",o:["l'adjuvant","l'opposant","le destinataire"],a:0,e:"L'adjuvant aide, l'opposant gêne."},
    {t:'fill',q:"Complète : Le récit transmis de bouche à oreille relève de la tradition ___ .",a:["orale"],e:"La tradition orale."},
    {t:'fix',q:"Corrige : « La légende est un récit entièrement inventé, sans aucun fait réel. »",o:["La légende est un récit qui mêle faits réels et merveilleux.","La légende est un récit entièrement inventé, sans aucun fait réel.","La légende est un récit scientifique."],a:0,e:"La légende s'appuie sur un fait ou un personnage réel."}
  ]
},

"litt-fable":{
  objectif:"Reconnaître une fable, sa structure (récit et morale) et son intention satirique.",
  explication:[
    "La **fable** est un court récit, en vers ou en prose, qui met le plus souvent en scène des **animaux** et se termine par une **morale**, c'est-à-dire une leçon de vie. Les animaux représentent des **types humains** : le renard est rusé, le corbeau vaniteux, le loup cruel, l'agneau innocent.",
    "Une fable comporte deux parties : un **récit** (une petite histoire avec un début, un problème et une fin) et une **morale**, qui peut être explicite (écrite en une phrase) ou implicite (à deviner). La morale est placée le plus souvent **à la fin**, parfois au début. La fable vise à **instruire en amusant** : elle critique les défauts des hommes sans les nommer.",
    "Les grands **fabulistes** sont Ésope (Grèce antique), Phèdre (Rome) et surtout **Jean de La Fontaine** (1621-1695), auteur des « Fables » : « Le Corbeau et le Renard », « La Cigale et la Fourmi », « Le Loup et l'Agneau », « Le Lièvre et la Tortue ». Ses fables sont écrites en vers de longueurs variées, ce qui leur donne un rythme vivant."
  ],
  regle:"Une **fable** = **récit** (le plus souvent avec des animaux) + **morale**. Les animaux représentent des **types humains** : la fable critique les défauts des hommes de façon indirecte.",
  tableaux:[{titre:"Les éléments d'une fable",entetes:["Élément","Rôle","Exemple"],lignes:[["Récit","raconter une petite histoire","Le renard flatte le corbeau pour lui prendre son fromage."],["Personnages","des animaux qui représentent des types humains","renard = le rusé ; corbeau = le vaniteux"],["Morale","tirer une leçon","« Tout flatteur vit aux dépens de celui qui l'écoute. »"]]}],
  exemples:[
    {t:"« Tout flatteur vit aux dépens de celui qui l'écoute. »",n:"C'est la morale du « Corbeau et du Renard » : elle met en garde contre les flatteurs."},
    {t:"« La raison du plus fort est toujours la meilleure. »",n:"Premier vers du « Loup et de l'Agneau » : La Fontaine critique l'injustice du plus puissant."},
    {t:"« Rien ne sert de courir ; il faut partir à point. »",n:"Morale du « Lièvre et de la Tortue » : mieux vaut la persévérance que la précipitation."}
  ],
  retenir:["La fable est un court récit, souvent avec des animaux.","Elle se termine par une morale.","Les animaux représentent des types humains.","La Fontaine est le plus célèbre fabuliste français."],
  plus:"La fable est un genre **satirique** : elle critique la société de son temps (la cour du roi, les puissants) en se cachant derrière des animaux. Elle est aussi **argumentative** : le récit est une illustration au service d'une morale. On appelle **promythium** la morale placée au début et **épimythium** la morale placée à la fin. La Fontaine s'inspire d'Ésope et de Phèdre, mais donne à ses fables un style personnel : vers libres, dialogues vifs, humour.",
  mini:{t:'qcm',q:"Comment appelle-t-on la leçon qui termine une fable ?",o:["la morale","le dénouement","la légende"],a:0,e:"La morale résume la leçon de l'histoire."},
  exercices:[
    {t:'qcm',q:"Qui est l'auteur du « Corbeau et du Renard » ?",o:["Jean de La Fontaine","Molière","Victor Hugo"],a:0,e:"La Fontaine est le fabuliste français le plus célèbre."},
    {t:'match',q:"Associe chaque animal au défaut ou à la qualité qu'il représente dans les fables.",pairs:[["le renard","la ruse"],["le corbeau","la vanité"],["le loup","la cruauté"],["l'agneau","l'innocence"]],e:"Les animaux sont des types humains."},
    {t:'vf',q:"Dans une fable, les animaux représentent souvent des types humains.",a:true,e:"C'est la marque de la fable."},
    {t:'fill',q:"Complète : Une fable se termine par une ___ .",a:["morale"],e:"Récit + morale."},
    {t:'qcm',q:"Quelle est l'intention de la fable ?",o:["Instruire en amusant","Décrire un paysage","Résumer un texte"],a:0,e:"Elle critique les défauts humains sans les nommer."}
  ],
  quiz:[
    {t:'qcm',q:"Qu'est-ce qu'une fable ?",o:["Un court récit avec une morale","Un long roman","Une pièce de théâtre"],a:0,e:"Récit + morale."},
    {t:'qcm',q:"Quels personnages a-t-on le plus souvent dans une fable ?",o:["Des animaux","Des dieux grecs","Des robots"],a:0,e:"Les animaux représentent des types humains."},
    {t:'vf',q:"La morale d'une fable est toujours placée au début.",a:false,e:"Le plus souvent à la fin, parfois au début."},

/* Le Store écrit sur le téléphone (localStorage). Le Repo est la seule porte
   d'accès aux données : pour passer à un vrai serveur (Supabase, Firebase…),
   on ne remplace que le contenu du Repo, pas les écrans. */
const mem={};
const Store={
  get(k,d){try{const v=localStorage.getItem('fak:'+k);if(v!=null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d},
  set(k,v){mem[k]=v;try{localStorage.setItem('fak:'+k,JSON.stringify(v))}catch(e){}},
  del(k){delete mem[k];try{localStorage.removeItem('fak:'+k)}catch(e){}}
};
const emptyProgress=()=>({points:0,lessons:{},exos:{},quizzes:[],badges:{},days:{},bestStreak:0,last:null,recent:[]});
const enc=new TextEncoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const mkSalt=()=>{try{return b64(crypto.getRandomValues(new Uint8Array(16)))}catch(e){return Math.random().toString(36).slice(2)}};
/* Le mot de passe n'est jamais enregistré : seulement son empreinte (PBKDF2, 120 000 tours). */
async function hashPwd(pwd,salt){
  try{
    const key=await crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
    return 'p1:'+b64(bits);
  }catch(e){
    let h=5381;const s=salt+pwd;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
    return 'w0:'+h;
  }
}
function normContact(s){
  s=(s||'').trim();
  if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s))return{type:'email',v:s.toLowerCase()};
  const d=s.replace(/[\s.\-()]/g,'');
  if(/^\+?\d{8,15}$/.test(d))return{type:'tel',v:d};
  return null;
}
let fails={n:0,until:0};
const Repo={
  users:()=>Store.get('users',{}),
  session:()=>Store.get('session',null),
  current(){const id=this.session();if(!id)return null;return id==='guest'?Store.get('guest',null):(this.users()[id]||null)},
  save(u){if(u.id==='guest')Store.set('guest',u);else{const us=this.users();us[u.id]=u;Store.set('users',us)}},
  progress:id=>Object.assign(emptyProgress(),Store.get('progress:'+id,{})),
  saveProgress:(id,p)=>Store.set('progress:'+id,p),
  startGuest(){if(!Store.get('guest',null))Store.set('guest',{id:'guest',guest:true,prenom:'',nom:'',classe:null});Store.set('session','guest')},
  async register(f){
    const prenom=f.prenom.trim(),nom=f.nom.trim();
    if(prenom.length<2||nom.length<2)return{ok:false,error:"Écris ton prénom et ton nom (2 lettres minimum chacun)."};
    const c=normContact(f.contact);
    if(!c)return{ok:false,error:"Écris une adresse e-mail valide (awa@exemple.com) ou un numéro de téléphone (+22507000000)."};
    if((f.pwd||'').length<8)return{ok:false,error:"Le mot de passe doit contenir au moins 8 caractères."};
    if(!CL.includes(f.classe))return{ok:false,error:"Choisis ta classe dans la liste."};
    const us=this.users();
    if(Object.values(us).some(u=>u.contact===c.v))return{ok:false,error:"Un compte existe déjà avec cette adresse ou ce numéro. Touche « Se connecter »."};
    const id=uid(),salt=mkSalt(),hash=await hashPwd(f.pwd,salt);
    us[id]={id,prenom:prenom.slice(0,40),nom:nom.slice(0,40),contact:c.v,contactType:c.type,salt,hash,classe:f.classe,created:Date.now()};
    Store.set('users',us);
    if(this.session()==='guest'){Store.set('progress:'+id,Store.get('progress:guest',emptyProgress()));Store.del('guest');Store.del('progress:guest')}
    Store.set('session',id);
    cloudSyncAfterAuth(id,c,f.pwd);
    return{ok:true};
  },
  async login(contact,pwd){
    if(Date.now()<fails.until)return{ok:false,error:"Trop d'essais. Attends "+Math.ceil((fails.until-Date.now())/1000)+" secondes puis réessaie."};
    const c=normContact(contact);
    const localUser=c&&Object.values(this.users()).find(x=>x.contact===c.v);
    if(localUser){
      const good=(await hashPwd(pwd||'',localUser.salt))===localUser.hash;
      if(good){
        fails={n:0,until:0};Store.set('session',localUser.id);
        if(!localUser.cloudUid)cloudSyncAfterAuth(localUser.id,c,pwd);
        return{ok:true};
      }
    }
    /* Pas de compte sur cet appareil : essaie un compte en ligne existant (créé sur un autre appareil), si c'est une adresse e-mail. */
    if(c&&c.type==='email'&&window.Cloud&&Cloud.ready&&navigator.onLine){
      try{
        const r=await Cloud.loginEmail(c.v,pwd);
        if(r.ok){
          const [student,progress]=await Promise.all([Cloud.loadStudent(r.uid),Cloud.loadProgress(r.uid)]);
          const id=uid(),salt=mkSalt(),hash=await hashPwd(pwd,salt);
          const us=this.users();
          us[id]={id,prenom:(student&&student.prenom)||'',nom:(student&&student.nom)||'',contact:c.v,contactType:c.type,salt,hash,classe:(student&&student.classe)&&CL.includes(student.classe)?student.classe:CL[0],created:Date.now(),cloudUid:r.uid};
          Store.set('users',us);
          if(progress)Store.set('progress:'+id,progress);
          fails={n:0,until:0};Store.set('session',id);
          return{ok:true,restored:true};
        }
      }catch(e){}
    }
    fails.n++;if(fails.n>=5){fails={n:0,until:Date.now()+30000}}
    return{ok:false,error:"E-mail, téléphone ou mot de passe incorrect."};
  },
  logout(){Store.set('session',null);if(window.Cloud&&Cloud.logout)Cloud.logout().catch(()=>{})},
  remove(id){if(id==='guest'){Store.del('guest')}else{const us=this.users();delete us[id];Store.set('users',us)}Store.del('progress:'+id);Store.set('session',null);if(window.Cloud&&Cloud.logout)Cloud.logout().catch(()=>{})}
};

/* ---- Synchronisation en ligne (Firebase), toujours "au mieux" : si le
   réseau ou le service ne répond pas, l'appli continue avec les données
   locales, seules à faire foi hors connexion. ---- */
async function cloudSyncAfterAuth(localId,contact,pwd){
  if(!(window.Cloud&&Cloud.ready)||!contact||contact.type!=='email'||!navigator.onLine)return;
  try{
    let r=await Cloud.registerEmail(contact.v,pwd);
    if(!r.ok&&r.code==='auth/email-already-in-use')r=await Cloud.loginEmail(contact.v,pwd);
    if(!r.ok)return;
    const us=Repo.users();const u=us[localId];if(!u)return;
    u.cloudUid=r.uid;Store.set('users',us);
    if(S.user&&S.user.id===localId)S.user.cloudUid=r.uid;
    await pushCloud(localId);
    if(S.user&&S.user.id===localId)checkTeacher();
  }catch(e){}
}
async function pushCloud(localId){
  if(!(window.Cloud&&Cloud.ready))return;
  const us=Repo.users();const u=us[localId];if(!u||!u.cloudUid)return;
  const p=Repo.progress(localId);
  try{
    await Cloud.saveProgress(u.cloudUid,p);
    await Cloud.saveStudent(u.cloudUid,{prenom:u.prenom,nom:u.nom,classe:u.classe,contact:u.contact,points:p.points,lessons:Object.keys(p.lessons).length,quizzes:p.quizzes.length,avgQuiz:avgQuiz(p),updatedAt:Date.now()});
  }catch(e){}
}

/* ============================ 5. PROGRESSION ============================ */
const day=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function streak(p){let n=0;const d=new Date();if(!p.days[day(d)])d.setDate(d.getDate()-1);while(p.days[day(d)]){n++;d.setDate(d.getDate()-1)}return n}
const bestQuiz=(p,id)=>p.quizzes.filter(q=>q.id===id).reduce((m,q)=>Math.max(m,q.score),-1);
const ms=(p,id)=>(p.lessons[id]?1:0)+(p.exos[id]?1:0)+(bestQuiz(p,id)>=APP.seuil?1:0);
function pctOf(p,cat){const av=availableLessons(cat);return av.length?Math.round(av.reduce((s,l)=>s+ms(p,l.id),0)/(3*av.length)*100):null}
function avgQuiz(p){return p.quizzes.length?p.quizzes.reduce((s,q)=>s+q.score/q.total*10,0)/p.quizzes.length:null}
function levelInfo(pts){let i=0;LEVELS.forEach((l,k)=>{if(pts>=l.min)i=k});const cur=LEVELS[i],nx=LEVELS[i+1];return{n:i+1,nom:cur.nom,next:nx?nx.min:null,pct:nx?Math.round((pts-cur.min)/(nx.min-cur.min)*100):100,left:nx?nx.min-pts:0}}
function catExpert(cat,p){let av=availableLessons(cat);const cl=S.user&&S.user.classe;if(cl){const own=av.filter(l=>l.classes.includes(cl));if(own.length)av=own}return av.length>0&&av.every(l=>p.lessons[l.id]&&bestQuiz(p,l.id)>=8)}
const BADGES=[
  {id:'first',e:'🏅',nom:'Première leçon',desc:'Terminer une leçon',test:p=>Object.keys(p.lessons).length>=1},
  {id:'streak5',e:'🔥',nom:"5 jours d'apprentissage",desc:"5 jours de suite d'activité",test:p=>(p.bestStreak||0)>=5},
  {id:'lessons10',e:'📚',nom:'10 leçons terminées',desc:'Terminer 10 leçons',test:p=>Object.keys(p.lessons).length>=10},
  {id:'quiz10',e:'🧠',nom:'10 quiz réussis',desc:'Réussir 10 quiz (6/10 minimum)',test:p=>p.quizzes.filter(q=>q.score/q.total*10>=APP.seuil).length>=10},
  {id:'gram',e:'🏆',nom:'Expert en grammaire',desc:'Terminer toutes les leçons de grammaire de ta classe avec 8/10 au quiz',test:p=>catExpert('grammaire',p)},
  {id:'perfect',e:'💯',nom:'Sans faute',desc:'Obtenir 10/10 à un quiz',test:p=>p.quizzes.some(q=>q.score===q.total)}
];
function bump(p){const d=day();p.days[d]=(p.days[d]||0)+1;p.bestStreak=Math.max(p.bestStreak||0,streak(p))}
function evalBadges(p){const got=[];BADGES.forEach(b=>{if(!p.badges[b.id]&&b.test(p)){p.badges[b.id]=Date.now();got.push(b)}});return got}
let cloudTimer=null;
function commit(){
  Repo.saveProgress(S.user.id,S.prog);
  if(S.user&&!S.user.guest&&S.user.cloudUid){
    clearTimeout(cloudTimer);
    cloudTimer=setTimeout(()=>{pushCloud(S.user.id).catch(()=>{})},2500);
  }
}
function recLesson(id){const p=S.prog;let gain=0;if(!p.lessons[id]){p.lessons[id]=Date.now();gain=20;bump(p)}p.points+=gain;const nb=evalBadges(p);commit();return{gain,nb}}
function recRun(id,mode,score,total){
  const p=S.prog;let gain=0;
  if(mode==='exos'){
    const prev=p.exos[id];gain=(prev?0:10)+Math.max(0,score-(prev?prev.best:0))*2;
    p.exos[id]={best:Math.max(prev?prev.best:0,score),total,tries:(prev?prev.tries:0)+1,count:(prev?prev.count:0)+total,ts:Date.now()};
  }else{
    const pb=bestQuiz(p,id);gain=(pb<0?10:0)+Math.max(0,score-Math.max(pb,0))*3;
    p.quizzes.push({id,score,total,ts:Date.now()});if(p.quizzes.length>200)p.quizzes.shift();
  }
  bump(p);p.points+=gain;const nb=evalBadges(p);commit();return{gain,nb};
}

/* ---------- Questions (utilisées par le petit exercice, les exercices et les quiz) ---------- */
function newQS(q){
  const s={q,done:false,ok:null,given:''};
  if(q.t==='qcm'||q.t==='fix'){s.opts=shuf(q.o.map((t,i)=>({t,ok:i===q.a})))}
  if(q.t==='find'){s.tokens=q.s.split(' ');s.sel=new Set()}
  if(q.t==='match'){s.left=q.pairs.map((p,i)=>({t:p[0],i}));s.right=shuf(q.pairs.map((p,i)=>({t:p[1],i})));s.map={};s.ls=null}
  return s;
}
function correctText(q){
  if(q.t==='qcm'||q.t==='fix')return q.o[q.a];
  if(q.t==='vf')return q.a?'Vrai':'Faux';
  if(q.t==='fill')return q.a.slice(0,3).join(' ou ');
  if(q.t==='find')return q.a.join(', ');
  return q.pairs.map(p=>p[0]+' = '+p[1]).join(' ; ');
}
const qLabel=q=>q.q.replace(/___/g,'…')+(q.s?' « '+q.s+' »':'');
function qHTML(s){
  const q=s.q,d=s.done;
  const blank=d&&q.t==='fill'?`<span class="blank ${s.ok?'ok':'bad'}">${esc(s.given)}</span>`:'<span class="blank">&nbsp;</span>';
  const qt=`<p class="qtext">${md(q.q).replace(/___/g,blank)}</p>`;
  let body='';
  if(q.t==='qcm'||q.t==='fix'){
    body=qt+'<div class="opts">'+s.opts.map((o,i)=>{let cls='opt';if(d){cls+=o.ok?' ok':(s.pick===i?' bad':' dim')}
      return `<button class="${cls}" data-a="qpick" data-i="${i}" ${d?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${md(o.t)}</span></button>`}).join('')+'</div>';
  }else if(q.t==='vf'){
    body=qt+'<div class="row2">'+[['true','Vrai'],['false','Faux']].map(([v,l])=>{let cls='opt center';if(d){cls+=((v==='true')===q.a)?' ok':(s.pick===v?' bad':' dim')}
      return `<button class="${cls}" data-a="qvf" data-v="${v}" ${d?'disabled':''}>${l}</button>`}).join('')+'</div>';
  }else if(q.t==='fill'){
    body=qt+(d?'':'<input id="fillin" class="input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Écris ta réponse" data-enter="qfill"><div class="stack"><button class="btn btn-primary" data-a="qfill">Valider</button></div>');
  }else if(q.t==='find'){
    const good=q.a.map(x=>x.toLowerCase());
    body=qt+'<div class="tokens">'+s.tokens.map((t,i)=>{const on=s.sel.has(i);let cls='tok'+(on?' on':'');
      if(d){const g=good.includes(cw(t));cls='tok'+(g&&on?' ok':(g?' miss':(on?' bad':'')))}
      return `<button class="${cls}" data-a="qtok" data-i="${i}" ${d?'disabled':''}>${esc(t)}</button>`}).join('')+'</div>'
      +(d?'':`<button class="btn btn-primary" data-a="qfind" ${s.sel.size?'':'disabled'}>Valider</button>`);
  }else if(q.t==='match'){
    body=qt+(d?'':'<p class="hint">Touche un mot à gauche, puis sa réponse à droite.</p>')+'<div class="match"><div>'+s.left.map(l=>{
      const j=s.map[l.i];let cls='mt';if(j!==undefined)cls+=' lk'+(l.i%4);if(s.ls===l.i)cls+=' sel';if(d)cls=' mt '+(j===l.i?'ok':'bad');
      return `<button class="${cls.trim()}" data-a="qml" data-i="${l.i}" ${d?'disabled':''}>${esc(l.t)}${d?(j===l.i?' ✓':' ✗'):''}</button>`}).join('')+'</div><div>'
      +s.right.map(r=>{const owner=Object.keys(s.map).find(k=>s.map[k]===r.i);const cls='mt'+(owner!==undefined&&!d?' lk'+(+owner%4):'');
      return `<button class="${cls}" data-a="qmr" data-i="${r.i}" ${d?'disabled':''}>${esc(r.t)}</button>`}).join('')+'</div></div>'
      +(d?'':`<button class="btn btn-primary" data-a="qmv" ${Object.keys(s.map).length===q.pairs.length?'':'disabled'}>Valider</button>`);
  }
  return `<span class="qtype">${TYPES[q.t]}</span>${body}${d?fbHTML(s):''}`;
}
function fbHTML(s){
  const q=s.q,ok=s.ok;
  const showTag=S.screen==='lesson';
  return `<div id="fb" class="fb ${ok?'ok':'bad'}" role="status">${showTag?'<p class="fb-tag">Correction</p>':''}<p class="fb-h">${ok?'✅ Bonne réponse':'❌ Mauvaise réponse'}</p>${ok?'':`<p>Bonne réponse : <b>${esc(correctText(q))}</b></p>`}<p>${md(q.e||'')}</p></div>`;
}
function paintQ(){
  const h=$('#qhost');if(h)h.innerHTML=qHTML(S.cur);
  if(S.screen==='lesson'){const l=$('#lend');if(l)l.innerHTML=lendHTML(S.params.id)}
  if(S.screen==='run'){const f=$('#runfoot');if(f)f.innerHTML=runFoot()}
  const fb=$('#fb');if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function answer(ok,given){
  const s=S.cur;if(!s||s.done)return;
  s.done=true;s.ok=ok;s.given=given;
  if(S.screen==='run')S.run.results.push({q:s.q,ok,given,correct:correctText(s.q)});
  paintQ();
}
