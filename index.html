},

"voc-figures":{
  objectif:"Reconnaître les principales figures de style et expliquer l'effet qu'elles produisent.",
  explication:[
    "Une **figure de style** est un procédé d'expression qui rend le langage plus **imagé**, plus **expressif**, pour frapper l'imagination du lecteur. Repérer une figure ne suffit pas : il faut toujours **expliquer son effet** (souligner, émouvoir, faire rire, faire réfléchir…).",
    "Les **figures d'analogie** rapprochent deux réalités. La **comparaison** utilise un outil (comme, tel, semblable à, ressembler à) : « Il est fort **comme** un lion. » La **métaphore** rapproche sans outil : « Cet homme est un lion. » La **personnification** donne des caractères humains à une chose ou à un animal : « Le vent hurle. »",
    "D'autres figures servent à **insister** ou à **opposer**. L'**hyperbole** exagère : « Je meurs de faim. » L'**antithèse** rapproche deux termes opposés : « Hier riche, aujourd'hui pauvre. » L'**anaphore** répète un même mot en début de phrases ou de vers. La **litote** dit moins pour faire entendre plus : « Ce n'est pas mauvais » pour « c'est très bien ». L'**oxymore** unit deux mots contradictoires : « un silence assourdissant »."
  ],
  regle:"**Repérer** la figure, la **nommer**, puis **expliquer son effet**. La comparaison a un **outil** (comme…) ; la métaphore n'en a pas.",
  tableaux:[{titre:"Les figures à connaître",entetes:["Figure","Définition","Exemple"],lignes:[["Comparaison","rapprochement avec un outil","Fort comme un lion."],["Métaphore","rapprochement sans outil","Cet homme est un lion."],["Personnification","une chose prend des traits humains","La nuit avale la ville."],["Hyperbole","exagération","Je t'ai attendu une éternité."],["Antithèse","deux idées opposées","Hier riche, aujourd'hui pauvre."],["Anaphore","répétition en début de phrase","Il a tout perdu, il a tout donné."],["Litote","dire moins pour dire plus","Va, je ne te hais point."],["Oxymore","deux mots contradictoires","un silence assourdissant"]]}],
  exemples:[
    {t:"Il court **comme** le vent.",n:"Comparaison : l'outil « comme » relie « il » (le comparé) et « le vent » (le comparant). Elle souligne sa rapidité."},
    {t:"Cette ville est **une fourmilière**.",n:"Métaphore : pas d'outil de comparaison. L'image suggère l'agitation et la foule."},
    {t:"Le vent **hurle** dans les arbres.",n:"Personnification : le vent a le cri d'un être vivant, ce qui rend la scène inquiétante."}
  ],
  retenir:["Une figure de style rend l'expression plus imagée.","Comparaison : avec outil. Métaphore : sans outil.","Personnification : traits humains donnés à une chose.","Toujours expliquer l'effet produit."],
  plus:"Dans une comparaison, on distingue le **comparé** (ce dont on parle), le **comparant** (ce à quoi on le compare), l'**outil** et le **point commun** : dans « Il est fort comme un lion », le comparé est « il », le comparant « un lion », l'outil « comme » et le point commun « fort ». La **litote** est courante dans la langue de tous les jours (« Ce n'est pas mal ») ; l'**oxymore** est fréquent en poésie parce qu'il exprime des sentiments contradictoires (une douce violence).",
  mini:{t:'qcm',q:"« Cet homme est un lion. » Quelle figure de style ?",o:["métaphore","comparaison","litote"],a:0,e:"Le rapprochement se fait sans outil de comparaison : c'est une métaphore."},
  exercices:[
    {t:'qcm',q:"« Elle est belle comme le jour. » Quelle figure ?",o:["comparaison","métaphore","hyperbole"],a:0,e:"L'outil « comme » relie « elle » et « le jour »."},
    {t:'match',q:"Associe chaque figure à son exemple.",pairs:[["comparaison","Il est rusé comme un renard."],["métaphore","Cet enfant est un rayon de soleil."],["personnification","Le vent murmurait dans les arbres."],["hyperbole","J'ai mille choses à faire."]],e:"Outil de comparaison, image sans outil, objet qui prend des traits humains, exagération."},
    {t:'vf',q:"Une métaphore contient un outil de comparaison.",a:false,e:"C'est la comparaison qui en contient un (comme, tel, semblable à…)."},
    {t:'fill',q:"« Je suis mort de fatigue » est une ___ .",a:["hyperbole"],e:"C'est une exagération : on n'est pas réellement mort de fatigue."},
    {t:'find',q:"Touche l'outil de comparaison, puis valide.",s:"Sa voix est douce comme le miel",a:["comme"],e:"« Comme » est l'outil qui relie « voix » et « miel »."}
  ],
  quiz:[
    {t:'qcm',q:"À quoi sert une figure de style ?",o:["À rendre l'expression plus imagée et plus expressive","À corriger les fautes","À raccourcir un texte"],a:0,e:"Elle donne du relief et de l'émotion au texte."},
    {t:'qcm',q:"« Il est rapide comme l'éclair. » Quelle figure ?",o:["comparaison","métaphore","litote"],a:0,e:"L'outil « comme » est présent."},
    {t:'qcm',q:"« Ce garçon est une vraie tornade. » Quelle figure ?",o:["métaphore","comparaison","antithèse"],a:0,e:"Aucun outil de comparaison : c'est une métaphore."},
    {t:'vf',q:"« Le vent hurlait » est une personnification.",a:true,e:"Le vent reçoit une caractéristique d'un être vivant : il hurle."},
    {t:'fill',q:"« J'ai attendu une éternité » est une ___ .",a:["hyperbole"],e:"C'est une exagération."},
    {t:'qcm',q:"Quelle figure trouve-t-on dans « un silence assourdissant » ?",o:["un oxymore","une anaphore","une litote"],a:0,e:"Les deux mots sont contradictoires : le silence ne peut pas assourdir."},
    {t:'qcm',q:"« Va, je ne te hais point » est une…",o:["litote","hyperbole","comparaison"],a:0,e:"Dire « je ne te hais point » pour faire entendre « je t'aime » : on dit moins pour dire plus."},
    {t:'vf',q:"L'antithèse rapproche deux idées opposées.",a:true,e:"Hier riche, aujourd'hui pauvre : l'opposition est mise en valeur."},
    {t:'qcm',q:"Comment appelle-t-on la répétition d'un même mot au début de plusieurs phrases ou vers ?",o:["l'anaphore","l'antithèse","la litote"],a:0,e:"C'est la définition de l'anaphore."},
    {t:'qcm',q:"« La lune est un œil qui nous regarde. » Quelle figure ?",o:["métaphore","comparaison","hyperbole"],a:0,e:"La lune est directement identifiée à un œil, sans outil de comparaison."}
  ]
},

"expr-lettre":{
  objectif:"Écrire une lettre en respectant sa structure et en adaptant le ton au destinataire.",
  explication:[
    "Une **lettre** est un message écrit adressé à une personne précise. Le ton dépend du destinataire : à un proche (ami, famille), on écrit une **lettre personnelle** avec le tutoiement et un ton chaleureux ; à une personne que l'on respecte ou que l'on ne connaît pas (directeur, mairie, entreprise), on écrit une **lettre formelle** avec le vouvoiement et des formules de politesse.",
    "Une lettre suit toujours le même plan : le **lieu et la date** (en haut à droite), la **formule d'appel** (« Cher Karim, » ou « Monsieur le Directeur, »), le **corps de la lettre** (plusieurs paragraphes), la **formule de politesse** puis la **signature**.",
    "Le corps de la lettre s'organise en trois temps : on explique **pourquoi on écrit** (introduction), on donne les **informations ou les arguments** (développement) et on termine par une **demande** ou un **souhait** (conclusion). Chaque paragraphe traite une idée."
  ],
  regle:"**Lettre = lieu et date + formule d'appel + corps de la lettre + formule de politesse + signature.** Le ton (tu ou vous) et les formules changent selon le destinataire.",
  tableaux:[{titre:"Lettre personnelle ou lettre formelle ?",entetes:["","Lettre personnelle","Lettre formelle"],lignes:[["Destinataire","un proche","une autorité, une personne inconnue"],["Pronom","tu","vous"],["Appel","Cher Karim,","Monsieur le Directeur,"],["Fin","À bientôt, je t'embrasse.","Je vous prie d'agréer, Monsieur le Directeur, l'expression de mes salutations distinguées."]]}],
  exemples:[
    {t:"**Kaya, le 12 mars** — Cher Karim, j'espère que tu vas bien.",n:"Lieu et date, puis formule d'appel et première phrase chaleureuse : c'est une lettre personnelle."},
    {t:"Je me permets de vous écrire afin de solliciter une autorisation d'absence.",n:"Dans une lettre formelle, on annonce clairement l'objet de la demande, en vouvoyant."},
    {t:"Je vous prie d'agréer, Monsieur le Directeur, l'expression de mes salutations distinguées.",n:"C'est une formule de politesse classique : on y reprend la formule d'appel."}
  ],
  retenir:["Structure : lieu et date, appel, corps, formule de politesse, signature.","Lettre à un proche : tu, ton chaleureux.","Lettre formelle : vous, formules de politesse, objet clair.","Relire pour corriger l'orthographe avant d'envoyer."],
  plus:"Dans une lettre formelle, on place en haut à gauche les **coordonnées de l'expéditeur** (nom, adresse), à droite celles du **destinataire**, puis l'**objet** de la lettre (« Objet : demande d'autorisation d'absence »). La formule de politesse doit **reprendre le titre** de l'appel : si vous écrivez « Monsieur le Directeur, », terminez avec « …Monsieur le Directeur, … ». La même structure s'applique à un **courriel**. Évite toujours les abréviations de SMS dans une lettre formelle.",
  mini:{t:'qcm',q:"Quelle formule d'appel convient pour une lettre au directeur de l'école ?",o:["Monsieur le Directeur,","Salut le directeur !","Coucou Monsieur,"],a:0,e:"Une lettre formelle commence par un appel respectueux."},
  exercices:[
    {t:'qcm',q:"Dans une lettre à un inspecteur, quel pronom emploie-t-on ?",o:["vous","tu","on"],a:0,e:"Une lettre formelle se rédige au vouvoiement."},
    {t:'match',q:"Associe chaque élément de la lettre à sa place ou à son rôle.",pairs:[["Lieu et date","en haut à droite"],["Formule d'appel","au début, avant le message"],["Corps de la lettre","le message, en paragraphes"],["Signature","à la fin, après la formule de politesse"]],e:"Chaque élément a une place précise dans la lettre."},
    {t:'vf',q:"On peut employer des abréviations de SMS dans une lettre formelle.",a:false,e:"Une lettre formelle demande une langue soignée et sans abréviation."},
    {t:'qcm',q:"Quelle formule de fin convient à une lettre à un ami ?",o:["À bientôt, je t'embrasse.","Veuillez agréer mes salutations distinguées.","Je vous prie de bien vouloir m'excuser."],a:0,e:"Avec un ami, on choisit un ton chaleureux et simple."},
    {t:'fix',q:"Corrige le début d'une lettre au directeur : « Salut Monsieur, »",o:["Monsieur le Directeur,","Salut Monsieur,","Coucou Monsieur le Directeur,"],a:0,e:"On emploie un appel respectueux dans une lettre formelle."}
  ],
  quiz:[
    {t:'qcm',q:"Où place-t-on le lieu et la date dans une lettre ?",o:["En haut à droite","En bas à gauche","Au milieu du texte"],a:0,e:"C'est la convention : lieu et date en haut à droite."},
    {t:'qcm',q:"Quelle est la bonne structure d'une lettre ?",o:["Date, appel, corps, formule de politesse, signature","Signature, corps, date, appel","Corps, appel, signature"],a:0,e:"C'est l'ordre habituel."},
    {t:'vf',q:"Dans une lettre personnelle à un ami, on peut employer le tutoiement.",a:true,e:"Le ton dépend du destinataire."},
    {t:'qcm',q:"Quelle phrase convient à une lettre formelle ?",o:["Je vous serais reconnaissant de bien vouloir me répondre.","Réponds-moi vite !","Dis-moi ce que tu en penses."],a:0,e:"Elle vouvoie et emploie un ton poli."},
    {t:'fill',q:"Complète : Dans une lettre formelle, on emploie le pronom ___ pour s'adresser au destinataire.",a:["vous"],e:"On vouvoie une personne que l'on respecte."},
    {t:'qcm',q:"Que doit-on faire avant d'envoyer une lettre ?",o:["La relire pour corriger les fautes","La raccourcir de moitié","La recopier en majuscules"],a:0,e:"La relecture évite les fautes d'orthographe et d'inattention."},
    {t:'vf',q:"La formule de politesse se place avant le corps de la lettre.",a:false,e:"Elle se place à la fin, avant la signature."},
    {t:'qcm',q:"Quel est le rôle de l'introduction du corps de la lettre ?",o:["Expliquer pourquoi on écrit","Donner la signature","Remercier le facteur"],a:0,e:"On annonce d'abord la raison de la lettre."},
    {t:'fill',q:"Complète l'appel : ___ le Directeur,",a:["monsieur"],e:"« Monsieur le Directeur, » est l'appel habituel."},
    {t:'fix',q:"Corrige la formule de fin d'une lettre à un directeur : « Bisous et à bientôt ! »",o:["Je vous prie d'agréer, Monsieur le Directeur, l'expression de mes salutations distinguées.","Bisous et à bientôt !","Salut, à la prochaine !"],a:0,e:"Une lettre formelle se termine par une formule de politesse."}
  ]
},

"expr-description":{
  objectif:"Décrire un lieu de façon organisée, en utilisant les cinq sens et un vocabulaire précis.",
  explication:[
    "**Décrire**, c'est faire voir un lieu à un lecteur qui ne l'a jamais vu, comme si l'on peignait un tableau avec des mots. Pour réussir une description, il faut choisir un **point de vue** (d'où observe-t-on ?) et suivre un **ordre** : du premier plan vers l'arrière-plan, de gauche à droite ou de haut en bas.",
    "Une bonne description ne se limite pas à la vue. On fait appel aux **cinq sens** : ce que l'on **voit** (couleurs, formes), **entend** (bruits), **sent** (odeurs), **touche** (chaleur, texture) et parfois **goûte**. On utilise des **adjectifs précis**, des **comparaisons** et des **indicateurs de lieu** : au premier plan, au fond, à gauche, en face de, au loin, au-dessus de…",
    "On peut organiser son texte en trois parties : une **présentation générale** du lieu (où, quand, première impression), une **description détaillée** organisée, puis une **impression finale**. On emploie l'imparfait (pour un souvenir) ou le présent (pour une description immédiate). On évite les verbes trop vagues (**être, avoir, il y a**) et on les remplace par des verbes précis : se dresser, s'étendre, s'élever, briller."
  ],
  regle:"Une description s'organise : **point de vue + ordre dans l'espace + précision** (adjectifs, sens, comparaisons). On évite « il y a », « être », « avoir ».",
  tableaux:[{titre:"Les indicateurs de lieu",entetes:["Pour situer","Exemples"],lignes:[["Devant / derrière","au premier plan, au fond, en arrière-plan"],["À gauche / à droite","sur la gauche, à ma droite, de chaque côté"],["En haut / en bas","au-dessus de, en contrebas, au pied de"],["Près / loin","à côté de, en face de, au loin"]]}],
  exemples:[
    {t:"Au premier plan, les vendeuses **étalaient** leurs mangues sur des nattes colorées.",n:"Un indicateur de lieu (au premier plan) + un verbe précis (étalaient) + un adjectif de couleur."},
    {t:"Une odeur de **poisson grillé** flottait dans l'air.",n:"Cette phrase fait appel à l'odorat, ce qui rend la description plus vivante."},
    {t:"Au loin, le **grand baobab** dressait sa silhouette.",n:"« Au loin » situe le lieu ; le verbe « dressait » est plus précis que « il y avait »."}
  ],
  retenir:["Choisir un point de vue et un ordre (du proche au lointain, de gauche à droite…).","Faire appel aux cinq sens.","Employer des indicateurs de lieu et des adjectifs précis.","Remplacer « il y a » et « être » par des verbes précis."],
  plus:"La description peut être **objective** (le narrateur décrit ce qu'on voit, sans donner son avis) ou **subjective** (il exprime ses impressions et ses sentiments : « un marché envahissant, étourdissant »). Elle peut être **fixe** (le regard reste immobile) ou **mobile** (le regard, ou le personnage, se déplace). Dans un récit, la description ne sert pas seulement à faire voir : elle crée une atmosphère et annonce parfois ce qui va se passer.",
  mini:{t:'qcm',q:"Quel groupe indique une position dans l'espace ?",o:["Au fond de la cour","Depuis longtemps","Avec joie"],a:0,e:"« Au fond de la cour » situe un lieu ; les deux autres groupes indiquent le temps ou la manière."},
  exercices:[
    {t:'qcm',q:"Quel ordre est le plus clair pour décrire un paysage ?",o:["Du premier plan à l'arrière-plan","Au hasard","Uniquement les couleurs"],a:0,e:"Suivre un ordre permet au lecteur de bien se représenter le lieu."},
    {t:'match',q:"Associe chaque phrase au sens qu'elle fait appel.",pairs:[["vue","Les toits rouges brillaient au soleil."],["ouïe","Les cigales chantaient sans arrêt."],["odorat","Une odeur de pain chaud flottait."],["toucher","Le sable brûlant collait à mes pieds."]],e:"Chaque phrase s'appuie sur un sens différent."},
    {t:'qcm',q:"Quel verbe est plus précis que « il y a » ?",o:["se dresser","être","faire"],a:0,e:"« Un baobab se dresse » est plus expressif que « il y a un baobab »."},
    {t:'vf',q:"Dans une description, on n'utilise que le sens de la vue.",a:false,e:"Les cinq sens rendent la description plus riche."},
    {t:'find',q:"Touche l'indicateur de lieu, puis valide.",s:"Au loin le fleuve brille",a:["Au","loin"],e:"« Au loin » situe le fleuve dans l'espace."}
  ],
  quiz:[
    {t:'qcm',q:"Que faut-il choisir avant de décrire un lieu ?",o:["Un point de vue et un ordre","Un titre seulement","Un personnage principal"],a:0,e:"Le point de vue et l'ordre organisent la description."},
    {t:'qcm',q:"Quel groupe est un indicateur de lieu ?",o:["en face de","hier soir","avec tristesse"],a:0,e:"« En face de » situe dans l'espace."},
    {t:'vf',q:"« Il y a » et « être » sont des verbes précis pour décrire.",a:false,e:"Ce sont des verbes très vagues : on préfère des verbes plus expressifs."},
    {t:'qcm',q:"Quelle phrase fait appel à l'odorat ?",o:["Une odeur d'épices flottait sur le marché.","Le marché était grand.","Les vendeurs criaient."],a:0,e:"L'odeur est perçue par l'odorat."},
    {t:'fill',q:"Complète : Dans une description, on peut employer les cinq ___ .",a:["sens"],e:"La vue, l'ouïe, l'odorat, le toucher et le goût."},
    {t:'qcm',q:"Quel temps emploie-t-on souvent pour décrire un souvenir ?",o:["l'imparfait","le futur","l'impératif"],a:0,e:"L'imparfait est le temps de la description dans le passé."},
    {t:'vf',q:"Une description subjective exprime les impressions de celui qui décrit.",a:true,e:"Elle mêle description et sentiments."},
    {t:'qcm',q:"Quelle comparaison enrichit une description ?",o:["Le ciel était rouge comme une braise.","Le ciel était.","Il y avait un ciel."],a:0,e:"La comparaison rend l'image plus vivante."},
    {t:'fill',q:"Complète : « Le baobab se ___ au fond de la cour. » (verbe : se placer verticalement, en hauteur)",a:["dresse"],e:"Se dresser est plus précis qu'« il y a »."},
    {t:'fix',q:"Améliore la phrase : « Il y a un grand arbre dans la cour. »",o:["Un grand arbre se dresse au milieu de la cour.","Il y a un grand arbre dans la cour.","L'arbre est grand dans la cour."],a:0,e:"Un verbe précis rend la phrase plus expressive."}
  ]
},

"expr-argumenter":{
  objectif:"Défendre une opinion avec une thèse, des arguments illustrés d'exemples et des connecteurs logiques.",
  explication:[
    "**Argumenter**, c'est défendre une opinion pour **convaincre** (en s'adressant à la raison) ou **persuader** (en touchant les émotions). Quelques mots essentiels : la **thèse** est l'opinion que l'on défend ; un **argument** est une raison qui soutient la thèse ; un **exemple** est un fait précis qui illustre l'argument ; la **thèse adverse** est l'opinion contraire.",
    "Un texte argumentatif suit un plan : une **introduction** (on présente le sujet et la thèse), un **développement** (chaque argument occupe un paragraphe : argument + explication + exemple), une **conclusion** (on reprend la thèse et on ouvre sur une réflexion plus large).",
    "Les **connecteurs logiques** relient les idées : pour ordonner (d'abord, ensuite, enfin), ajouter (de plus, en outre), expliquer (car, en effet, parce que), illustrer (par exemple), opposer (mais, cependant), conclure (donc, ainsi, en conclusion). Pour répondre à une objection, on peut utiliser la **concession** : « **Certes**, …, **mais** … »."
  ],
  regle:"**Thèse → arguments → exemples → conclusion**, reliés par des **connecteurs logiques**. Un argument sans exemple reste faible : chaque argument doit être **illustré**.",
  tableaux:[{titre:"Le paragraphe argumentatif",entetes:["Étape","Rôle","Connecteur possible"],lignes:[["Argument","donner une raison","D'abord, en effet"],["Explication","justifier","car, parce que, c'est-à-dire"],["Exemple","illustrer","par exemple, ainsi"],["Conclusion","conclure le paragraphe","donc, c'est pourquoi"]]}],
  exemples:[
    {t:"**Thèse** : Les élèves devraient lire chaque jour.",n:"C'est l'opinion défendue."},
    {t:"**D'abord**, la lecture enrichit le vocabulaire.",n:"Un argument introduit par le connecteur « d'abord »."},
    {t:"**Par exemple**, un élève qui lit un roman par semaine découvre de nombreux mots nouveaux.",n:"Un exemple précis qui illustre l'argument."}
  ],
  retenir:["Thèse = l'opinion défendue.","Argument = une raison. Exemple = un fait précis qui l'illustre.","Les connecteurs logiques organisent le raisonnement.","Plan : introduction, développement, conclusion."],
  plus:"La **réfutation** consiste à répondre à la thèse adverse : on commence par la reconnaître (« Certes, certains pensent que le téléphone distrait… »), puis on la contredit (« … mais bien utilisé, il devient un outil de travail »). On peut s'appuyer sur plusieurs **types d'arguments** : logiques (raisonnement), d'expérience (faits vécus), d'autorité (citer un spécialiste). Attention aux **généralisations abusives** (« tout le monde », « toujours », « jamais »), qui affaiblissent un argument.",
  mini:{t:'qcm',q:"Comment appelle-t-on l'opinion défendue dans un texte argumentatif ?",o:["la thèse","l'exemple","la conclusion"],a:0,e:"La thèse est l'opinion que l'on cherche à faire admettre."},
  exercices:[
    {t:'match',q:"Associe chaque terme à sa définition.",pairs:[["thèse","l'opinion défendue"],["argument","une raison qui soutient la thèse"],["exemple","un fait précis qui illustre l'argument"],["thèse adverse","l'opinion contraire"]],e:"Ce sont les quatre notions de base de l'argumentation."},
    {t:'qcm',q:"Quel connecteur introduit un exemple ?",o:["Par exemple","Cependant","Donc"],a:0,e:"« Par exemple » sert à illustrer."},
    {t:'fill',q:"Complète : Certes, le téléphone est utile, ___ il distrait les élèves.",a:["mais"],e:"« Certes… mais » exprime la concession suivie d'une objection."},
    {t:'vf',q:"Un argument n'a pas besoin d'exemple.",a:false,e:"Un exemple précis rend l'argument plus convaincant."},
    {t:'qcm',q:"Quelle est la bonne structure d'un texte argumentatif ?",o:["Introduction, arguments, conclusion","Conclusion, arguments, introduction","Exemples seulement"],a:0,e:"On présente la thèse, on la défend, puis on conclut."}
  ],
  quiz:[
    {t:'qcm',q:"Que signifie « convaincre » ?",o:["Faire changer d'avis par des arguments raisonnés","Faire rire","Raconter une histoire"],a:0,e:"Convaincre s'adresse à la raison."},
    {t:'qcm',q:"Quel connecteur exprime la cause ?",o:["car","donc","mais"],a:0,e:"« Car » introduit une explication."},
    {t:'vf',q:"La thèse est l'opinion que l'on défend.",a:true,e:"C'est sa définition."},
    {t:'qcm',q:"Quel connecteur exprime la conséquence ?",o:["donc","car","parce que"],a:0,e:"« Donc » introduit le résultat d'un raisonnement."},

    {t:'fill',q:"Complète : « ___ , certains pensent que c'est difficile, mais je suis convaincu du contraire. » (concession)",a:["certes"],e:"« Certes » reconnaît l'objection avant de la contredire."},
    {t:'fix',q:"Améliore : « Il faut lire. Parce que c'est bien. »",o:["Il faut lire car la lecture enrichit le vocabulaire et développe l'imagination.","Il faut lire. Parce que c'est bien.","Il faut lire, tout le monde le sait."],a:0,e:"Un argument précis vaut mieux qu'une affirmation vague."}
  ]
},

"expr-commentaire":{
  objectif:"Comprendre la méthode du commentaire composé : lire, dégager des axes, rédiger en citant, analysant et interprétant.",
  explication:[
    "Le **commentaire composé** est une analyse organisée d'un texte littéraire (poème, extrait de roman ou de théâtre). Il ne s'agit **pas de résumer** ni de paraphraser le texte, mais d'expliquer **comment** il est écrit (les procédés) et **pourquoi** (l'effet produit, le sens).",
    "La méthode se fait en trois temps. **1. Lire et repérer** : sens général, thème, ton, qui parle, champs lexicaux, figures de style, temps verbaux, rythme. **2. Dégager deux ou trois axes** de lecture (des idées directrices formulées par des phrases) qui regroupent les observations. **3. Rédiger** l'introduction, le développement et la conclusion.",
    "L'**introduction** présente le texte (auteur, œuvre, date, genre), son thème, la **problématique** (la question à laquelle le commentaire répond) et annonce le plan. Le **développement** comporte deux ou trois parties : chacune expose un axe, appuyé sur des **citations courtes** analysées. La **conclusion** fait le bilan et peut ouvrir sur une autre œuvre ou un autre auteur."
  ],
  regle:"Pour chaque remarque : **je cite** (un extrait précis, entre guillemets), **j'analyse** (je nomme un procédé : figure, temps, lexique…) et **j'interprète** (je dis l'effet produit et le sens).",
  tableaux:[{titre:"Les outils de l'analyse",entetes:["Outil","Ce que l'on observe"],lignes:[["Lexique","champs lexicaux, mots connotés"],["Grammaire","temps verbaux, types de phrases, personnes"],["Figures de style","comparaisons, métaphores, antithèses…"],["Rythme et sons","rimes, rythme, sonorités (dans un poème)"],["Énonciation","qui parle, à qui, point de vue"]]}],
  exemples:[
    {t:"**Axe 1** : un paysage idéalisé. **Axe 2** : un poète qui exprime sa nostalgie.",n:"Un axe est une idée directrice, formulée par une phrase, qui regroupe plusieurs observations."},
    {t:"Comment l'auteur transforme-t-il un simple paysage en confidence personnelle ?",n:"C'est un exemple de problématique : une question à laquelle tout le commentaire va répondre."},
    {t:"Le champ lexical de la nature (« forêt », « rivière », « mousse ») crée une atmosphère paisible.",n:"Remarque construite selon la méthode : citation courte, procédé (champ lexical), effet (atmosphère paisible)."}
  ],
  retenir:["Commentaire composé = analyse organisée, pas un résumé.","Citer, analyser, interpréter.","Deux ou trois axes de lecture formulés par des phrases.","Introduction (avec problématique), développement, conclusion."],
  plus:"Évite le **plan linéaire** (suivre le texte ligne par ligne) : un commentaire composé regroupe les observations par idées. Évite aussi de séparer « le fond » puis « la forme » : chaque axe doit mêler le sens et les procédés. Écris au **présent de l'analyse** et emploie des verbes d'analyse variés : « l'auteur met en évidence », « ce procédé traduit », « cette image suggère ». Enfin, distingue **l'auteur** (personne réelle), le **narrateur** (celui qui raconte) et le **locuteur** (celui qui parle dans un poème).",
  mini:{t:'qcm',q:"Quelle formule résume la méthode du commentaire composé ?",o:["Citer, analyser, interpréter","Résumer, recopier, conclure","Raconter, juger, copier"],a:0,e:"On s'appuie sur une citation, on nomme un procédé et on explique son effet."},
  exercices:[
    {t:'qcm',q:"Qu'est-ce qu'une problématique ?",o:["La question à laquelle répond le commentaire","Le titre du texte","Un résumé du texte"],a:0,e:"La problématique guide toute l'analyse."},
    {t:'vf',q:"Un commentaire composé consiste à résumer le texte.",a:false,e:"Il analyse la façon dont le texte est écrit et l'effet qu'il produit."},
    {t:'match',q:"Associe chaque outil d'analyse à ce qu'on observe.",pairs:[["lexique","les champs lexicaux"],["grammaire","les temps verbaux"],["figures de style","les comparaisons et métaphores"],["rythme","les rimes et les sonorités"]],e:"Chaque outil éclaire une facette du texte."},
    {t:'qcm',q:"Où présente-t-on l'auteur et l'œuvre ?",o:["Dans l'introduction","Dans la conclusion","Dans chaque paragraphe"],a:0,e:"L'introduction situe le texte avant de poser la problématique."},
    {t:'fill',q:"Complète : Une remarque suit la méthode : citer, analyser, ___ .",a:["interpréter"],e:"On explique l'effet produit et le sens."}
  ],
  quiz:[
    {t:'qcm',q:"Combien d'axes de lecture prévoit-on généralement ?",o:["Deux ou trois","Un seul","Dix"],a:0,e:"Deux ou trois axes permettent une analyse équilibrée."},
    {t:'qcm',q:"Que contient l'introduction ?",o:["Présentation du texte, problématique, annonce du plan","Seulement une citation","Le bilan de l'analyse"],a:0,e:"L'introduction situe le texte et annonce la démarche."},
    {t:'vf',q:"On doit citer le texte pour appuyer chaque remarque.",a:true,e:"Une remarque sans citation reste une simple affirmation."},
    {t:'qcm',q:"Quel temps emploie-t-on pour l'analyse ?",o:["le présent","le passé simple","le futur antérieur"],a:0,e:"On écrit au présent de l'analyse."},
    {t:'qcm',q:"Quelle est une bonne formulation d'axe ?",o:["Un paysage qui apaise le poète","Le premier vers","Résumé du texte"],a:0,e:"Un axe est une idée directrice formulée par une phrase."},
    {t:'vf',q:"Il faut suivre le texte ligne par ligne dans un commentaire composé.",a:false,e:"Ce serait un plan linéaire, à éviter."},
    {t:'fill',q:"Complète : La conclusion fait le ___ de l'analyse.",a:["bilan"],e:"Elle résume l'essentiel et peut ouvrir sur une autre œuvre."},
    {t:'qcm',q:"Quel élément appartient à l'énonciation ?",o:["Qui parle et à qui","Le nombre de pages","La couleur du livre"],a:0,e:"L'énonciation étudie qui parle, à qui, dans quelle situation."},
    {t:'qcm',q:"Quelle phrase analyse un procédé ?",o:["Cette métaphore suggère la douceur du souvenir.","Le poète parle de son enfance.","Le texte est long."],a:0,e:"Elle nomme un procédé (métaphore) et explique son effet."},
    {t:'fix',q:"Améliore l'analyse : « Le poète dit qu'il est triste. »",o:["Le champ lexical de la nostalgie (« regret », « jadis ») exprime la tristesse du poète.","Le poète dit qu'il est triste.","Le poème est triste."],a:0,e:"On cite, on nomme un procédé et on interprète."}
  ]
},

"litt-portrait":{
  objectif:"Reconnaître un portrait littéraire, distinguer portrait physique et portrait moral, et comprendre l'effet recherché.",
  explication:[
    "Un **portrait** est la description d'un personnage. Le **portrait physique** décrit son apparence : taille, visage, cheveux, vêtements, démarche. Le **portrait moral** décrit son caractère : ses qualités, ses défauts, ses sentiments. Très souvent, les deux sont mêlés : l'apparence révèle le caractère.",
    "Pour construire un portrait, l'auteur emploie des **adjectifs**, des **comparaisons** et des **métaphores**, des **verbes d'action** qui montrent le personnage en train d'agir, des **expansions du nom** (« un vieil homme aux cheveux blancs »). Il utilise le **présent** ou l'**imparfait**.",
    "Un portrait a toujours un **effet** sur le lecteur : le rendre sympathique (vocabulaire **mélioratif**, qui valorise), antipathique (vocabulaire **péjoratif**, qui dévalorise), le faire rire (portrait **caricatural**, qui exagère certains traits) ou l'intriguer. Le regard du narrateur ou d'un autre personnage influence l'image que l'on se fait du personnage."
  ],
  regle:"Un portrait associe **portrait physique + portrait moral** et cherche à produire un **effet** (admiration, rire, crainte…). Repère le vocabulaire **mélioratif** (valorisant) ou **péjoratif** (dévalorisant).",
  tableaux:[{titre:"Portrait physique et portrait moral",entetes:["","Portrait physique","Portrait moral"],lignes:[["On décrit","le corps, le visage, les vêtements, la démarche","le caractère, les qualités, les défauts, les pensées"],["Outils","adjectifs, comparaisons, expansions du nom","adjectifs de caractère, verbes d'action, paroles"],["Exemple","Un grand vieillard aux cheveux blancs.","Il est généreux et toujours prêt à aider."]]}],
  exemples:[
    {t:"Un vieil homme, **grand et maigre**, vêtu d'un boubou usé.",n:"Portrait physique : la taille, la silhouette et le vêtement sont décrits."},
    {t:"Elle était **patiente et généreuse**, toujours prête à aider les voisins.",n:"Portrait moral : les adjectifs décrivent le caractère."},
    {t:"Ses yeux **brillaient comme des braises**.",n:"Comparaison qui exprime l'énergie ou la colère du personnage."}
  ],
  retenir:["Portrait physique : l'apparence. Portrait moral : le caractère.","Les deux sont souvent mêlés.","Vocabulaire mélioratif = valorise ; péjoratif = dévalorise.","Le portrait produit un effet sur le lecteur."],
  plus:"Le portrait peut être **direct** (le narrateur décrit le personnage) ou **indirect** (le personnage se révèle par ses actes et ses paroles). En littérature, on nomme parfois le portrait physique **prosopographie** et le portrait moral **éthopée**. Enfin, la **caricature** exagère certains traits physiques ou moraux pour faire rire ou pour critiquer : elle est fréquente dans les comédies et les fables.",
  mini:{t:'qcm',q:"« Il était généreux et courageux. » Cette phrase décrit…",o:["le caractère (portrait moral)","l'apparence (portrait physique)","un lieu"],a:0,e:"« Généreux » et « courageux » sont des qualités morales."},
  exercices:[
    {t:'qcm',q:"Quelle phrase contient un portrait physique ?",o:["Elle avait de longs cheveux noirs et un sourire éclatant.","Elle était honnête et sincère.","Elle habitait près de la rivière."],a:0,e:"Cheveux, sourire : ce sont des éléments d'apparence."},
    {t:'match',q:"Associe chaque phrase à ce qu'elle illustre.",pairs:[["Grand et mince, il portait un chapeau.","portrait physique"],["Il était toujours prêt à aider.","portrait moral"],["Sa voix résonnait comme un tambour.","comparaison"],["Le vieux avare cachait son argent.","vocabulaire péjoratif"]],e:"Physique = apparence ; moral = caractère ; comparaison = outil « comme » ; « avare » dévalorise."},
    {t:'vf',q:"Un portrait moral décrit l'apparence du personnage.",a:false,e:"Le portrait moral décrit le caractère, pas l'apparence."},
    {t:'fill',q:"Complète : un vocabulaire qui valorise le personnage est dit ___ (mélioratif ou péjoratif ?)",a:["mélioratif","méliorative"],e:"Mélioratif signifie qui améliore, qui valorise."},
    {t:'find',q:"Touche les adjectifs qui expriment un défaut, puis valide.",s:"Le marchand était avare et menteur",a:["avare","menteur"],e:"« Avare » et « menteur » décrivent des défauts moraux."}
  ],
  quiz:[
    {t:'qcm',q:"Qu'est-ce qu'un portrait littéraire ?",o:["La description d'un personnage","Un tableau de peinture","Un résumé de l'histoire"],a:0,e:"Un portrait décrit physiquement et moralement un personnage."},
    {t:'qcm',q:"Quelle phrase est un portrait moral ?",o:["Elle est douce et patiente.","Elle porte une robe bleue.","Elle a les yeux verts."],a:0,e:"« Douce » et « patiente » décrivent le caractère."},
    {t:'vf',q:"Un portrait peut mêler description physique et morale.",a:true,e:"L'apparence révèle souvent le caractère."},
    {t:'qcm',q:"Quel mot est péjoratif ?",o:["un vaurien","un ami","un héros"],a:0,e:"« Un vaurien » est un mot dévalorisant."},
    {t:'qcm',q:"Quel mot est mélioratif ?",o:["admirable","méprisable","détestable"],a:0,e:"« Admirable » valorise."},
    {t:'fill',q:"Complète : Le portrait qui exagère certains traits pour faire rire est une ___ .",a:["caricature"],e:"La caricature exagère pour faire rire ou critiquer."},
    {t:'vf',q:"Dans un portrait indirect, le personnage se révèle par ses actes et ses paroles.",a:true,e:"Le lecteur déduit son caractère de ce qu'il fait et dit."},
    {t:'qcm',q:"Quelle figure trouve-t-on dans « Ses yeux brillaient comme des braises » ?",o:["une comparaison","une antithèse","une litote"],a:0,e:"L'outil « comme » relie les yeux aux braises."},
    {t:'qcm',q:"Quel effet peut produire un portrait ?",o:["Rendre le personnage sympathique ou antipathique","Changer le titre","Raccourcir l'histoire"],a:0,e:"Le portrait oriente l'image que le lecteur se fait du personnage."},
    {t:'fill',q:"Complète : Le portrait qui décrit l'apparence est le portrait ___ .",a:["physique"],e:"Physique : tout ce qui se voit."}
  ]
},

"litt-poesie":{
  objectif:"Découvrir les éléments d'un poème (vers, strophes, rimes, rythme) et lire ses images et ses émotions.",
  explication:[
    "Un **poème** est un texte écrit en **vers**. Un **vers** est une ligne du poème ; plusieurs vers forment une **strophe** (l'équivalent d'un paragraphe). Une strophe de 2 vers est un **distique**, de 3 vers un **tercet**, de 4 vers un **quatrain**, de 5 un **quintil**, de 6 un **sizain**. Un **sonnet** est un poème de 14 vers : deux quatrains et deux tercets.",
    "Les vers sont souvent reliés par des **rimes** : des sons identiques à la fin des vers. On distingue les **rimes plates** (AABB), **croisées** (ABAB) et **embrassées** (ABBA). Le **rythme** dépend du nombre de syllabes : **octosyllabe** (8), **décasyllabe** (10), **alexandrin** (12). Quand un poème ne suit ni rimes ni mètre régulier, on parle de **vers libre**.",
    "Un poème exprime des **émotions** et des **images**. Le poète emploie des comparaisons, des métaphores, des jeux de sons (**allitération** : répétition de consonnes ; **assonance** : répétition de voyelles). Pour bien le lire : on le lit **à voix haute**, on repère le thème et l'émotion dominante, puis les procédés qui les font ressentir."
  ],
  regle:"Pour lire un poème : repérer **vers et strophes**, puis **rimes**, **rythme**, et enfin **images** et **émotion**. Une **rime** est un son identique à la fin de deux vers, pas seulement une même lettre finale.",
  tableaux:[{titre:"Les schémas de rimes",entetes:["Schéma","Nom","Exemple de fins de vers"],lignes:[["A A B B","rimes plates","jour, amour, nuit, bruit"],["A B A B","rimes croisées","jour, nuit, amour, bruit"],["A B B A","rimes embrassées","jour, nuit, bruit, amour"]]}],
  exemples:[
    {t:"Une strophe de quatre vers s'appelle un **quatrain**.",n:"Le mot vient du nombre quatre : 4 vers."},
    {t:"Un vers de douze syllabes s'appelle un **alexandrin**.",n:"C'est le vers le plus utilisé dans la poésie classique française."},
    {t:"« Jour » et « amour » se terminent par le même son : elles **riment**.",n:"La rime est un son identique à la fin de deux vers."}
  ],
  retenir:["Un poème est écrit en vers, regroupés en strophes.","Les rimes peuvent être plates, croisées ou embrassées.","Alexandrin : 12 syllabes. Octosyllabe : 8. Décasyllabe : 10.","Le poème exprime des émotions grâce à des images et à des jeux de sons."],
  plus:"Pour compter les syllabes, on applique la règle du **e muet** : un « e » final compte comme une syllabe devant une consonne (« la porte fermée » : la-por-te-fer-mée), mais pas devant une voyelle (il s'élide) ni à la fin du vers. Un **enjambement** se produit quand la phrase déborde d'un vers sur le suivant. Le poème peut aussi être **engagé** (il défend une cause) ou prendre la forme d'un **calligramme** (les mots dessinent un objet). En Afrique, la poésie s'appuie aussi sur l'oralité : les chants et les récits des griots.",
  mini:{t:'qcm',q:"Comment appelle-t-on un groupe de quatre vers ?",o:["un quatrain","un tercet","un distique"],a:0,e:"Quatrain : quatre vers."},
  exercices:[
    {t:'qcm',q:"Combien de syllabes compte un alexandrin ?",o:["12","8","10"],a:0,e:"Alexandrin : 12 syllabes."},
    {t:'match',q:"Associe chaque strophe au nombre de vers qu'elle compte.",pairs:[["distique","2 vers"],["tercet","3 vers"],["quatrain","4 vers"],["sizain","6 vers"]],e:"Le préfixe donne souvent le nombre : di-, ter-, quat-, six."},
    {t:'qcm',q:"Quel schéma correspond à des rimes croisées ?",o:["ABAB","AABB","ABBA"],a:0,e:"Les rimes A et B alternent."},
    {t:'vf',q:"Un poème ne comprend jamais de rimes.",a:false,e:"Beaucoup de poèmes riment ; les poèmes en vers libres n'ont pas de rimes régulières."},
    {t:'fill',q:"Complète : Un poème de 14 vers composé de deux quatrains et de deux tercets est un ___ .",a:["sonnet"],e:"C'est la définition du sonnet."}
  ],
  quiz:[
    {t:'qcm',q:"Comment appelle-t-on une ligne d'un poème ?",o:["un vers","une phrase","un paragraphe"],a:0,e:"Un vers est une ligne de poème."},
    {t:'qcm',q:"Comment appelle-t-on l'équivalent d'un paragraphe dans un poème ?",o:["une strophe","une rime","un titre"],a:0,e:"Une strophe regroupe plusieurs vers."},
    {t:'vf',q:"Deux mots riment quand ils se terminent par le même son.",a:true,e:"La rime est un son identique à la fin de deux vers."},
    {t:'qcm',q:"Combien de vers compte un tercet ?",o:["3","4","2"],a:0,e:"Ter- : trois."},
    {t:'qcm',q:"Quel est le schéma des rimes embrassées ?",o:["ABBA","ABAB","AABB"],a:0,e:"Les rimes B sont « embrassées » par les rimes A."},
    {t:'fill',q:"Complète : Un vers de 8 syllabes est un ___ .",a:["octosyllabe"],e:"Octo- signifie huit."},
    {t:'vf',q:"Le vers libre suit toujours des rimes régulières.",a:false,e:"Le vers libre ne suit ni rimes ni mètre réguliers."},
    {t:'qcm',q:"Comment appelle-t-on la répétition d'un même son consonne ?",o:["une allitération","une assonance","une rime"],a:0,e:"L'allitération répète des consonnes ; l'assonance répète des voyelles."},
    {t:'qcm',q:"Quel type de vers compte douze syllabes ?",o:["l'alexandrin","le décasyllabe","l'octosyllabe"],a:0,e:"Alexandrin = 12."},
    {t:'fill',q:"Complète : Pour bien lire un poème, on le lit à ___ ___ .",a:["voix haute"],e:"La lecture à voix haute fait ressentir le rythme et les sons."}
  ]
},

"litt-theatre":{
  objectif:"Reconnaître les éléments d'un texte de théâtre (répliques, didascalies, actes, scènes) et comprendre qu'il est écrit pour être joué.",
  explication:[
    "Le **théâtre** est un art qui se joue devant un public. Le **texte de théâtre** est écrit pour être **joué**, non seulement lu. Il est formé de deux éléments : les **répliques**, c'est-à-dire ce que disent les personnages (leur nom est écrit devant), et les **didascalies**, les indications de l'auteur pour les gestes, le ton, le décor, les entrées et les sorties. Les didascalies sont écrites en italique ou entre parenthèses.",
    "Une pièce est divisée en **actes** (grandes parties), eux-mêmes divisés en **scènes**. On change de scène chaque fois qu'un personnage **entre** ou **sort**. Les genres principaux sont la **tragédie** (personnages nobles, destin, mort), la **comédie** (elle fait rire et critique les défauts), le **drame** (mélange des tons) et la **farce** (comique simple et physique).",
    "Il existe plusieurs sortes de paroles. Le **dialogue** est un échange entre personnages. Le **monologue** est prononcé par un personnage seul. La **tirade** est une longue réplique. L'**aparté** est une parole que l'on dit « à part » : le public l'entend, mais les autres personnages sont censés ne pas l'entendre. Enfin la **stichomythie** est un échange de répliques très courtes et rapides."
  ],
  regle:"Un texte de théâtre = **répliques + didascalies**, découpé en **actes et scènes**. Il est écrit pour être **joué** : pense au ton, aux gestes, au décor.",
  tableaux:[{titre:"Le vocabulaire du théâtre",entetes:["Terme","Définition"],lignes:[["didascalie","indication de l'auteur (gestes, ton, décor)"],["réplique","ce que dit un personnage en une prise de parole"],["monologue","un personnage seul qui parle"],["tirade","longue réplique"],["aparté","parole que les autres personnages n'entendent pas"]]}],
  exemples:[
    {t:"KARIM (en colère). — Tu m'avais promis de revenir !",n:"« (en colère) » est une didascalie : elle indique le ton. La phrase qui suit est une réplique."},

/* Le Store écrit sur le téléphone (localStorage). Le Repo est la seule porte
   d'accès aux données : pour passer à un vrai serveur (Supabase, Firebase…),
   on ne remplace que le contenu du Repo, pas les écrans. */
const mem={};
const Store={
  get(k,d){try{const v=localStorage.getItem('fak:'+k);if(v!=null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d},
  set(k,v){mem[k]=v;try{localStorage.setItem('fak:'+k,JSON.stringify(v))}catch(e){}},
  del(k){delete mem[k];try{localStorage.removeItem('fak:'+k)}catch(e){}}
};
const emptyProgress=()=>({points:0,lessons:{},exos:{},quizzes:[],badges:{},days:{},bestStreak:0,last:null,recent:[]});
const enc=new TextEncoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const mkSalt=()=>{try{return b64(crypto.getRandomValues(new Uint8Array(16)))}catch(e){return Math.random().toString(36).slice(2)}};
/* Le mot de passe n'est jamais enregistré : seulement son empreinte (PBKDF2, 120 000 tours). */
async function hashPwd(pwd,salt){
  try{
    const key=await crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
    return 'p1:'+b64(bits);
  }catch(e){
    let h=5381;const s=salt+pwd;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
    return 'w0:'+h;
  }
}
function normContact(s){
  s=(s||'').trim();
  if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s))return{type:'email',v:s.toLowerCase()};
  const d=s.replace(/[\s.\-()]/g,'');
  if(/^\+?\d{8,15}$/.test(d))return{type:'tel',v:d};
  return null;
}
let fails={n:0,until:0};
const Repo={
  users:()=>Store.get('users',{}),
  session:()=>Store.get('session',null),
  current(){const id=this.session();if(!id)return null;return id==='guest'?Store.get('guest',null):(this.users()[id]||null)},
  save(u){if(u.id==='guest')Store.set('guest',u);else{const us=this.users();us[u.id]=u;Store.set('users',us)}},
  progress:id=>Object.assign(emptyProgress(),Store.get('progress:'+id,{})),
  saveProgress:(id,p)=>Store.set('progress:'+id,p),
  startGuest(){if(!Store.get('guest',null))Store.set('guest',{id:'guest',guest:true,prenom:'',nom:'',classe:null});Store.set('session','guest')},
  async register(f){
    const prenom=f.prenom.trim(),nom=f.nom.trim();
    if(prenom.length<2||nom.length<2)return{ok:false,error:"Écris ton prénom et ton nom (2 lettres minimum chacun)."};
    const c=normContact(f.contact);
    if(!c)return{ok:false,error:"Écris une adresse e-mail valide (awa@exemple.com) ou un numéro de téléphone (+22507000000)."};
    if((f.pwd||'').length<8)return{ok:false,error:"Le mot de passe doit contenir au moins 8 caractères."};
    if(!CL.includes(f.classe))return{ok:false,error:"Choisis ta classe dans la liste."};
    const us=this.users();
    if(Object.values(us).some(u=>u.contact===c.v))return{ok:false,error:"Un compte existe déjà avec cette adresse ou ce numéro. Touche « Se connecter »."};
    const id=uid(),salt=mkSalt(),hash=await hashPwd(f.pwd,salt);
    us[id]={id,prenom:prenom.slice(0,40),nom:nom.slice(0,40),contact:c.v,contactType:c.type,salt,hash,classe:f.classe,created:Date.now()};
    Store.set('users',us);
    if(this.session()==='guest'){Store.set('progress:'+id,Store.get('progress:guest',emptyProgress()));Store.del('guest');Store.del('progress:guest')}
    Store.set('session',id);
    return{ok:true};
  },
  async login(contact,pwd){
    if(Date.now()<fails.until)return{ok:false,error:"Trop d'essais. Attends "+Math.ceil((fails.until-Date.now())/1000)+" secondes puis réessaie."};
    const c=normContact(contact);
    const u=c&&Object.values(this.users()).find(x=>x.contact===c.v);
    const good=u&&(await hashPwd(pwd||'',u.salt))===u.hash;
    if(!good){fails.n++;if(fails.n>=5){fails={n:0,until:Date.now()+30000}}return{ok:false,error:"E-mail, téléphone ou mot de passe incorrect."}}
    fails={n:0,until:0};Store.set('session',u.id);return{ok:true};
  },
  logout(){Store.set('session',null)},
  remove(id){if(id==='guest'){Store.del('guest')}else{const us=this.users();delete us[id];Store.set('users',us)}Store.del('progress:'+id);Store.set('session',null)}
};

const day=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function streak(p){let n=0;const d=new Date();if(!p.days[day(d)])d.setDate(d.getDate()-1);while(p.days[day(d)]){n++;d.setDate(d.getDate()-1)}return n}
const bestQuiz=(p,id)=>p.quizzes.filter(q=>q.id===id).reduce((m,q)=>Math.max(m,q.score),-1);
const ms=(p,id)=>(p.lessons[id]?1:0)+(p.exos[id]?1:0)+(bestQuiz(p,id)>=APP.seuil?1:0);
function pctOf(p,cat){const av=availableLessons(cat);return av.length?Math.round(av.reduce((s,l)=>s+ms(p,l.id),0)/(3*av.length)*100):null}
function avgQuiz(p){return p.quizzes.length?p.quizzes.reduce((s,q)=>s+q.score/q.total*10,0)/p.quizzes.length:null}
function levelInfo(pts){let i=0;LEVELS.forEach((l,k)=>{if(pts>=l.min)i=k});const cur=LEVELS[i],nx=LEVELS[i+1];return{n:i+1,nom:cur.nom,next:nx?nx.min:null,pct:nx?Math.round((pts-cur.min)/(nx.min-cur.min)*100):100,left:nx?nx.min-pts:0}}
function catExpert(cat,p){let av=availableLessons(cat);const cl=S.user&&S.user.classe;if(cl){const own=av.filter(l=>l.classes.includes(cl));if(own.length)av=own}return av.length>0&&av.every(l=>p.lessons[l.id]&&bestQuiz(p,l.id)>=8)}
const BADGES=[
  {id:'first',e:'🏅',nom:'Première leçon',desc:'Terminer une leçon',test:p=>Object.keys(p.lessons).length>=1},
  {id:'streak5',e:'🔥',nom:"5 jours d'apprentissage",desc:"5 jours de suite d'activité",test:p=>(p.bestStreak||0)>=5},
  {id:'lessons10',e:'📚',nom:'10 leçons terminées',desc:'Terminer 10 leçons',test:p=>Object.keys(p.lessons).length>=10},
  {id:'quiz10',e:'🧠',nom:'10 quiz réussis',desc:'Réussir 10 quiz (6/10 minimum)',test:p=>p.quizzes.filter(q=>q.score/q.total*10>=APP.seuil).length>=10},
  {id:'gram',e:'🏆',nom:'Expert en grammaire',desc:'Terminer toutes les leçons de grammaire de ta classe avec 8/10 au quiz',test:p=>catExpert('grammaire',p)},
  {id:'perfect',e:'💯',nom:'Sans faute',desc:'Obtenir 10/10 à un quiz',test:p=>p.quizzes.some(q=>q.score===q.total)}
];
function bump(p){const d=day();p.days[d]=(p.days[d]||0)+1;p.bestStreak=Math.max(p.bestStreak||0,streak(p))}
function evalBadges(p){const got=[];BADGES.forEach(b=>{if(!p.badges[b.id]&&b.test(p)){p.badges[b.id]=Date.now();got.push(b)}});return got}
function commit(){Repo.saveProgress(S.user.id,S.prog)}
function recLesson(id){const p=S.prog;let gain=0;if(!p.lessons[id]){p.lessons[id]=Date.now();gain=20;bump(p)}p.points+=gain;const nb=evalBadges(p);commit();return{gain,nb}}
function recRun(id,mode,score,total){
  const p=S.prog;let gain=0;
  if(mode==='exos'){
    const prev=p.exos[id];gain=(prev?0:10)+Math.max(0,score-(prev?prev.best:0))*2;
    p.exos[id]={best:Math.max(prev?prev.best:0,score),total,tries:(prev?prev.tries:0)+1,count:(prev?prev.count:0)+total,ts:Date.now()};
  }else{
    const pb=bestQuiz(p,id);gain=(pb<0?10:0)+Math.max(0,score-Math.max(pb,0))*3;
    p.quizzes.push({id,score,total,ts:Date.now()});if(p.quizzes.length>200)p.quizzes.shift();
  }
  bump(p);p.points+=gain;const nb=evalBadges(p);commit();return{gain,nb};
}

/* ---------- Questions (utilisées par le petit exercice, les exercices et les quiz) ---------- */
function newQS(q){
  const s={q,done:false,ok:null,given:''};
  if(q.t==='qcm'||q.t==='fix'){s.opts=shuf(q.o.map((t,i)=>({t,ok:i===q.a})))}
  if(q.t==='find'){s.tokens=q.s.split(' ');s.sel=new Set()}
  if(q.t==='match'){s.left=q.pairs.map((p,i)=>({t:p[0],i}));s.right=shuf(q.pairs.map((p,i)=>({t:p[1],i})));s.map={};s.ls=null}
  return s;
}
function correctText(q){
  if(q.t==='qcm'||q.t==='fix')return q.o[q.a];
  if(q.t==='vf')return q.a?'Vrai':'Faux';
  if(q.t==='fill')return q.a.slice(0,3).join(' ou ');
  if(q.t==='find')return q.a.join(', ');
  return q.pairs.map(p=>p[0]+' = '+p[1]).join(' ; ');
}
const qLabel=q=>q.q.replace(/___/g,'…')+(q.s?' « '+q.s+' »':'');
function qHTML(s){
  const q=s.q,d=s.done;
  const blank=d&&q.t==='fill'?`<span class="blank ${s.ok?'ok':'bad'}">${esc(s.given)}</span>`:'<span class="blank">&nbsp;</span>';
  const qt=`<p class="qtext">${md(q.q).replace(/___/g,blank)}</p>`;
  let body='';
  if(q.t==='qcm'||q.t==='fix'){
    body=qt+'<div class="opts">'+s.opts.map((o,i)=>{let cls='opt';if(d){cls+=o.ok?' ok':(s.pick===i?' bad':' dim')}
      return `<button class="${cls}" data-a="qpick" data-i="${i}" ${d?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${md(o.t)}</span></button>`}).join('')+'</div>';
  }else if(q.t==='vf'){
    body=qt+'<div class="row2">'+[['true','Vrai'],['false','Faux']].map(([v,l])=>{let cls='opt center';if(d){cls+=((v==='true')===q.a)?' ok':(s.pick===v?' bad':' dim')}
      return `<button class="${cls}" data-a="qvf" data-v="${v}" ${d?'disabled':''}>${l}</button>`}).join('')+'</div>';
  }else if(q.t==='fill'){
    body=qt+(d?'':'<input id="fillin" class="input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Écris ta réponse" data-enter="qfill"><div class="stack"><button class="btn btn-primary" data-a="qfill">Valider</button></div>');
  }else if(q.t==='find'){
    const good=q.a.map(x=>x.toLowerCase());
    body=qt+'<div class="tokens">'+s.tokens.map((t,i)=>{const on=s.sel.has(i);let cls='tok'+(on?' on':'');
      if(d){const g=good.includes(cw(t));cls='tok'+(g&&on?' ok':(g?' miss':(on?' bad':'')))}
      return `<button class="${cls}" data-a="qtok" data-i="${i}" ${d?'disabled':''}>${esc(t)}</button>`}).join('')+'</div>'
      +(d?'':`<button class="btn btn-primary" data-a="qfind" ${s.sel.size?'':'disabled'}>Valider</button>`);
  }else if(q.t==='match'){
    body=qt+(d?'':'<p class="hint">Touche un mot à gauche, puis sa réponse à droite.</p>')+'<div class="match"><div>'+s.left.map(l=>{
      const j=s.map[l.i];let cls='mt';if(j!==undefined)cls+=' lk'+(l.i%4);if(s.ls===l.i)cls+=' sel';if(d)cls=' mt '+(j===l.i?'ok':'bad');
      return `<button class="${cls.trim()}" data-a="qml" data-i="${l.i}" ${d?'disabled':''}>${esc(l.t)}${d?(j===l.i?' ✓':' ✗'):''}</button>`}).join('')+'</div><div>'
      +s.right.map(r=>{const owner=Object.keys(s.map).find(k=>s.map[k]===r.i);const cls='mt'+(owner!==undefined&&!d?' lk'+(+owner%4):'');
      return `<button class="${cls}" data-a="qmr" data-i="${r.i}" ${d?'disabled':''}>${esc(r.t)}</button>`}).join('')+'</div></div>'
      +(d?'':`<button class="btn btn-primary" data-a="qmv" ${Object.keys(s.map).length===q.pairs.length?'':'disabled'}>Valider</button>`);
  }
  return `<span class="qtype">${TYPES[q.t]}</span>${body}${d?fbHTML(s):''}`;
}
function fbHTML(s){
  const q=s.q,ok=s.ok;
  const showTag=S.screen==='lesson';
  return `<div id="fb" class="fb ${ok?'ok':'bad'}" role="status">${showTag?'<p class="fb-tag">Correction</p>':''}<p class="fb-h">${ok?'✅ Bonne réponse':'❌ Mauvaise réponse'}</p>${ok?'':`<p>Bonne réponse : <b>${esc(correctText(q))}</b></p>`}<p>${md(q.e||'')}</p></div>`;
}
function paintQ(){
  const h=$('#qhost');if(h)h.innerHTML=qHTML(S.cur);
  if(S.screen==='lesson'){const l=$('#lend');if(l)l.innerHTML=lendHTML(S.params.id)}
  if(S.screen==='run'){const f=$('#runfoot');if(f)f.innerHTML=runFoot()}
  const fb=$('#fb');if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function answer(ok,given){
  const s=S.cur;if(!s||s.done)return;
  s.done=true;s.ok=ok;s.given=given;
  if(S.screen==='run')S.run.results.push({q:s.q,ok,given,correct:correctText(s.q)});
  paintQ();
}

  const mix=list.length?`<button class="row" style="--cat:#8A4FB8;border-color:var(--ink)" data-a="run" data-id="mix" data-mode="quiz"><span class="cico">🎲</span><span class="grow"><b>Quiz mixte</b><small>10 questions tirées de toutes les leçons</small></span><span class="chev">›</span></button>`:'';
  return `${brandBar()}<div class="screen" style="padding-top:8px"><h1 class="t1">Exercices</h1><p class="lead" style="margin-bottom:14px">Entraîne-toi, puis teste-toi.</p>
  <div class="seg" role="group" aria-label="Type d'activité"><button data-a="exTab" data-v="exos" aria-pressed="${tabv==='exos'}">Exercices</button><button data-a="exTab" data-v="quiz" aria-pressed="${tabv==='quiz'}">Quiz</button></div>
  <div style="margin-top:18px">${tabv==='quiz'?mix:''}${list.map(l=>card(l,tabv)).join('')}</div></div>`;
}

/* ---------- Série de questions ---------- */
const runFoot=()=>S.cur&&S.cur.done?`<button class="btn btn-primary" data-a="nextQ">${S.run.i+1>=S.run.list.length?'Voir mon résultat':'Question suivante'}</button>`:'';
function vRun(){
  const r=S.run;if(!r||!S.cur)return vHome();
  const n=r.list.length,title=r.id==='mix'?'Quiz mixte':META(r.id).titre;
  return `<div class="runtop"><button class="iconbtn" data-a="quitRun" aria-label="Quitter">✕</button><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${r.i}"><i style="width:${r.i/n*100}%"></i></div><span class="cnt">${r.i+1}/${n}</span></div>
  <div class="screen" style="padding-top:14px;padding-bottom:20px"><p class="small muted" style="margin-bottom:12px">${r.mode==='quiz'?'Quiz':'Exercices'} : ${esc(title)}</p><div id="qhost">${qHTML(S.cur)}</div></div>
  <div id="runfoot" class="runfoot">${runFoot()}</div>`;
}
function startRun(id,mode){
  let list;
  if(mode==='exos')list=CONTENT[id].exercices.slice();
  else if(id==='mix')list=shuf(availableLessons().flatMap(l=>CONTENT[l.id].quiz)).slice(0,APP.tailleQuiz);
  else list=CONTENT[id].quiz.slice();
  S.run={id,mode,list,i:0,results:[]};S.cur=newQS(list[0]);S.curFor='run:'+id+mode;
  go('run',{});
}
function finishRun(){
  const r=S.run,score=r.results.filter(x=>x.ok).length,total=r.list.length;
  const rec=recRun(r.id,r.mode,score,total);
  S.result={id:r.id,mode:r.mode,score,total,results:r.results,gain:rec.gain,nb:rec.nb};
  S.run=null;S.cur=null;S.curFor='';
  go('result',{},{replace:true});
}

/* ---------- Résultat ---------- */
function vResult(){
  const r=S.result;if(!r)return vHome();
  const pct=r.score/r.total;
  const msg=pct>=.9?'Excellent travail !':pct>=.7?'Très bien, continue comme ça !':pct>=.5?"C'est bien parti, encore un effort !":'Courage : relis la leçon et réessaie.';
  const good=r.results.filter(x=>x.ok),bad=r.results.filter(x=>!x.ok);
  const nb=r.nb.map(b=>`<div class="newbadge"><span class="em">${b.e}</span><div><b>Nouveau badge : ${esc(b.nom)}</b><br><span class="small muted">${esc(b.desc)}</span></div></div>`).join('');
  const actions=r.mode==='quiz'
    ?`<button class="btn btn-primary" data-a="tab" data-to="progress">Continuer</button><button class="btn" data-a="run" data-id="${r.id}" data-mode="quiz">Recommencer</button>`
    :`<button class="btn btn-primary" data-a="run" data-id="${r.id}" data-mode="quiz">Passer au quiz</button><button class="btn" data-a="run" data-id="${r.id}" data-mode="exos">Recommencer</button><button class="btn" data-a="tab" data-to="exos">Retour aux exercices</button>`;
  return `<div class="screen" style="padding-top:26px">
  <p class="hand" style="color:var(--bad)">${msg}</p>
  <h1 class="score-big">Ton résultat : <span>${r.score}/${r.total}</span></h1>
  <p class="muted">${r.gain>0?`Tu gagnes <b>${r.gain} points</b>.`:'Aucun point en plus cette fois : améliore ton meilleur score pour en gagner.'}</p>
  ${nb}
  <div class="stack" style="margin:18px 0">${actions}</div>
  ${bad.length?`<details open><summary>❌ Réponses incorrectes (${bad.length})</summary>${bad.map(x=>`<div class="rev bad"><p>${md(qLabel(x.q))}</p><p>Ta réponse : <b>${esc(x.given||'aucune')}</b></p><p>Bonne réponse : <b>${esc(x.correct)}</b></p><p class="small muted">${md(x.q.e||'')}</p></div>`).join('')}</details>`:''}
  ${good.length?`<details ${bad.length?'':'open'}><summary>✅ Réponses correctes (${good.length})</summary>${good.map(x=>`<div class="rev ok"><p>${md(qLabel(x.q))}</p><p>Réponse : <b>${esc(x.correct)}</b></p></div>`).join('')}</details>`:''}
  </div>`;
}

/* ---------- Progression ---------- */
function vProgress(){
  const p=S.prog,all=availableLessons(),lvl=levelInfo(p.points);
  const pa=all.length?Math.round(all.reduce((s,l)=>s+ms(p,l.id),0)/(3*all.length)*100):0;
  const done=Object.keys(p.lessons).length,exo=Object.values(p.exos).reduce((s,e)=>s+(e.count||e.total),0),avg=avgQuiz(p);
  const cats=CATS.map(c=>{const v=pctOf(p,c.id);return `<div class="cat-row" style="--cat:${c.c}"><span aria-hidden="true">${c.e}</span><div><div class="small" style="font-weight:700;margin-bottom:3px">${c.nom}</div><div class="pbar"><i style="width:${v||0}%"></i></div></div><span class="pc">${v===null?'—':v+' %'}</span></div>`}).join('');
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push([day(d),'DLMMJVS'[d.getDay()]])}
  const mx=Math.max(1,...days.map(d=>p.days[d[0]]||0));
  const bars=days.map(d=>{const n=p.days[d[0]]||0;return `<div><i class="${n?'':'zero'}" style="height:${n?Math.max(10,n/mx*80):4}px" title="${n}"></i><span>${d[1]}</span></div>`}).join('');
  const badges=BADGES.map(b=>{const on=!!p.badges[b.id];return `<div class="badge ${on?'':'lock'}"><div class="em">${b.e}</div><b>${esc(b.nom)}</b><small>${on?'Obtenu':esc(b.desc)}</small></div>`}).join('');
  const st=streak(p);
  return `${brandBar()}<div class="screen" style="padding-top:8px"><h1 class="t1">Ma progression</h1>
  <div class="card" style="margin-top:16px"><div class="ringbox">${ring(pa)}<div><b>Progression générale</b><p class="small muted" style="margin:6px 0 0">Une leçon compte pour trois étapes : la lire, faire les exercices, réussir le quiz (${APP.seuil}/10).</p></div></div></div>
  <div class="stats"><div class="stat"><b>${done}/${all.length}</b><span>Cours terminés</span></div><div class="stat"><b>${exo}</b><span>Exercices réalisés</span></div><div class="stat"><b>${p.quizzes.length}</b><span>Quiz réalisés</span></div><div class="stat"><b>${avg===null?'—':fmt(avg)+'/10'}</b><span>Moyenne aux quiz</span></div></div>
  <h2 class="t2">Par matière</h2>${cats}
  <h2 class="t2">Niveau ${lvl.n} : ${lvl.nom}</h2><div class="card"><div style="display:flex;justify-content:space-between"><b>${p.points} points</b><span class="small muted">${lvl.next?`encore ${lvl.left} pour le niveau suivant`:'niveau maximum'}</span></div><div class="pbar hl" style="margin-top:10px"><i style="width:${lvl.pct}%"></i></div></div>
  <h2 class="t2">Cette semaine${st>0?' : 🔥 '+st+' jour'+(st>1?'s':'')+' de suite':''}</h2><div class="card"><div class="bars" aria-label="Activités des 7 derniers jours">${bars}</div></div>
  <h2 class="t2">Mes badges</h2><div class="badges">${badges}</div></div>`;
}

/* ---------- Profil ---------- */
function vProfile(){

  const pa=all.length?Math.round(all.reduce((s,l)=>s+ms(p,l.id),0)/(3*all.length)*100):0;

  <div class="pid" style="margin-top:16px"><div class="avatar" aria-hidden="true">${esc(ini)}</div><div><b style="font:800 22px var(--f-head);background:none">${u?esc(dname(u)):'Élève invité'}</b><br><span class="tag">${u&&u.classe?esc(u.classe):'Classe non choisie'}</span>${u&&!u.guest?`<p class="small muted" style="margin:6px 0 0">${esc(u.contact)}</p>`:''}</div></div>
  <div class="stats"><div class="stat"><b>${pa} %</b><span>Progression</span></div><div class="stat"><b>${Object.keys(p.lessons).length}</b><span>Cours terminés</span></div><div class="stat"><b>${p.quizzes.length}</b><span>Quiz réalisés</span></div><div class="stat"><b>${avg===null?'—':fmt(avg)+'/10'}</b><span>Score moyen</span></div></div>
  <div class="card" style="margin-top:12px"><b>Niveau ${lvl.n} : ${lvl.nom}</b> <span class="muted small">(${p.points} points)</span></div>

    ${u&&u.guest?`<button class="btn btn-primary" data-a="go" data-to="register">Créer un compte</button><button class="btn" data-a="go" data-to="login">Se connecter</button>`:''}

  <h2 class="t2">Apparence</h2><div class="seg" role="group" aria-label="Apparence">${[['auto','Automatique'],['light','Clair'],['dark','Sombre']].map(([v,l])=>`<button data-a="theme" data-v="${v}" aria-pressed="${th===v}">${l}</button>`).join('')}</div>
  <h2 class="t2">Bientôt dans l'appli</h2>
  <div class="row soon" style="--cat:#1E3FAE"><span class="cico">🤖</span><span class="grow"><b>Assistant Français</b><small>Pose tes questions, explications adaptées à ta classe</small></span><span class="tag">Bientôt</span></div>
  <div class="row soon" style="--cat:#A67C00"><span class="cico">🧑‍🏫</span><span class="grow"><b>Espace professeur</b><small>Leçons, annonces et résultats de la classe</small></span><span class="tag">Bientôt</span></div>
  <h2 class="t2">Mes données</h2><p class="note" style="margin-top:0">Tes informations et ta progression sont enregistrées sur cet appareil uniquement.</p>

  <p class="note" style="text-align:center;margin-top:24px">${APP.nom}<br>Version ${APP.version}</p></div>`;

/* ---------- Affichage ---------- */
const VIEWS={home:vHome,class:vClass,register:vRegister,login:vLogin,courses:vCourses,lesson:vLesson,exos:vExos,run:vRun,result:vResult,progress:vProgress,profile:vProfile};
function render(keep){
  const y=window.scrollY,s=S.screen;
  const view=(VIEWS[s]||vHome)(S.params||{});
  const noNav=NO_NAV.has(S.screen)||(S.screen==='class'&&S.params.onboarding);
  $('#app').innerHTML=view+(noNav?'':navHTML());
  if(keep)window.scrollTo(0,y);
  if(S.screen==='run'&&S.cur&&S.cur.q.t==='fill'&&!S.cur.done){const i=$('#fillin');if(i)setTimeout(()=>i.focus({preventScroll:true}),60)}
}

/* ============================ 7. ACTIONS ============================ */
const A={
  async install(){
    if(!PWA.prompt)return;
    const ev=PWA.prompt;PWA.prompt=null;
    ev.prompt();
    try{const c=await ev.userChoice;if(c&&c.outcome==='accepted')toast('Installation en cours…')}catch(e){}
    render(true);
  },
  go(el){const d=el.dataset;go(d.to,{from:d.from},{replace:d.replace==='1'})},
  back(){back()},
  tab(el){tab(el.dataset.to)},
  ovclose(el,e){if(e.target===el)closeModal()},
  start(){ensureUser();if(!S.user.classe)go('class',{onboarding:true});else tab('courses')},
  setClass(el){
    ensureUser();S.user.classe=el.dataset.c;Repo.save(S.user);
    toast('Classe enregistrée : '+el.dataset.c);
    if(S.params.onboarding)tab('courses');else back();
  },
  toggleCat(el){const id=el.dataset.id;S.ui.open[id]=!S.ui.open[id];render(true)},
  exTab(el){S.ui.exTab=el.dataset.v;render(true)},
  lesson(el){ensureUser();openLesson(el.dataset.id)},
  nextLesson(){
    const id=S.params.id,r=recLesson(id);toastGain(r);
    const av=availableLessons(),i=av.findIndex(l=>l.id===id),nx=av[i+1];
    if(nx){openLesson(nx.id,true)}else{toast('Bravo ! Tu as terminé tous les cours disponibles.');tab('courses')}
  },
  run(el){ensureUser();startRun(el.dataset.id,el.dataset.mode)},
  quitRun(){modal('<h2>Quitter cette série ?</h2><p>Tes réponses de cette série ne seront pas enregistrées.</p><div class="stack"><button class="btn btn-primary" data-a="closeModal">Continuer la série</button><button class="btn" data-a="confirmQuit">Quitter</button></div>')},
  closeModal(){closeModal()},
  confirmQuit(){closeModal();S.run=null;S.cur=null;S.curFor='';back()},
  nextQ(){const r=S.run;r.i++;if(r.i>=r.list.length)return finishRun();S.cur=newQS(r.list[r.i]);render();window.scrollTo(0,0)},
  /* --- réponses --- */
  qpick(el){const s=S.cur;if(s.done)return;const i=+el.dataset.i;s.pick=i;answer(s.opts[i].ok,s.opts[i].t)},
  qvf(el){const s=S.cur;if(s.done)return;const v=el.dataset.v;s.pick=v;answer((v==='true')===s.q.a,v==='true'?'Vrai':'Faux')},
  qfill(){const s=S.cur,inp=$('#fillin');if(!s||s.done||!inp)return;const v=inp.value;if(!v.trim()){toast('Écris ta réponse avant de valider.');return}answer(s.q.a.map(nz).includes(nz(v)),v.trim())},
  qtok(el){const s=S.cur;if(s.done)return;const i=+el.dataset.i;s.sel.has(i)?s.sel.delete(i):s.sel.add(i);const h=$('#qhost');h.innerHTML=qHTML(s)},
  qfind(){
    const s=S.cur;if(s.done||!s.sel.size)return;
    const chosen=[...s.sel].sort((a,b)=>a-b).map(i=>cw(s.tokens[i]));
    const target=s.q.a.map(x=>x.toLowerCase());
    const ok=chosen.length===target.length&&target.every(t=>chosen.includes(t));
    answer(ok,[...s.sel].sort((a,b)=>a-b).map(i=>s.tokens[i].replace(/[.,;:!?]/g,'')).join(', '));
  },
  qml(el){const s=S.cur;if(s.done)return;s.ls=+el.dataset.i;$('#qhost').innerHTML=qHTML(s)},
  qmr(el){const s=S.cur;if(s.done||s.ls===null)return;const j=+el.dataset.i;Object.keys(s.map).forEach(k=>{if(s.map[k]===j)delete s.map[k]});s.map[s.ls]=j;s.ls=null;$('#qhost').innerHTML=qHTML(s)},
  qmv(){
    const s=S.cur;if(s.done)return;
    const ok=s.q.pairs.every((p,i)=>s.map[i]===i);
    answer(ok,s.q.pairs.map((p,i)=>p[0]+' = '+(s.q.pairs[s.map[i]]?s.q.pairs[s.map[i]][1]:'?')).join(' ; '));
  },
  /* --- comptes --- */
  togglePw(el){const i=$('#'+el.dataset.t);const show=i.type==='password';i.type=show?'text':'password';el.textContent=show?'Masquer':'Afficher'},
  async doRegister(el){
    const err=m=>{const e=$('#formerr');if(e)e.textContent=m};err('');
    const v=id=>($('#'+id)||{}).value||'';
    const btn=$('[data-a="doRegister"]');if(btn)btn.disabled=true;
    const r=await Repo.register({prenom:v('f-prenom'),nom:v('f-nom'),contact:v('f-contact'),pwd:v('f-pwd'),classe:v('f-classe')});
    if(btn)btn.disabled=false;
    if(!r.ok){err(r.error);return}
    syncUser();toast('Bienvenue '+S.user.prenom+' !');tab('home');
  },
  async doLogin(){
    const err=m=>{const e=$('#formerr');if(e)e.textContent=m};err('');
    const btn=$('[data-a="doLogin"]');if(btn)btn.disabled=true;
    const r=await Repo.login(($('#l-contact')||{}).value,($('#l-pwd')||{}).value);
    if(btn)btn.disabled=false;
    if(!r.ok){err(r.error);return}
    syncUser();toast('Content de te revoir '+(S.user.prenom||'')+' !');tab('home');
  },
  logout(){Repo.logout();syncUser();toast('Tu es déconnecté.');tab('home')},
  editProfile(){
    const u=S.user;
    modal(`<h2>Modifier mes informations</h2>${u.guest?'':`<label class="field"><span>Prénom</span><input id="e-prenom" class="input" value="${esc(u.prenom)}" maxlength="40"></label><label class="field"><span>Nom</span><input id="e-nom" class="input" value="${esc(u.nom)}" maxlength="40"></label>`}<label class="field"><span>Classe</span><select id="e-classe" class="input">${classOptions(u.classe)}</select></label><p id="e-err" class="err" role="alert"></p><div class="stack"><button class="btn btn-primary" data-a="saveProfile">Enregistrer</button><button class="btn" data-a="closeModal">Annuler</button></div>`);
  },
  saveProfile(){
    const u=S.user,v=id=>(($('#'+id)||{}).value||'').trim();
    if(!u.guest){
      if(v('e-prenom').length<2||v('e-nom').length<2){$('#e-err').textContent='Le prénom et le nom doivent avoir au moins 2 lettres.';return}
      u.prenom=v('e-prenom').slice(0,40);u.nom=v('e-nom').slice(0,40);
    }
    if(CL.includes(v('e-classe')))u.classe=v('e-classe');
    Repo.save(u);closeModal();toast('Informations enregistrées.');render(true);
  },
  theme(el){Store.set('theme',el.dataset.v);applyTheme(el.dataset.v);render(true)},
  askReset(){modal('<h2>Effacer ma progression ?</h2><p>Tes cours terminés, points, quiz et badges seront remis à zéro. Cette action est définitive.</p><div class="stack"><button class="btn btn-danger" data-a="doReset">Effacer ma progression</button><button class="btn" data-a="closeModal">Annuler</button></div>')},
  doReset(){ensureUser();S.prog=emptyProgress();commit();closeModal();toast('Progression effacée.');render(true)},
  askDelete(){modal('<h2>Supprimer mes données ?</h2><p>Ton compte, ta progression et tes informations seront effacés de cet appareil. Cette action est définitive.</p><div class="stack"><button class="btn btn-danger" data-a="doDelete">Tout supprimer</button><button class="btn" data-a="closeModal">Annuler</button></div>')},
  doDelete(){Repo.remove(S.user.id);closeModal();syncUser();toast('Tes données ont été supprimées.');tab('home')}
};
function openLesson(id,replace){
  const p=S.prog;p.last=id;p.recent=[id].concat((p.recent||[]).filter(x=>x!==id)).slice(0,6);commit();
  go('lesson',{id},replace?{replace:true}:{});
}
function toastGain(r){
  const parts=[];if(r.gain)parts.push('+'+r.gain+' points');r.nb.forEach(b=>parts.push(b.e+' '+b.nom));
  if(parts.length)toast(parts.join(' · '));
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e)}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const n=e.target&&e.target.dataset&&e.target.dataset.enter;
  if(n&&A[n]){e.preventDefault();A[n]()}
});

/* ============================ 8. INSTALLATION & HORS-LIGNE ============================ */
/* L'appli peut s'installer sur l'écran d'accueil et fonctionner sans internet.
   Le fichier sw.js (à côté de index.html) met l'appli en mémoire au premier
   passage. Il ne s'active que sur une adresse https:// (ou localhost). */
const PWA={prompt:null,ready:false,
  standalone:(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true,
  ios:/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream};
const pwaRefresh=()=>{if(S.screen==='profile')render(true)};
function installCard(){
  const off=PWA.ready?'<p class="small muted" style="margin:8px 0 0">✓ Disponible sans internet</p>':'';
  let h='';
  if(PWA.standalone)h=`<div class="card"><b>✅ Appli installée sur ton téléphone</b>${off}</div>`;
  else if(PWA.prompt)h=`<div class="card"><b>📲 Installe l'appli</b><p class="small muted" style="margin:6px 0 12px">Ouvre-la depuis ton écran d'accueil, comme une vraie appli, même sans internet.</p><button class="btn btn-primary" data-a="install">Installer l'application</button>${off}</div>`;
  else if(PWA.ios)h=`<div class="card"><b>📲 Ajoute l'appli à ton écran d'accueil</b><p class="small muted" style="margin:6px 0 0">Dans Safari, touche le bouton Partager, puis « Sur l'écran d'accueil ».</p>${off}</div>`;
  else if(PWA.ready)h=`<div class="card"><b>✓ Disponible sans internet</b><p class="small muted" style="margin:6px 0 0">Tu peux aussi l'installer depuis le menu de ton navigateur.</p></div>`;
  return h?`<div style="margin-top:18px">${h}</div>`:'';
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();PWA.prompt=e;pwaRefresh()});
window.addEventListener('appinstalled',()=>{PWA.prompt=null;PWA.standalone=true;pwaRefresh();toast('Appli installée. Bon apprentissage !')});
window.addEventListener('offline',()=>toast("Pas de connexion : l'appli fonctionne quand même."));
window.addEventListener('online',()=>toast('Connexion rétablie.'));
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)toast("Mise à jour installée. Ferme puis rouvre l'appli pour en profiter.")});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{PWA.ready=true;pwaRefresh()}).catch(()=>{});
  });
}

/* ============================ DÉMARRAGE ============================ */
applyTheme(Store.get('theme','auto'));
syncUser();
render();
</script>
</body>
</html>
