"gram-formes":{
  objectif:"Distinguer forme affirmative et forme négative, transformer une phrase, et découvrir la forme passive.",
  explication:[
    "En plus de son type, une phrase a une **forme**. À la **forme affirmative**, on dit qu'une chose est ou se fait : « Karim vient. » À la **forme négative**, on dit qu'une chose n'est pas ou ne se fait pas : « Karim **ne** vient **pas**. »",
    "La négation est formée de **deux mots** qui entourent le verbe : **ne** (ou **n'**) devant le verbe, puis **pas, jamais, rien, plus, personne** après lui : « Je **ne** mange **jamais** de piment. » Aux temps composés, ils entourent l'auxiliaire : « Il **n'**a **pas** mangé. » Après une négation, « du, de la, des » deviennent « **de** » : « Je mange du poisson » → « Je **ne** mange **pas de** poisson ».",
    "Une phrase peut aussi être **active** ou **passive**. À la forme **active**, le sujet fait l'action : « Le chat mange la souris. » À la forme **passive**, le sujet subit l'action : « La souris est mangée par le chat. »"
  ],
  regle:"La négation **encadre le verbe** : **ne (n') + verbe + pas / jamais / rien / plus / personne**. À l'oral, on oublie souvent « ne », mais **à l'écrit il est obligatoire**. La forme passive se construit avec **être + participe passé**.",
  tableaux:[{titre:"Les mots de la négation",entetes:["Négation","Sens","Exemple"],lignes:[["ne … pas","simple négation","Il ne pleut pas."],["ne … jamais","à aucun moment","Je ne mens jamais."],["ne … plus","ce n'est plus le cas","Il ne joue plus."],["ne … rien","aucune chose","Elle ne dit rien."],["ne … personne","aucune personne","Je ne vois personne."]]}],
  exemples:[
    {t:"Awa **ne** chante **pas** ce soir.",n:"Forme négative : « ne » et « pas » entourent le verbe « chante »."},
    {t:"Il **n'**a **jamais** menti.",n:"« Ne » devient « n' » devant une voyelle et la négation entoure l'auxiliaire « a »."},
    {t:"La porte est fermée par le gardien.",n:"Forme passive : le sujet « la porte » subit l'action. Le verbe est « est fermée » (être + participe passé)."}
  ],
  retenir:["Forme affirmative : on affirme. Forme négative : on nie.","La négation encadre le verbe : ne … pas, jamais, rien, plus, personne.","Après une négation, du / de la / des deviennent « de ».","Passive : être + participe passé + par…"],
  plus:"Dans une phrase passive, le **participe passé s'accorde avec le sujet** : « Les mangues sont cueillies par les enfants. » Le complément introduit par « par » s'appelle le **complément d'agent** : c'est lui qui fait l'action. On utilise la forme passive quand on veut mettre en avant ce qui subit l'action, ou quand on ne connaît pas (ou ne veut pas dire) qui la fait : « Le vase a été cassé. »",
  mini:{t:'qcm',q:"Quelle phrase est à la forme négative ?",o:["Awa ne pleure jamais.","Awa pleure souvent.","Awa a pleuré hier."],a:0,e:"« Ne … jamais » entoure le verbe : c'est une négation."},
  exercices:[
    {t:'qcm',q:"Quelle phrase est à la forme négative ?",o:["Il n'a rien dit.","Il a tout dit.","Il a beaucoup dit."],a:0,e:"« N' … rien » entoure l'auxiliaire : c'est une négation."},
    {t:'fill',q:"Complète la négation : Il ___ mange pas de viande.",a:["ne"],e:"« Ne » se place devant le verbe, « pas » après lui."},
    {t:'fix',q:"Passe à la forme négative : « Je mange du poisson. »",o:["Je ne mange pas de poisson.","Je mange ne pas du poisson.","Je ne pas mange de poisson."],a:0,e:"« Ne » et « pas » entourent le verbe, et « du » devient « de »."},
    {t:'match',q:"Associe chaque phrase affirmative à sa forme négative.",pairs:[["Il pleut.","Il ne pleut pas."],["Nous sortons souvent.","Nous ne sortons jamais."],["Elle voit quelqu'un.","Elle ne voit personne."],["Tu dis quelque chose.","Tu ne dis rien."]],e:"« Quelqu'un » devient « ne … personne » et « quelque chose » devient « ne … rien »."},
    {t:'vf',q:"À l'écrit, on peut supprimer le « ne » de la négation.",a:false,e:"À l'écrit, la négation est toujours formée de deux mots : ne + pas (ou jamais, rien…)."}
  ],
  quiz:[
    {t:'qcm',q:"Quels mots forment une négation ?",o:["ne … pas","le … la","très … trop"],a:0,e:"La négation est formée de deux mots qui entourent le verbe."},
    {t:'qcm',q:"Laquelle de ces phrases est à la forme négative ?",o:["Nous n'irons plus au marché.","Nous irons au marché.","Irons-nous au marché ?"],a:0,e:"« N' … plus » entoure le verbe : c'est une négation."},
    {t:'fill',q:"Complète la négation : Il n'a ___ mangé.",a:["pas"],e:"« Ne … pas » est la négation la plus courante."},
    {t:'vf',q:"« Je ne vois rien » est une phrase à la forme négative.",a:true,e:"« Ne … rien » est une négation."},
    {t:'fill',q:"Complète : Nous ne voyons ___ dans la cour. (aucune personne)",a:["personne"],e:"« Ne … personne » exprime l'absence de toute personne."},
    {t:'qcm',q:"« La souris est mangée par le chat. » Cette phrase est à la forme…",o:["passive","active","négative"],a:0,e:"Le sujet « la souris » subit l'action : c'est la forme passive."},
    {t:'qcm',q:"Quelle phrase est à la forme active ?",o:["Le chien poursuit le voleur.","Le voleur est poursuivi par le chien.","Le voleur n'est pas poursuivi."],a:0,e:"Le sujet « le chien » fait l'action : c'est la forme active."},
    {t:'vf',q:"Dans une phrase passive, le sujet fait l'action.",a:false,e:"Dans une phrase passive, le sujet subit l'action."},
    {t:'fix',q:"Corrige la phrase : « Elle ne a pas mangé. »",o:["Elle n'a pas mangé.","Elle ne a pas mangé.","Elle n'a pas mangée."],a:0,e:"« Ne » s'élide devant une voyelle : il devient « n' »."},
    {t:'fill',q:"Complète : Il mange du pain. → Il ne mange pas ___ pain.",a:["de"],e:"Après une négation, « du » devient « de »."}
  ]
},

"gram-complexe":{
  objectif:"Distinguer phrase simple et phrase complexe, et reconnaître juxtaposition, coordination et subordination.",
  explication:[
    "Une **proposition** est un groupe de mots organisé autour d'**un verbe conjugué**. Une **phrase simple** ne contient qu'une seule proposition : « Le vent souffle. » Une **phrase complexe** en contient **plusieurs** : « Le vent souffle et les feuilles tombent. » Il y a autant de propositions que de verbes conjugués.",
    "Les propositions peuvent être reliées de trois façons. Par **juxtaposition** : elles sont séparées par un signe de ponctuation (virgule, point-virgule, deux-points). Par **coordination** : un mot de coordination les relie (mais, ou, et, donc, or, ni, car). Par **subordination** : l'une dépend de l'autre grâce à un mot subordonnant (que, quand, parce que, si, qui…).",
    "Dans la subordination, la proposition dont dépend l'autre est la **proposition principale**. La proposition qui dépend d'elle est la **subordonnée** : elle ne peut pas être employée seule. Dans « Je reste à la maison **parce qu'il pleut** », « parce qu'il pleut » est la subordonnée."
  ],
  regle:"Phrase complexe = **plusieurs verbes conjugués** = plusieurs propositions. Elles sont **juxtaposées** (ponctuation), **coordonnées** (mais, ou, et, donc, or, ni, car) ou **subordonnées** (que, qui, quand, parce que, si…).",
  tableaux:[{titre:"Trois façons de relier les propositions",entetes:["Lien","Marque","Exemple"],lignes:[["Juxtaposition","ponctuation","Il chante, elle danse."],["Coordination","mais, ou, et, donc, or, ni, car","Il chante et elle danse."],["Subordination","que, quand, si, parce que, qui…","Je sais qu'il chante."]]}],
  exemples:[
    {t:"Le vent souffle, les feuilles tombent.",n:"Deux propositions juxtaposées : elles sont séparées par une virgule."},
    {t:"Awa révise **car** elle a un examen demain.",n:"Deux propositions coordonnées par le mot « car »."},
    {t:"Je pense **que tu as raison**.",n:"« Je pense » est la principale ; « que tu as raison » est la subordonnée."}
  ],
  retenir:["Une proposition = un verbe conjugué.","Phrase simple : une proposition. Phrase complexe : plusieurs.","Juxtaposition, coordination, subordination.","La subordonnée dépend de la principale."],
  plus:"Pour compter les propositions, on ne compte que les **verbes conjugués**. Un verbe à l'infinitif ou un participe ne forme pas une proposition à lui seul : dans « Je veux partir », il n'y a qu'une seule proposition. Une phrase peut contenir plusieurs subordonnées, ou une subordonnée qui elle-même en contient une autre.",
  mini:{t:'qcm',q:"Combien y a-t-il de propositions dans « Il sort et il ferme la porte » ?",o:["2","1","3"],a:0,e:"Il y a deux verbes conjugués : sort et ferme. Il y a donc deux propositions."},
  exercices:[
    {t:'qcm',q:"Quelle phrase est une phrase complexe ?",o:["Il rit parce qu'il est heureux.","Le chat dort.","Ma sœur lit un livre."],a:0,e:"Elle contient deux verbes conjugués : rit et est."},
    {t:'fill',q:"Complète avec le mot de coordination qui exprime l'opposition : Il est fatigué ___ il continue à courir.",a:["mais"],e:"« Mais » exprime une opposition entre les deux propositions."},
    {t:'find',q:"Touche tous les verbes conjugués, puis valide.",s:"Je pense que tu viens",a:["pense","viens"],e:"Il y a deux verbes conjugués, donc deux propositions."},
    {t:'match',q:"Associe chaque phrase à son type.",pairs:[["Il fait beau, nous sortons.","juxtaposition"],["Il fait beau donc nous sortons.","coordination"],["Nous sortons parce qu'il fait beau.","subordination"],["Nous sortons.","phrase simple"]],e:"Ponctuation seule : juxtaposition. Mot de coordination : coordination. Mot subordonnant : subordination. Un seul verbe : phrase simple."},
    {t:'vf',q:"Dans une phrase complexe, il y a un seul verbe conjugué.",a:false,e:"Une phrase complexe contient plusieurs verbes conjugués, donc plusieurs propositions."}
  ],
  quiz:[
    {t:'qcm',q:"Qu'est-ce qu'une proposition ?",o:["Un groupe de mots organisé autour d'un verbe conjugué","Un mot invariable","Un signe de ponctuation"],a:0,e:"Une proposition se construit autour d'un verbe conjugué."},
    {t:'qcm',q:"Combien de propositions dans « Il pleut, je reste à la maison » ?",o:["2","1","3"],a:0,e:"Deux verbes conjugués : pleut et reste."},
    {t:'vf',q:"« Mais », « ou », « et », « donc » sont des mots de coordination.",a:true,e:"Avec « or », « ni » et « car », ce sont les sept conjonctions de coordination."},
    {t:'qcm',q:"Dans « Il pleut, je reste à la maison », comment les propositions sont-elles reliées ?",o:["par juxtaposition","par coordination","par subordination"],a:0,e:"Elles sont séparées par une virgule, sans mot de liaison."},
    {t:'fill',q:"Complète avec un mot de coordination de cause : Awa révise ___ elle a un examen.",a:["car"],e:"« Car » introduit la cause : Awa révise, la raison est qu'elle a un examen."},
    {t:'qcm',q:"Dans « Je crois que tu as raison », quelle est la proposition principale ?",o:["Je crois","que tu as raison","tu as raison"],a:0,e:"« Je crois » est la principale ; « que tu as raison » dépend d'elle."},
    {t:'vf',q:"Une proposition subordonnée peut s'employer seule.",a:false,e:"La subordonnée dépend de la principale : elle ne peut pas être employée seule."},
    {t:'qcm',q:"Quel mot est un subordonnant ?",o:["parce que","mais","donc"],a:0,e:"« Parce que » introduit une subordonnée. « Mais » et « donc » sont des mots de coordination."},
    {t:'fill',q:"Complète avec un mot de coordination de conséquence : Il pleut, ___ je reste à la maison.",a:["donc"],e:"« Donc » introduit la conséquence."},
    {t:'qcm',q:"Combien de propositions dans « Je veux partir » ?",o:["1","2","3"],a:0,e:"Seul « veux » est conjugué : « partir » est à l'infinitif."}
  ]
},

"gram-subordonnee":{
  objectif:"Identifier les trois grands types de propositions subordonnées : relative, complétive et circonstancielle.",
  explication:[
    "Une proposition **subordonnée** dépend d'une proposition principale et est introduite par un **mot subordonnant**. On distingue trois grands types selon le mot qui l'introduit et selon sa fonction.",
    "La subordonnée **relative** est introduite par un **pronom relatif** (qui, que, dont, où, lequel…). Elle complète un nom, appelé **antécédent** : « L'élève **qui parle** est mon cousin. » La subordonnée **complétive** est introduite par **que** (ou « si » dans l'interrogation indirecte) et joue le plus souvent le rôle de COD : « Je crois **que tu as raison**. »",
    "La subordonnée **circonstancielle** est introduite par une **conjonction de subordination** (quand, parce que, si, bien que, pour que…). Elle joue le rôle de complément circonstanciel : temps, cause, but, condition, concession… « Je sors **quand il pleut**. » On peut la **déplacer** ou la **supprimer** sans que la phrase perde son sens : c'est ce qui la distingue de la complétive."
  ],
  regle:"**Relative** : introduite par un pronom relatif, complète un nom (antécédent). **Complétive** : introduite par « que », complète le verbe (souvent COD), on ne peut pas la supprimer. **Circonstancielle** : introduite par une conjonction, exprime temps, cause, but, condition…, on peut la déplacer ou la supprimer.",
  tableaux:[{titre:"Trois subordonnées",entetes:["Type","Introduite par","Fonction"],lignes:[["Relative","qui, que, dont, où","complète un nom (antécédent)"],["Complétive","que, si","complète le verbe (souvent COD)"],["Circonstancielle","quand, parce que, si, bien que, pour que…","complément circonstanciel"]]}],
  exemples:[
    {t:"Le livre **que j'ai emprunté** est passionnant.",n:"Subordonnée relative introduite par « que » : elle complète l'antécédent « livre »."},
    {t:"Nous espérons **que tu réussiras**.",n:"Subordonnée complétive introduite par « que » : elle est COD du verbe « espérons »."},
    {t:"Elle a réussi **parce qu'elle a beaucoup travaillé**.",n:"Subordonnée circonstancielle de cause : elle explique pourquoi elle a réussi."}
  ],
  retenir:["Relative : pronom relatif, complète un nom.","Complétive : « que », complète le verbe, non supprimable.","Circonstancielle : conjonction, déplaçable et supprimable.","Le mot introducteur permet d'identifier le type de subordonnée."],
  plus:"Le **mode du verbe** dépend de la conjonction. Après « quand, parce que, si, puisque », on emploie l'**indicatif** ; après « bien que, pour que, avant que, afin que », on emploie le **subjonctif** : « Bien que tu **sois** fatigué, tu viens. » Le sens de la circonstancielle dépend de la conjonction : **quand** (temps), **parce que** (cause), **pour que** (but), **si** (condition), **bien que** (concession, c'est-à-dire une opposition surmontée).",
  mini:{t:'qcm',q:"Dans « Je sais que tu viens », « que tu viens » est une subordonnée…",o:["complétive","relative","circonstancielle"],a:0,e:"Introduite par « que », elle est COD du verbe « sais » et ne peut pas être supprimée."},
  exercices:[
    {t:'qcm',q:"Dans « L'élève qui parle est mon cousin », « qui parle » est une subordonnée…",o:["relative","complétive","circonstancielle"],a:0,e:"Introduite par le pronom relatif « qui », elle complète le nom « élève »."},
    {t:'qcm',q:"Quel est le sens de « pour que » ?",o:["le but","la cause","le temps"],a:0,e:"« Pour que » introduit le but : Il travaille pour que sa famille soit fière."},
    {t:'vf',q:"On peut supprimer une subordonnée complétive COD sans changer le sens de la phrase.",a:false,e:"La complétive COD est essentielle au verbe : « Je crois… » sans complément n'a pas de sens complet."},
    {t:'find',q:"Touche le mot qui introduit la subordonnée circonstancielle, puis valide.",s:"Nous sortirons quand la pluie aura cessé",a:["quand"],e:"« Quand » est la conjonction de subordination qui exprime le temps."},
    {t:'match',q:"Associe chaque conjonction à son sens.",pairs:[["quand","temps"],["parce que","cause"],["si","condition"],["bien que","concession"]],e:"« Quand » indique le moment, « parce que » la cause, « si » la condition, « bien que » une opposition surmontée."}
  ],
  quiz:[
    {t:'qcm',q:"Par quel mot une subordonnée relative est-elle introduite ?",o:["un pronom relatif","une conjonction de coordination","une préposition"],a:0,e:"Qui, que, dont, où, lequel… sont des pronoms relatifs."},
    {t:'qcm',q:"Dans « Le chat que j'ai recueilli dort », quel est l'antécédent de « que » ?",o:["chat","j'ai","dort"],a:0,e:"« Que » remplace « le chat » : c'est l'antécédent."},
    {t:'vf',q:"Une subordonnée complétive est introduite par « que ».",a:true,e:"C'est la marque la plus courante de la complétive."},
    {t:'qcm',q:"« Bien qu'il pleuve, nous sortons. » Qu'exprime la subordonnée ?",o:["une concession","une cause","un but"],a:0,e:"« Bien que » exprime une opposition surmontée : il pleut, mais nous sortons quand même."},
    {t:'fill',q:"Complète avec la conjonction de cause (deux mots) : Il est absent ___ sa mère est malade.",a:["parce que"],e:"« Parce que » indique la cause de l'absence."},
    {t:'qcm',q:"Quelle proposition est circonstancielle ?",o:["Nous rentrons quand la nuit tombe.","L'enfant qui rit est mon frère.","Je pense que tu as raison."],a:0,e:"« Quand la nuit tombe » indique le temps et peut être déplacé."},
    {t:'vf',q:"« Pour que » est suivi du subjonctif.",a:true,e:"Après « pour que » on emploie le subjonctif : pour que tu viennes."},
    {t:'qcm',q:"Quel mode suit « bien que » ?",o:["le subjonctif","l'indicatif","l'impératif"],a:0,e:"Bien que + subjonctif : bien qu'il soit fatigué."},
    {t:'fill',q:"Complète : Si tu travailles, tu ___ (réussir, futur).",a:["réussiras"],e:"Après « si » + présent, on emploie le futur dans la principale."},
    {t:'qcm',q:"Dans « La ville où je suis né est belle », « où je suis né » est une subordonnée…",o:["relative","complétive","circonstancielle"],a:0,e:"Introduite par le pronom relatif « où », elle complète le nom « ville »."}
  ]
},

"conj-imparfait":{
  objectif:"Reconnaître et conjuguer l'imparfait, et savoir l'employer pour décrire et pour raconter des habitudes du passé.",
  explication:[
    "L'**imparfait de l'indicatif** est un temps du **passé**. On l'emploie pour **décrire** un décor ou une situation (« Il faisait nuit »), pour raconter une **habitude** (« Autrefois, mon grand-père cultivait des ignames ») ou une action qui **dure** dans le passé.",
    "Pour le former, on part de la **1re personne du pluriel du présent** (nous chantons, nous finissons) et on retire **-ons** : ce qui reste est le **radical** (chant-, finiss-). On ajoute ensuite les terminaisons : **-ais, -ais, -ait, -ions, -iez, -aient**. La seule exception est le verbe **être**, dont le radical est « ét- » (j'étais).",
    "L'imparfait sert souvent de **décor** à une action ponctuelle : « Il **pleuvait** quand nous sommes sortis. » L'imparfait dit ce qui durait ; l'autre temps dit ce qui est arrivé à ce moment-là."
  ],
  regle:"**Radical du « nous » du présent + -ais, -ais, -ait, -ions, -iez, -aient.** Exception : être → j'**ét**ais.",
  tableaux:[{titre:"L'imparfait de quatre verbes",entetes:["","chanter","finir","être","avoir"],lignes:[["je","chantais","finissais","étais","avais"],["tu","chantais","finissais","étais","avais"],["il / elle","chantait","finissait","était","avait"],["nous","chantions","finissions","étions","avions"],["vous","chantiez","finissiez","étiez","aviez"],["ils / elles","chantaient","finissaient","étaient","avaient"]]}],
  exemples:[
    {t:"Autrefois, mon grand-père **cultivait** des ignames.",n:"Habitude dans le passé : imparfait de « cultiver »."},
    {t:"Il **faisait** nuit et le vent **soufflait**.",n:"Description d'un décor dans le passé : les deux verbes sont à l'imparfait."},
    {t:"Nous **étions** contents de revoir nos amis.",n:"Imparfait du verbe être : radical « ét- » + -ions."}
  ],
  retenir:["L'imparfait est un temps du passé : description, habitude, durée.","Radical du « nous » du présent + -ais, -ais, -ait, -ions, -iez, -aient.","Les terminaisons sont les mêmes pour tous les verbes.","Être : j'étais, tu étais, il était…"],
  plus:"Quelques verbes demandent de l'attention. Les verbes en **-cer** prennent une **cédille** devant a : je commen**ç**ais (mais nous commencions). Les verbes en **-ger** gardent un **e** devant a : je man**ge**ais (mais nous mangions). Les verbes en **-ier** ont un double i à la 1re et à la 2e personne du pluriel : nous étudi**ions**, vous étudi**iez**.",
  mini:{t:'qcm',q:"Quelle est la forme de « chanter » à l'imparfait avec « nous » ?",o:["chantions","chantons","chantâmes"],a:0,e:"Radical « chant- » + terminaison -ions : nous chantions."},
  exercices:[
    {t:'fill',q:"Conjugue à l'imparfait : Autrefois, je ___ (jouer) dans la cour.",a:["jouais"],e:"Radical « jou- » + -ais : je jouais."},
    {t:'qcm',q:"Quelle phrase est à l'imparfait ?",o:["Il mangeait du riz.","Il mange du riz.","Il mangera du riz."],a:0,e:"« Mangeait » est l'imparfait de « manger » à la 3e personne du singulier."},
    {t:'fix',q:"Corrige la phrase : « Hier, ils étais contents. »",o:["Hier, ils étaient contents.","Hier, ils était contents.","Hier, ils étiez contents."],a:0,e:"Avec « ils », l'imparfait se termine par -aient : ils étaient."},
    {t:'match',q:"Associe chaque pronom à sa terminaison à l'imparfait.",pairs:[["je","-ais"],["il","-ait"],["nous","-ions"],["ils","-aient"]],e:"Les terminaisons de l'imparfait sont : -ais, -ais, -ait, -ions, -iez, -aient."},
    {t:'vf',q:"À l'imparfait, les terminaisons de « je » et de « tu » sont identiques.",a:true,e:"Elles se terminent toutes les deux par -ais."}
  ],
  quiz:[
    {t:'qcm',q:"À quoi sert l'imparfait ?",o:["À décrire et à dire des habitudes du passé","À parler de l'avenir","À donner un ordre"],a:0,e:"L'imparfait est un temps du passé qui décrit et exprime la durée ou l'habitude."},
    {t:'fill',q:"Conjugue à l'imparfait : Tu ___ (finir) tes devoirs chaque soir.",a:["finissais"],e:"Radical « finiss- » (nous finissons) + -ais."},
    {t:'qcm',q:"Quelle est la terminaison de « ils » à l'imparfait ?",o:["-aient","-ent","-ont"],a:0,e:"Ils chantaient, ils finissaient, ils étaient."},
    {t:'fill',q:"Conjugue à l'imparfait : Nous ___ (avoir) faim.",a:["avions"],e:"Radical « av- » + -ions : nous avions."},
    {t:'vf',q:"L'imparfait s'emploie pour décrire un décor dans le passé.",a:true,e:"« Il faisait nuit, le vent soufflait » : c'est un emploi typique de l'imparfait."},
    {t:'qcm',q:"Quelle forme est correcte ?",o:["vous étiez","vous étez","vous était"],a:0,e:"À l'imparfait, « vous » se termine par -iez : vous étiez."},
    {t:'fill',q:"Conjugue à l'imparfait : Elle ___ (manger) du poisson.",a:["mangeait"],e:"Les verbes en -ger gardent un e devant a : mangeait."},
    {t:'qcm',q:"Quand j'étais petit, je ___ au village. (habiter)",o:["habitais","habitai","habitait"],a:0,e:"Avec « je », l'imparfait se termine par -ais."},
    {t:'vf',q:"Le radical de l'imparfait se trouve à la 1re personne du pluriel du présent.",a:true,e:"On retire -ons de « nous chantons » pour obtenir le radical « chant- »."},
    {t:'fix',q:"Corrige la phrase : « Autrefois, les enfants jouait dehors. »",o:["Autrefois, les enfants jouaient dehors.","Autrefois, les enfants jouait dehors.","Autrefois, les enfants jouaits dehors."],a:0,e:"Le sujet est « les enfants » (3e personne du pluriel) : jouaient."}
  ]
},

"conj-pc":{
  objectif:"Former le passé composé avec avoir ou être, et accorder correctement le participe passé.",
  explication:[
    "Le **passé composé** est un temps du passé qui exprime une action **terminée**. On l'emploie beaucoup à l'oral et à l'écrit : « Hier, j'**ai mangé** du riz. » Il est **composé** de deux mots : un **auxiliaire** (avoir ou être, au présent) suivi d'un **participe passé**.",
    "Le participe passé se forme ainsi : verbes du 1er groupe → **-é** (chanter → chanté) ; verbes du 2e groupe → **-i** (finir → fini) ; verbes du 3e groupe → forme variable (prendre → pris, faire → fait, voir → vu, venir → venu).",
    "La plupart des verbes se conjuguent avec **avoir**. Quelques verbes se conjuguent avec **être** : aller, venir, arriver, partir, entrer, sortir, monter, descendre, naître, mourir, tomber, rester, ainsi que **tous les verbes pronominaux** (elle s'est levée). Avec **être**, le participe passé **s'accorde avec le sujet** ; avec **avoir**, il ne s'accorde pas avec le sujet."
  ],
  regle:"**Passé composé = auxiliaire (avoir ou être au présent) + participe passé.** Avec **être**, le participe s'accorde avec le sujet. Avec **avoir**, il ne s'accorde pas avec le sujet.",
  tableaux:[{titre:"Deux verbes au passé composé",entetes:["","avec avoir (manger)","avec être (partir)"],lignes:[["je","j'ai mangé","je suis parti(e)"],["tu","tu as mangé","tu es parti(e)"],["il / elle","il a mangé","il est parti / elle est partie"],["nous","nous avons mangé","nous sommes parti(e)s"],["vous","vous avez mangé","vous êtes parti(e)(s)"],["ils / elles","ils ont mangé","ils sont partis / elles sont parties"]]}],
  exemples:[
    {t:"Hier, Karim **a mangé** du riz.",n:"Auxiliaire « avoir » + participe passé « mangé » : le participe ne s'accorde pas avec le sujet."},
    {t:"Awa **est arrivée** en retard.",n:"Auxiliaire « être » : le participe s'accorde avec le sujet Awa (féminin singulier), d'où le -e."},
    {t:"Les élèves **sont partis**.",n:"Auxiliaire « être » : le participe s'accorde au masculin pluriel avec « les élèves »."}
  ],
  retenir:["Passé composé = avoir ou être au présent + participe passé.","Participe passé : -é (1er groupe), -i (2e groupe), variable (3e groupe).","Avec être, le participe s'accorde avec le sujet.","Avec avoir, il ne s'accorde pas avec le sujet."],
  plus:"Avec l'auxiliaire **avoir**, le participe passé s'accorde pourtant avec le **COD placé avant le verbe** : « Les mangues que j'ai **cueillies** étaient mûres » (le COD « que » représente « les mangues »). Les verbes **pronominaux** se conjuguent toujours avec **être** : « Elle s'est levée. » Enfin, certains verbes (monter, descendre, sortir, rentrer) se conjuguent avec **avoir** quand ils ont un COD : « Elle a sorti le cahier », mais « Elle est sortie ».",
  mini:{t:'qcm',q:"Quel est l'auxiliaire dans « Elle est partie » ?",o:["être","avoir","aller"],a:0,e:"« Est » est le verbe être au présent : c'est l'auxiliaire."},
  exercices:[
    {t:'fill',q:"Complète avec l'auxiliaire : Hier, j'___ mangé du riz.",a:["ai"],e:"Avec « je », l'auxiliaire avoir se conjugue : j'ai."},
    {t:'qcm',q:"Quel est le participe passé du verbe « finir » ?",o:["fini","finit","finé"],a:0,e:"Les verbes du 2e groupe forment leur participe passé en -i."},
    {t:'fix',q:"Corrige la phrase : « Elle est parti en retard. »",o:["Elle est partie en retard.","Elle a parti en retard.","Elle est partis en retard."],a:0,e:"Avec « être », le participe passé s'accorde avec le sujet « elle » : féminin singulier."},
    {t:'match',q:"Associe chaque verbe à son participe passé.",pairs:[["chanter","chanté"],["finir","fini"],["prendre","pris"],["faire","fait"]],e:"1er groupe : -é ; 2e groupe : -i ; « prendre » et « faire » sont irréguliers."},
    {t:'vf',q:"Avec l'auxiliaire avoir, le participe passé s'accorde avec le sujet.",a:false,e:"Avec « avoir », le participe ne s'accorde pas avec le sujet."}
  ],
  quiz:[
    {t:'qcm',q:"De quoi le passé composé est-il formé ?",o:["Un auxiliaire et un participe passé","Un radical et une terminaison","Un infinitif et un pronom"],a:0,e:"Passé composé = avoir ou être au présent + participe passé."},
    {t:'qcm',q:"Quel est le participe passé de « manger » ?",o:["mangé","mangeais","mangeant"],a:0,e:"Les verbes du 1er groupe forment leur participe passé en -é."},
    {t:'fill',q:"Complète avec l'auxiliaire : Tu ___ fini tes devoirs.",a:["as"],e:"Avec « tu », l'auxiliaire avoir se conjugue : tu as."},
    {t:'vf',q:"« Je suis allé » est au passé composé.",a:true,e:"Auxiliaire être au présent + participe passé « allé »."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Elle est tombée.","Elle est tombé.","Elle a tombée."],a:0,e:"Avec « être », le participe s'accorde avec le sujet féminin : tombée."},
    {t:'fill',q:"Accorde le participe : Fatou et Awa sont ___ (arriver) hier.",a:["arrivées"],e:"Le sujet est féminin pluriel : arrivées."},
    {t:'fill',q:"Complète avec le participe passé : Nous avons ___ (finir) le travail.",a:["fini"],e:"Le participe passé de « finir » est « fini »."},
    {t:'qcm',q:"Quel auxiliaire emploie-t-on avec le verbe « aller » ?",o:["être","avoir","les deux"],a:0,e:"On dit « je suis allé » et non « j'ai allé »."},
    {t:'vf',q:"« Ils ont partis » est une phrase correcte.",a:false,e:"« Partir » se conjugue avec être : « ils sont partis »."},
    {t:'fix',q:"Corrige la phrase : « Hier, les enfants a joué dehors. »",o:["Hier, les enfants ont joué dehors.","Hier, les enfants sont joué dehors.","Hier, les enfants ont jouent dehors."],a:0,e:"Le sujet « les enfants » est au pluriel : l'auxiliaire s'écrit « ont »."}
  ]
},

"conj-futur":{
  objectif:"Conjuguer le futur simple et l'employer pour parler de ce qui arrivera plus tard.",
  explication:[
    "Le **futur simple** exprime une action qui se passera **plus tard**, après le moment où l'on parle : « Demain, j'**irai** au marché. » Il sert aussi à faire une promesse (« Je te **rendrai** ton livre ») ou à donner un ordre poli.",
    "Pour le former, on prend l'**infinitif** du verbe et on ajoute les terminaisons **-ai, -as, -a, -ons, -ez, -ont** : chanter → je chanter**ai**, finir → je finir**ai**. Pour les verbes en **-re**, on retire le e final : prendre → je prendr**ai**. Ces terminaisons sont celles du verbe **avoir** au présent.",
    "Certains verbes ont un **radical irrégulier**, qu'il faut apprendre : être → **ser-**, avoir → **aur-**, aller → **ir-**, faire → **fer-**, venir → **viendr-**, pouvoir → **pourr-**, voir → **verr-**, vouloir → **voudr-**. Mais les terminaisons restent toujours les mêmes."
  ],
  regle:"**Futur simple = infinitif (ou radical irrégulier) + -ai, -as, -a, -ons, -ez, -ont.** On entend et on écrit toujours un **r** juste avant la terminaison.",
  tableaux:[{titre:"Le futur simple de quatre verbes",entetes:["","chanter","finir","être","avoir"],lignes:[["je","chanterai","finirai","serai","aurai"],["tu","chanteras","finiras","seras","auras"],["il / elle","chantera","finira","sera","aura"],["nous","chanterons","finirons","serons","aurons"],["vous","chanterez","finirez","serez","aurez"],["ils / elles","chanteront","finiront","seront","auront"]]}],
  exemples:[
    {t:"Demain, nous **partirons** à la campagne.",n:"Action à venir : futur simple de « partir »."},
    {t:"Tu **seras** un bon médecin.",n:"Radical irrégulier « ser- » du verbe être."},
    {t:"Elle **prendra** le bus de sept heures.",n:"Verbe en -re : on retire le e de « prendre » avant la terminaison."}
  ],
  retenir:["Le futur exprime ce qui se passera plus tard.","Infinitif + -ai, -as, -a, -ons, -ez, -ont.","Il y a toujours un r avant la terminaison.","Apprendre les radicaux irréguliers : ser-, aur-, ir-, fer-, viendr-, pourr-…"],
  plus:"Ne confonds pas le **futur** (« je chanter**ai** ») et le **conditionnel présent** (« je chanter**ais** ») : le futur se termine par **-ai**, le conditionnel par **-ais**. Le futur peut aussi être exprimé par le **futur proche** : aller au présent + infinitif (« Je **vais partir** »). Les verbes en -oyer et -uyer changent leur y en i : je nettoie → je nettoierai.",
  mini:{t:'qcm',q:"Demain, je ___ au marché. (aller)",o:["irai","vais","allais"],a:0,e:"Le futur d'« aller » a le radical irrégulier « ir- » : j'irai."},
  exercices:[
    {t:'fill',q:"Conjugue au futur : Demain, tu ___ (chanter) devant la classe.",a:["chanteras"],e:"Infinitif « chanter » + -as : tu chanteras."},
    {t:'qcm',q:"Quelle forme est au futur ?",o:["Nous finirons","Nous finissons","Nous finissions"],a:0,e:"« Nous finirons » : infinitif + -ons."},
    {t:'match',q:"Associe chaque verbe à sa forme au futur (1re personne).",pairs:[["être","je serai"],["avoir","j'aurai"],["aller","j'irai"],["faire","je ferai"]],e:"Ces quatre verbes ont un radical irrégulier : ser-, aur-, ir-, fer-."},
    {t:'fix',q:"Corrige la phrase : « Elles prendrons le train. »",o:["Elles prendront le train.","Elles prendrent le train.","Elles prendraient le train."],a:0,e:"À la 3e personne du pluriel, la terminaison du futur est -ont."},
    {t:'vf',q:"Au futur, on entend et on écrit toujours un r avant la terminaison.",a:true,e:"Le r fait partie de la forme du futur : chanterai, finirai, serai, irai."}
  ],
  quiz:[
    {t:'qcm',q:"Que exprime le futur simple ?",o:["Ce qui se passera plus tard","Ce qui s'est passé hier","Ce qui se passe maintenant"],a:0,e:"Le futur simple annonce une action qui se passera après le moment où l'on parle."},
    {t:'fill',q:"Conjugue au futur : Nous ___ (finir) demain.",a:["finirons"],e:"Infinitif « finir » + -ons."},
    {t:'qcm',q:"Quelle est la forme du verbe « avoir » au futur avec « je » ?",o:["j'aurai","j'avais","j'aurais"],a:0,e:"Le radical de « avoir » au futur est « aur- » : j'aurai."},
    {t:'fill',q:"Conjugue au futur : Elle ___ (être) contente.",a:["sera"],e:"Radical « ser- » + -a : elle sera."},
    {t:'vf',q:"« Je parlerai » est une forme du futur simple.",a:true,e:"Infinitif « parler » + -ai."},
    {t:'qcm',q:"Quelle est la terminaison du futur avec « vous » ?",o:["-ez","-ons","-ent"],a:0,e:"Vous chanterez, vous finirez, vous serez."},
    {t:'fill',q:"Conjugue au futur : Ils ___ (aller) à Dakar.",a:["iront"],e:"Radical « ir- » + -ont : ils iront."},
    {t:'vf',q:"« Je chanterais » et « je chanterai » ont exactement le même sens.",a:false,e:"« Je chanterai » est un futur ; « je chanterais » est un conditionnel."},
    {t:'fill',q:"Conjugue au futur : Tu ___ (faire) tes devoirs.",a:["feras"],e:"Radical « fer- » + -as : tu feras."},
    {t:'fix',q:"Corrige la phrase : « Demain, je mangerons du riz. »",o:["Demain, je mangerai du riz.","Demain, je mangerais du riz.","Demain, je mangeras du riz."],a:0,e:"Avec « je », la terminaison du futur est -ai."}
  ]
},

"conj-subjonctif":{
  objectif:"Reconnaître le subjonctif présent, le conjuguer et savoir quand l'employer.",
  explication:[
    "Le **subjonctif** est un **mode** du verbe, comme l'indicatif ou l'impératif. Il exprime souvent ce qui est **souhaité, voulu, obligatoire, douteux ou craint** plutôt que ce qui est réel : « Il faut que tu **viennes**. » « Je veux qu'il **finisse**. »",
    "On le trouve le plus souvent dans une **proposition subordonnée**, après « que » (avec des verbes comme vouloir, falloir, souhaiter, craindre) ou après certaines conjonctions : **bien que, pour que, avant que, afin que, à condition que, jusqu'à ce que**. Le subjonctif est toujours précédé de « que » : que je, que tu, qu'il…",
    "Pour le former, on prend le **radical de la 3e personne du pluriel du présent** (ils finissent → finiss-) et on ajoute **-e, -es, -e, -ions, -iez, -ent**. Les verbes **être, avoir, aller, faire, pouvoir, savoir, vouloir** ont des formes particulières à apprendre."
  ],
  regle:"**Subjonctif présent = radical de « ils » au présent + -e, -es, -e, -ions, -iez, -ent**, précédé de « **que** ». Formes à connaître : être (que je **sois**), avoir (que j'**aie**), aller (que j'**aille**), faire (que je **fasse**).",
  tableaux:[{titre:"Le subjonctif présent de quatre verbes",entetes:["","être","avoir","aller","faire"],lignes:[["que je","sois","aie","aille","fasse"],["que tu","sois","aies","ailles","fasses"],["qu'il / elle","soit","ait","aille","fasse"],["que nous","soyons","ayons","allions","fassions"],["que vous","soyez","ayez","alliez","fassiez"],["qu'ils / elles","soient","aient","aillent","fassent"]]}],
  exemples:[
    {t:"Il faut que tu **viennes** demain.",n:"Après « il faut que », le verbe est au subjonctif : que tu viennes (radical de « ils viennent »)."},
    {t:"Je veux qu'il **finisse** ses devoirs.",n:"Après le verbe de volonté « vouloir que », on emploie le subjonctif : qu'il finisse."},
    {t:"Bien qu'elle **soit** fatiguée, elle continue.",n:"La conjonction « bien que » est suivie du subjonctif : qu'elle soit."}
  ],
  retenir:["Le subjonctif est un mode : il exprime volonté, obligation, doute, crainte.","Il est introduit par « que » ou par une conjonction (bien que, pour que…).","Radical de « ils » + -e, -es, -e, -ions, -iez, -ent.","Être, avoir, aller, faire sont irréguliers."],
  plus:"Au subjonctif présent, les formes de « nous » et « vous » des verbes du 1er groupe (que nous chantions, que vous chantiez) sont **identiques à l'imparfait de l'indicatif** ; c'est la présence de « que » et le sens de la phrase qui permettent de les distinguer. Attention : après « je pense que » ou « il est certain que », on emploie l'**indicatif** (« Je pense qu'il vient ») ; mais à la forme négative, on peut employer le subjonctif : « Je ne pense pas qu'il **vienne**. » Le **subjonctif imparfait** (« qu'il fût ») n'existe presque plus qu'à l'écrit littéraire.",
  mini:{t:'qcm',q:"Il faut que tu ___ demain. (venir)",o:["viennes","viens","viendras"],a:0,e:"Après « il faut que », on emploie le subjonctif : que tu viennes."},
  exercices:[
    {t:'fill',q:"Conjugue au subjonctif : Il faut que je ___ (finir) mon travail.",a:["finisse"],e:"Radical « finiss- » (ils finissent) + -e : que je finisse."},
    {t:'qcm',q:"Après quelle expression emploie-t-on le subjonctif ?",o:["Il faut que","Je sais que","Il dit que"],a:0,e:"« Il faut que » exprime l'obligation et demande le subjonctif."},
    {t:'match',q:"Associe chaque sujet à la forme du verbe « être » au subjonctif présent.",pairs:[["que je","sois"],["qu'il","soit"],["que nous","soyons"],["qu'ils","soient"]],e:"Être : sois, sois, soit, soyons, soyez, soient."},
    {t:'fix',q:"Corrige la phrase : « Il faut que tu vas au marché. »",o:["Il faut que tu ailles au marché.","Il faut que tu va au marché.","Il faut que tu allais au marché."],a:0,e:"Après « il faut que », « aller » se met au subjonctif : que tu ailles."},
    {t:'vf',q:"La conjonction « bien que » est suivie du subjonctif.",a:true,e:"Bien qu'il soit fatigué, il continue."}
  ],
  quiz:[
    {t:'qcm',q:"Le subjonctif est…",o:["un mode verbal","un groupe de verbes","une préposition"],a:0,e:"Comme l'indicatif, l'impératif et le conditionnel, c'est un mode."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Je veux que tu viennes.","Je veux que tu viens.","Je veux que tu viendras."],a:0,e:"Après « vouloir que », on emploie le subjonctif."},
    {t:'fill',q:"Conjugue au subjonctif : Il faut que nous ___ (avoir) du courage.",a:["ayons"],e:"Avoir au subjonctif : que nous ayons."},
    {t:'vf',q:"« Que tu sois » est une forme du subjonctif présent.",a:true,e:"« Sois » est le subjonctif présent du verbe être."},
    {t:'fill',q:"Conjugue au subjonctif : Bien qu'elle ___ (être) fatiguée, elle continue.",a:["soit"],e:"Être au subjonctif à la 3e personne : qu'elle soit."},
    {t:'qcm',q:"Quelle est la terminaison de « ils » au subjonctif présent ?",o:["-ent","-ont","-ez"],a:0,e:"Qu'ils finissent, qu'ils chantent, qu'ils partent : la terminaison est -ent."},
    {t:'fill',q:"Conjugue au subjonctif : Je voudrais qu'il ___ (faire) attention.",a:["fasse"],e:"Faire au subjonctif : qu'il fasse."},
