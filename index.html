},

"litt-theatre":{
  objectif:"Reconnaître les éléments d'un texte de théâtre (répliques, didascalies, actes, scènes) et comprendre qu'il est écrit pour être joué.",
  explication:[
    "Le **théâtre** est un art qui se joue devant un public. Le **texte de théâtre** est écrit pour être **joué**, non seulement lu. Il est formé de deux éléments : les **répliques**, c'est-à-dire ce que disent les personnages (leur nom est écrit devant), et les **didascalies**, les indications de l'auteur pour les gestes, le ton, le décor, les entrées et les sorties. Les didascalies sont écrites en italique ou entre parenthèses.",
    "Une pièce est divisée en **actes** (grandes parties), eux-mêmes divisés en **scènes**. On change de scène chaque fois qu'un personnage **entre** ou **sort**. Les genres principaux sont la **tragédie** (personnages nobles, destin, mort), la **comédie** (elle fait rire et critique les défauts), le **drame** (mélange des tons) et la **farce** (comique simple et physique).",
    "Il existe plusieurs sortes de paroles. Le **dialogue** est un échange entre personnages. Le **monologue** est prononcé par un personnage seul. La **tirade** est une longue réplique. L'**aparté** est une parole que l'on dit « à part » : le public l'entend, mais les autres personnages sont censés ne pas l'entendre. Enfin la **stichomythie** est un échange de répliques très courtes et rapides."
  ],
  regle:"Un texte de théâtre = **répliques + didascalies**, découpé en **actes et scènes**. Il est écrit pour être **joué** : pense au ton, aux gestes, au décor.",
  tableaux:[{titre:"Le vocabulaire du théâtre",entetes:["Terme","Définition"],lignes:[["didascalie","indication de l'auteur (gestes, ton, décor)"],["réplique","ce que dit un personnage en une prise de parole"],["monologue","un personnage seul qui parle"],["tirade","longue réplique"],["aparté","parole que les autres personnages n'entendent pas"]]}],
  exemples:[
    {t:"KARIM (en colère). — Tu m'avais promis de revenir !",n:"« (en colère) » est une didascalie : elle indique le ton. La phrase qui suit est une réplique."},
    {t:"(À part.) Il ne sait pas que je l'ai vu.",n:"C'est un aparté : le spectateur l'entend, mais l'autre personnage est censé ne pas l'entendre."},
    {t:"ACTE II, Scène 3",n:"Une pièce se divise en actes et en scènes : on change de scène quand un personnage entre ou sort."}
  ],
  retenir:["Un texte de théâtre est écrit pour être joué.","Répliques = paroles des personnages ; didascalies = indications de l'auteur.","Pièce = actes ; acte = scènes.","Monologue, tirade, aparté, dialogue : différentes formes de paroles."],
  plus:"Le **théâtre classique** français (XVIIe siècle) respectait la règle des **trois unités** : unité de **temps** (l'action dure au plus une journée), de **lieu** (un seul lieu) et d'**action** (une seule intrigue). Molière est le grand auteur de comédies, Corneille et Racine de tragédies. Le théâtre repose sur la **double énonciation** : les personnages se parlent entre eux, mais l'auteur s'adresse aussi au spectateur, qui sait parfois plus que les personnages (c'est ce qui crée le **quiproquo**). De nombreux auteurs africains, comme Bernard Dadié en Côte d'Ivoire, ont aussi écrit pour le théâtre.",
  mini:{t:'qcm',q:"Les indications de l'auteur sur les gestes et le ton s'appellent…",o:["des didascalies","des tirades","des actes"],a:0,e:"Les didascalies guident les acteurs et le metteur en scène."},
  exercices:[
    {t:'qcm',q:"Quand change-t-on de scène ?",o:["Quand un personnage entre ou sort","Quand la nuit tombe","Quand un acteur se trompe"],a:0,e:"C'est la convention : une scène commence à chaque entrée ou sortie."},
    {t:'match',q:"Associe chaque terme à sa définition.",pairs:[["monologue","un personnage seul qui parle"],["tirade","une longue réplique"],["aparté","parole que les autres n'entendent pas"],["didascalie","indication de l'auteur"]],e:"Ce sont les termes de base du théâtre."},
    {t:'vf',q:"Un texte de théâtre est écrit seulement pour être lu.",a:false,e:"Il est écrit pour être joué devant un public."},
    {t:'fill',q:"Complète : Une pièce est divisée en ___ , eux-mêmes divisés en scènes.",a:["actes"],e:"Une pièce comporte plusieurs actes."},
    {t:'qcm',q:"Quel genre théâtral cherche à faire rire ?",o:["la comédie","la tragédie","l'épopée"],a:0,e:"La comédie fait rire et critique les défauts."}
  ],
  quiz:[
    {t:'qcm',q:"Comment appelle-t-on ce que disent les personnages ?",o:["les répliques","les didascalies","les actes"],a:0,e:"Les répliques sont les paroles prononcées."},
    {t:'qcm',q:"Où trouve-t-on les didascalies ?",o:["Entre parenthèses ou en italique","Dans le titre","À la fin du livre seulement"],a:0,e:"Elles sont typographiquement distinguées des répliques."},
    {t:'vf',q:"Un monologue est prononcé par un personnage seul.",a:true,e:"Mono- signifie « seul »."},
    {t:'qcm',q:"Qu'est-ce qu'un aparté ?",o:["Une parole que le public entend mais pas les autres personnages","Une longue réplique","Un changement de décor"],a:0,e:"À part : dit en marge du dialogue."},
    {t:'qcm',q:"Qui est un grand auteur de comédies françaises ?",o:["Molière","Racine","Victor Hugo"],a:0,e:"Molière est l'auteur de comédies comme Le Malade imaginaire."},
    {t:'vf',q:"Dans la tragédie, l'objectif principal est de faire rire.",a:false,e:"La tragédie met en scène des destins dramatiques."},
    {t:'fill',q:"Complète : La règle des trois unités : temps, lieu et ___ .",a:["action"],e:"Unité de temps, de lieu et d'action."},
    {t:'qcm',q:"Comment s'appelle une longue réplique ?",o:["une tirade","un aparté","un acte"],a:0,e:"Une tirade est une longue prise de parole."},
    {t:'qcm',q:"Comment appelle-t-on un échange de répliques très courtes ?",o:["une stichomythie","un monologue","une didascalie"],a:0,e:"La stichomythie accélère le rythme du dialogue."},
    {t:'vf',q:"Une scène change chaque fois qu'un personnage entre ou sort.",a:true,e:"C'est la règle de découpage."}
  ]
},

"litt-roman":{
  objectif:"Analyser un roman en étudiant le narrateur et le point de vue, les personnages, le temps et l'espace, la structure et les thèmes.",
  explication:[
    "Un **roman** est un long récit en prose, généralement fictif. L'étudier, c'est lire l'œuvre en entier puis l'analyser sous plusieurs angles. Il faut d'abord se demander **qui raconte** : le **narrateur** n'est pas l'**auteur**. Quand il dit « je » et participe à l'histoire, c'est un **narrateur personnage** ; quand il raconte à la 3e personne sans y participer, c'est un **narrateur extérieur**.",
    "La **focalisation** indique par quels yeux le lecteur perçoit l'histoire. Elle est **zéro** (ou omnisciente) quand le narrateur en sait plus que les personnages, **interne** quand on voit par les yeux d'un personnage, **externe** quand on ne voit que les actions et les paroles, comme une caméra. Ensuite, on étudie les **personnages** (héros, opposants, alliés, leur évolution), le **temps** (durée, ellipses, retours en arrière ou **analepses**) et l'**espace** (lieux, atmosphère).",
    "Enfin, on étudie la **structure** (schéma narratif : situation initiale, élément perturbateur, péripéties, dénouement, situation finale), les **thèmes** (exil, pouvoir, amour, identité…) et l'**intention de l'auteur** (raconter, dénoncer, faire réfléchir, émouvoir). On distingue des genres : roman d'aventures, policier, historique, réaliste, de science-fiction, d'apprentissage…"
  ],
  regle:"Pour étudier un roman : **qui raconte** (narrateur, focalisation) → **qui agit** (personnages) → **où et quand** (espace, temps) → **pourquoi** (thèmes, intention de l'auteur).",
  tableaux:[{titre:"Les trois focalisations",entetes:["Focalisation","Le lecteur perçoit…","Exemple"],lignes:[["zéro (omnisciente)","tout, y compris les pensées de tous","Il ne savait pas qu'elle l'observait."],["interne","par les yeux d'un seul personnage","Je sentis mon cœur battre."],["externe","seulement actions et paroles, comme une caméra","Il ouvrit la porte et sortit."]]}],
  exemples:[
    {t:"**Je** marchais vers la ville quand j'ai entendu un cri.",n:"Narrateur personnage (« je ») et focalisation interne : on perçoit tout par ses yeux."},
    {t:"Elle ne savait pas que son frère la cherchait déjà.",n:"Focalisation zéro : le narrateur sait ce que ni elle ni son frère ne savent."},
    {t:"Trois ans plus tôt, il avait quitté son village.",n:"Retour en arrière (analepse) : on raconte un événement antérieur au moment du récit."}
  ],
  retenir:["Le narrateur n'est pas l'auteur.","Trois focalisations : zéro, interne, externe.","Schéma narratif : situation initiale, élément perturbateur, péripéties, dénouement, situation finale.","Analyser : narration, personnages, temps et espace, thèmes."],
  plus:"Des romans francophones africains se prêtent bien à ce type d'analyse, par exemple **L'Enfant noir** de Camara Laye (Guinée), **Les Soleils des indépendances** d'Ahmadou Kourouma (Côte d'Ivoire) et **Une si longue lettre** de Mariama Bâ (Sénégal), un **roman épistolaire** : il est écrit sous la forme d'une lettre. Un **roman d'apprentissage** raconte la formation d'un jeune héros. Pour un commentaire de roman, on distingue toujours le **temps de l'histoire** (la durée réelle des événements) du **temps du récit** (le temps qu'il faut pour les raconter).",
  mini:{t:'qcm',q:"Quand le narrateur dit « je » et participe à l'histoire, c'est…",o:["un narrateur personnage","un narrateur omniscient","un dramaturge"],a:0,e:"Il est à la fois narrateur et personnage."},
  exercices:[
    {t:'qcm',q:"Dans « Il ouvrit la porte et sortit. », quelle focalisation domine ?",o:["externe","interne","zéro"],a:0,e:"On ne connaît ni les pensées ni les sentiments du personnage : seulement ses actions."},
    {t:'match',q:"Associe chaque focalisation à sa définition.",pairs:[["zéro","le narrateur sait tout"],["interne","on voit par les yeux d'un personnage"],["externe","on voit seulement l'extérieur"],["narrateur personnage","il dit « je » et participe à l'histoire"]],e:"La focalisation indique par quels yeux on perçoit l'histoire."},
    {t:'vf',q:"Le narrateur et l'auteur sont toujours la même personne.",a:false,e:"Le narrateur est une voix du récit ; l'auteur est la personne réelle qui écrit."},
    {t:'fill',q:"Complète : Un retour en arrière dans un récit s'appelle une ___ .",a:["analepse"],e:"Analepse : événement du passé raconté après coup."},
    {t:'qcm',q:"Quelle est la première étape du schéma narratif ?",o:["la situation initiale","le dénouement","les péripéties"],a:0,e:"On présente d'abord le cadre et les personnages."}
  ],
  quiz:[
    {t:'qcm',q:"Qu'est-ce qu'un roman ?",o:["Un long récit en prose, généralement fictif","Un poème en vers","Une pièce de théâtre"],a:0,e:"Le roman est un genre narratif."},
    {t:'qcm',q:"Quelle question se pose-t-on en premier pour étudier un roman ?",o:["Qui raconte ?","Combien de pages ?","Quel est le prix ?"],a:0,e:"Le narrateur et le point de vue orientent la lecture."},
    {t:'vf',q:"Dans la focalisation interne, on voit l'histoire par les yeux d'un personnage.",a:true,e:"Le lecteur partage sa perception."},
    {t:'qcm',q:"Quel élément suit la situation initiale dans le schéma narratif ?",o:["l'élément perturbateur","le dénouement","la situation finale"],a:0,e:"Un événement vient rompre l'équilibre initial."},
    {t:'qcm',q:"Comment appelle-t-on un roman écrit sous forme de lettres ?",o:["un roman épistolaire","un roman policier","un roman historique"],a:0,e:"Épistolaire vient du mot « épître », la lettre."},
    {t:'fill',q:"Complète : Le récit qui raconte la formation d'un jeune héros est un roman d'___ .",a:["apprentissage"],e:"C'est le roman d'apprentissage."},
    {t:'vf',q:"Une ellipse consiste à passer sous silence une période de l'histoire.",a:true,e:"Le récit saute une période sans la raconter."},
    {t:'qcm',q:"Quel est un thème possible d'un roman ?",o:["l'exil","le point-virgule","la rime"],a:0,e:"Exil, pouvoir, amour, identité… sont des thèmes."},
    {t:'qcm',q:"Quelle focalisation permet au narrateur de savoir ce que pensent tous les personnages ?",o:["zéro","interne","externe"],a:0,e:"C'est la focalisation omnisciente."},
    {t:'fill',q:"Complète : Le temps de l'histoire et le temps du ___ sont deux notions différentes.",a:["récit"],e:"La durée des événements et la durée de leur récit ne coïncident pas toujours."}
  ]
},

/* ---- Leçons ajoutées (V1.2) ---- */
"gram-sujet":{
  objectif:"Trouver le sujet d'un verbe et reconnaître l'attribut du sujet après un verbe d'état.",
  explication:[
    "Le **sujet** est le mot ou le groupe de mots qui fait l'action ou dont on parle. Pour le trouver, on pose la question « **Qui est-ce qui ?** » (ou « **Qu'est-ce qui ?** ») devant le verbe : « Les enfants jouent. » → Qui est-ce qui joue ? Les enfants. Le sujet peut être un nom (Awa), un groupe nominal (le petit chat), un pronom (elle) ou un infinitif (Lire est agréable).",
    "Le sujet se place le plus souvent **avant** le verbe, mais il peut aussi se trouver **après** lui : « Dans la cour jouent des enfants. » On dit alors que le sujet est **inversé**. Cela arrive dans certaines questions (« Où vas-tu ? ») ou pour donner du style à une phrase.",
    "L'**attribut du sujet** exprime une qualité ou une identité du sujet. Il est relié au sujet par un **verbe d'état** : être, sembler, paraître, devenir, rester, demeurer. « Awa est **contente**. » « Karim devient **médecin**. » L'attribut s'accorde avec le sujet et ne peut pas être supprimé sans que la phrase perde son sens."
  ],
  regle:"Le **sujet** répond à « Qui est-ce qui ? / Qu'est-ce qui ? » devant le verbe. L'**attribut du sujet** suit un **verbe d'état** (être, sembler, devenir…) et **s'accorde avec le sujet**.",
  tableaux:[{titre:"Les verbes d'état",entetes:["Verbe d'état","Exemple","Attribut"],lignes:[["être","Les élèves sont attentifs.","attentifs"],["devenir","Karim devient médecin.","médecin"],["sembler","Elle semble fatiguée.","fatiguée"],["rester","Nous restons calmes.","calmes"]]}],
  exemples:[
    {t:"**Les élèves** écoutent le maître.",n:"Qui est-ce qui écoute ? Les élèves : c'est le sujet du verbe « écoutent »."},
    {t:"Awa est **la meilleure de sa classe**.",n:"« La meilleure de sa classe » est un attribut du sujet « Awa », relié par le verbe d'état « est »."},
    {t:"Dans le jardin poussent **des manguiers**.",n:"Le sujet est placé après le verbe : qui est-ce qui pousse ? Des manguiers."}
  ],
  retenir:["Le sujet se trouve avec « Qui est-ce qui ? » devant le verbe.","Il peut se placer après le verbe (sujet inversé).","L'attribut du sujet suit un verbe d'état.","L'attribut s'accorde avec le sujet."],
  plus:"Ne confonds pas l'**attribut** et le **COD**. L'attribut désigne **la même personne ou chose que le sujet** : « Karim est un ami » (Karim = un ami). Le COD désigne un être ou une chose **différente** : « Karim aide un ami ». Dans « Il pleut » ou « Il faut partir », le pronom « il » est un **sujet apparent** (impersonnel) : il ne remplace personne. Enfin, un même verbe peut être d'état ou d'action : « Elle **reste** calme » (état) et « Elle **reste** à la maison » (elle se trouve là).",
  mini:{t:'qcm',q:"Dans « Ma sœur est infirmière », « infirmière » est…",o:["attribut du sujet","COD","sujet"],a:0,e:"Le verbe « est » est un verbe d'état : « infirmière » est attribut du sujet « ma sœur »."},
  exercices:[
    {t:'find',q:"Touche tous les mots du sujet, puis valide.",s:"Les enfants de mon voisin jouent au ballon",a:["Les","enfants","de","mon","voisin"],e:"Qui est-ce qui joue ? Les enfants de mon voisin : c'est le groupe sujet."},
    {t:'qcm',q:"Quelle phrase contient un attribut du sujet ?",o:["Awa semble heureuse.","Awa mange une mangue.","Awa lit un livre."],a:0,e:"« Sembler » est un verbe d'état : « heureuse » est attribut d'Awa."},
    {t:'fill',q:"Complète avec un verbe d'état : Le ciel ___ bleu.",a:["est","semble","paraît","reste","devient","demeure"],e:"Être, sembler, paraître, rester, devenir sont des verbes d'état."},
    {t:'match',q:"Associe chaque phrase à la fonction du groupe en gras.",pairs:[["Les élèves chantent.","sujet : Les élèves"],["Elle est joyeuse.","attribut : joyeuse"],["Le maître corrige les copies.","COD : les copies"],["Il parle à sa mère.","COI : à sa mère"]],e:"On distingue le sujet (qui fait l'action), l'attribut (relié par un verbe d'état), le COD (sans préposition) et le COI (avec préposition)."},
    {t:'vf',q:"L'attribut du sujet s'accorde avec le sujet.",a:true,e:"Les élèves sont attentifs : « attentifs » est au masculin pluriel comme « les élèves »."}
  ],
  quiz:[
    {t:'qcm',q:"Comment trouve-t-on le sujet d'un verbe ?",o:["En posant « Qui est-ce qui ? » devant le verbe","En posant « à qui ? » après le verbe","En cherchant l'adjectif"],a:0,e:"On demande : qui est-ce qui fait l'action ?"},
    {t:'qcm',q:"Dans « Le vieux chat dort sur le tapis », quel est le sujet ?",o:["Le vieux chat","sur le tapis","dort"],a:0,e:"Qui est-ce qui dort ? Le vieux chat."},
    {t:'vf',q:"Un verbe d'état exprime une action.",a:false,e:"Un verbe d'état exprime une manière d'être : il relie le sujet à son attribut."},
    {t:'qcm',q:"Quel verbe est un verbe d'état ?",o:["sembler","courir","manger"],a:0,e:"Sembler exprime un état ; courir et manger expriment des actions."},
    {t:'fill',q:"Accorde l'attribut : Les élèves sont ___ . (attentif)",a:["attentifs"],e:"L'attribut s'accorde avec le sujet « les élèves » : masculin pluriel."},
    {t:'qcm',q:"Dans « Karim devient médecin », quel est l'attribut du sujet ?",o:["médecin","Karim","devient"],a:0,e:"« Médecin » est relié à Karim par le verbe d'état « devient »."},
    {t:'vf',q:"Le sujet peut se placer après le verbe.",a:true,e:"C'est le sujet inversé : « Dans la cour jouent des enfants »."},
    {t:'qcm',q:"Dans « Dans la cour jouent des enfants », quel est le sujet ?",o:["des enfants","Dans la cour","jouent"],a:0,e:"Qui est-ce qui joue ? Des enfants."},
    {t:'fill',q:"Complète : Awa reste ___ . (calme, au féminin singulier)",a:["calme"],e:"« Calme » ne change pas au féminin."},
    {t:'fix',q:"Corrige la phrase : « Fatou semble fatigué. »",o:["Fatou semble fatiguée.","Fatou semble fatigué.","Fatou semblent fatiguée."],a:0,e:"L'attribut s'accorde avec le sujet Fatou : féminin singulier."}
  ]
},

"gram-cc":{
  objectif:"Reconnaître les compléments circonstanciels (lieu, temps, manière, cause, but) et les distinguer du COD.",
  explication:[
    "Le **complément circonstanciel** (CC) précise les **circonstances** de l'action : où, quand, comment, pourquoi… Il n'est pas indispensable à la phrase : on peut le **supprimer** ou le **déplacer** sans rendre la phrase incorrecte. « **Hier**, Awa a lu un livre **dans la cour**. » → « Awa a lu un livre. » est correct.",
    "On distingue plusieurs types selon la question posée : le **lieu** (Où ?), le **temps** (Quand ?), la **manière** (Comment ?), la **cause** (Pourquoi ?), le **but** (Pour quoi faire ?), le **moyen** (Avec quoi ?).",
    "Un CC peut être un **groupe nominal introduit par une préposition** (dans la cour, avec joie), un **adverbe** (hier, ici, lentement) ou une **proposition subordonnée** (quand il pleut). Dans les programmes récents, on parle aussi de **complément de phrase**."
  ],
  regle:"Un **CC** répond à **où ? quand ? comment ? pourquoi ?** et il est **supprimable et déplaçable**. Le COD, lui, ne peut ni être supprimé ni déplacé sans changer le sens de la phrase.",
  tableaux:[{titre:"Les types de CC",entetes:["Type","Question","Exemple"],lignes:[["lieu","Où ?","Nous jouons dans la cour."],["temps","Quand ?","Il pleut depuis ce matin."],["manière","Comment ?","Elle répond calmement."],["cause","Pourquoi ?","Il est absent à cause de la maladie."],["but","Pour quoi faire ?","Il étudie pour réussir."]]}],
  exemples:[
    {t:"**Chaque matin**, mon père va au marché.",n:"CC de temps : il répond à « quand ? » et peut se déplacer en fin de phrase."},
    {t:"Karim écrit **avec un stylo bleu**.",n:"CC de moyen : il répond à « avec quoi ? » et peut être supprimé."},
    {t:"Elle chante **dans la cour**.",n:"CC de lieu : il répond à « où ? »."}
  ],
  retenir:["Le CC précise les circonstances : lieu, temps, manière, cause, but…","Il est supprimable et déplaçable.","Il peut être un groupe nominal, un adverbe ou une subordonnée.","Le COD n'est ni supprimable ni déplaçable."],
  plus:"Pour distinguer un **CC** d'un **COI**, fais le test de la suppression : « Il parle à Awa » ne peut pas perdre « à Awa » sans perdre son sens (COI), alors que « Il parle dans la cour » reste correct sans « dans la cour » (CC). Plusieurs CC peuvent se cumuler dans une même phrase : « **Hier soir**, il a marché **lentement** **jusqu'au village** **pour voir son ami**. »",
  mini:{t:'qcm',q:"Dans « Hier, nous sommes allés au marché », quel type de CC est « hier » ?",o:["temps","lieu","manière"],a:0,e:"« Hier » répond à la question « quand ? »."},
  exercices:[
    {t:'find',q:"Touche tous les mots du CC de lieu, puis valide.",s:"Les élèves jouent dans le jardin pendant la récréation",a:["dans","le","jardin"],e:"« Dans le jardin » répond à « où ? »."},
    {t:'qcm',q:"Dans « Il marche lentement », quel type de CC est « lentement » ?",o:["manière","temps","lieu"],a:0,e:"« Lentement » répond à « comment ? »."},
    {t:'vf',q:"Un CC ne peut jamais être supprimé.",a:false,e:"Le CC peut être supprimé sans que la phrase devienne incorrecte."},

"conj-imperatif":{
  objectif:"Conjuguer l'impératif présent et l'employer pour donner un ordre, un conseil ou une interdiction.",
  explication:[
    "L'**impératif** est le mode qui sert à **donner un ordre**, un conseil, une invitation ou une interdiction : « Range ta chambre. » « Ne cours pas dans le couloir ! » Il ne s'emploie qu'à **trois personnes** : **tu, nous, vous**. Et on **n'écrit pas le pronom sujet** : on dit « Chante ! », pas « Tu chante ! ».",
    "On forme l'impératif à partir du présent de l'indicatif, sans pronom : tu chantes → **chante** ; nous chantons → **chantons** ; vous chantez → **chantez**. Attention : pour les verbes du **1er groupe** (et aller, ouvrir, offrir…), on **enlève le -s** à la 2e personne du singulier : « chante », « va ». Les verbes en -ir et -re gardent le -s : « finis », « prends ».",
    "Quatre verbes ont un impératif particulier : **être** (sois, soyons, soyez), **avoir** (aie, ayons, ayez), **savoir** (sache, sachons, sachez) et **vouloir** (veuille, veuillons, veuillez). À la forme négative, « ne » et « pas » entourent le verbe : « **Ne** cours **pas** ! »"
  ],
  regle:"L'impératif n'a que **trois personnes (tu, nous, vous)** et **pas de pronom sujet**. Au singulier, les verbes du **1er groupe** n'ont **pas de -s** : « chante ».",
  tableaux:[{titre:"L'impératif présent",entetes:["","chanter","finir","être","avoir"],lignes:[["tu","chante","finis","sois","aie"],["nous","chantons","finissons","soyons","ayons"],["vous","chantez","finissez","soyez","ayez"]]}],
  exemples:[
    {t:"**Range** ta chambre.",n:"Impératif de « ranger » à la 2e personne du singulier, sans pronom sujet."},
    {t:"**Soyez** attentifs.",n:"Impératif irrégulier du verbe être, 2e personne du pluriel."},
    {t:"**Allons** au marché.",n:"Impératif à la 1re personne du pluriel : une invitation."}
  ],
  retenir:["L'impératif exprime un ordre, un conseil, une invitation, une interdiction.","3 personnes seulement : tu, nous, vous.","Pas de pronom sujet.","Pas de -s à « tu » pour les verbes en -er : chante, va."],
  plus:"Quand un pronom complément accompagne le verbe, il se place **après** l'impératif à la forme affirmative, avec des **traits d'union** : « Donne-le-moi. » ; à la forme négative, il se place **avant** : « Ne me le donne pas. » Le -s réapparaît devant les pronoms « y » et « en » pour faciliter la prononciation : « Vas-y ! », « Manges-en ! ». Il existe aussi un impératif passé (« aie fini avant midi ») mais on l'emploie rarement.",
  mini:{t:'qcm',q:"Quel est l'impératif de « chanter » à la 2e personne du singulier ?",o:["chante","chantes","chanter"],a:0,e:"Les verbes du 1er groupe perdent le -s à l'impératif : chante."},
  exercices:[
    {t:'fill',q:"Conjugue à l'impératif (tu) : ___ (finir) tes devoirs avant de jouer.",a:["finis"],e:"Le verbe « finir » garde le -s : finis."},
    {t:'qcm',q:"Quelle phrase est à l'impératif ?",o:["Écoute la leçon.","Tu écoutes la leçon.","Écoutes-tu la leçon ?"],a:0,e:"« Écoute » donne un ordre, sans pronom sujet."},
    {t:'fix',q:"Corrige la phrase : « Chantes plus fort ! »",o:["Chante plus fort !","Chantes plus fort !","Chanter plus fort !"],a:0,e:"Au singulier, les verbes du 1er groupe n'ont pas de -s à l'impératif."},
    {t:'match',q:"Associe chaque verbe à son impératif.",pairs:[["être (tu)","sois"],["être (vous)","soyez"],["avoir (tu)","aie"],["avoir (nous)","ayons"]],e:"Être et avoir ont un impératif irrégulier."},
    {t:'vf',q:"À l'impératif, on emploie toujours le pronom sujet.",a:false,e:"L'impératif se conjugue sans pronom sujet."}
  ],
  quiz:[
    {t:'qcm',q:"À quoi sert l'impératif ?",o:["À donner un ordre ou un conseil","À raconter le passé","À poser une question"],a:0,e:"L'impératif exprime l'ordre, le conseil, l'invitation ou l'interdiction."},
    {t:'qcm',q:"À combien de personnes se conjugue l'impératif ?",o:["3","6","2"],a:0,e:"Tu, nous, vous."},
    {t:'fill',q:"Conjugue à l'impératif (tu) : ___ (prendre) ton cahier.",a:["prends"],e:"Le verbe « prendre » garde le -s : prends."},
    {t:'fill',q:"Conjugue à l'impératif (vous) : ___ (être) courageux !",a:["soyez"],e:"Être a un impératif irrégulier : soyez."},
    {t:'vf',q:"À l'impératif, « manger » à la 2e personne du singulier s'écrit « manges ».",a:false,e:"On écrit « mange », sans -s."},
    {t:'qcm',q:"Quel est l'impératif d'« aller » à la 2e personne du singulier ?",o:["va","vas","aller"],a:0,e:"« Aller » perd le -s à l'impératif : va."},
    {t:'fill',q:"Conjugue à l'impératif (tu) : ___ (avoir) confiance !",a:["aie"],e:"Avoir a un impératif irrégulier : aie."},
    {t:'qcm',q:"Quelle phrase est un impératif négatif correct ?",o:["Ne cours pas !","Cours pas !","Ne pas cours !"],a:0,e:"« Ne » et « pas » entourent le verbe."},
    {t:'fill',q:"Conjugue à l'impératif (nous) : ___ (finir) ce travail.",a:["finissons"],e:"Impératif de « nous » : finissons."},
    {t:'fix',q:"Corrige l'impératif adressé à des élèves : « Sois attentifs. »",o:["Soyez attentifs.","Sois attentifs.","Sommes attentifs."],a:0,e:"On s'adresse à plusieurs personnes : « soyez »."}
  ]
},

"conj-passe-simple":{
  objectif:"Reconnaître le passé simple, le conjuguer à la 3e personne et l'employer dans un récit.",
  explication:[
    "Le **passé simple** est le temps du **récit écrit** : on le rencontre dans les contes, les romans, les textes d'histoire. Il exprime des actions **terminées** qui font avancer l'histoire : « Il **ouvrit** la porte et **entra**. » On ne l'utilise presque jamais à l'oral, et surtout à la **3e personne** (il, elle, ils, elles).",
    "Formation à la 3e personne : les verbes du **1er groupe** font **-a** et **-èrent** (il chanta, ils chantèrent). Les verbes du **2e groupe** et beaucoup de verbes du 3e groupe font **-it** et **-irent** (il finit, ils finirent ; il prit, ils prirent ; il fit, ils firent). D'autres font **-ut** et **-urent** (il eut, il fut ; ils eurent, ils furent) ou **-int** et **-inrent** (il vint, ils vinrent).",
    "Dans un récit, on associe souvent le passé simple et l'**imparfait**. L'imparfait décrit le **décor** ou ce qui **dure** ; le passé simple raconte les **actions** qui se succèdent : « Il pleuvait ; le vieux prit son bâton et sortit. »"
  ],
  regle:"Le **passé simple** raconte les **actions principales** d'un récit écrit. À la 3e personne : **-a / -èrent** (1er groupe), **-it / -irent** (finir, prendre, faire…), **-ut / -urent** (avoir, être…).",
  tableaux:[{titre:"Le passé simple à la 3e personne",entetes:["Infinitif","il / elle","ils / elles"],lignes:[["chanter","chanta","chantèrent"],["finir","finit","finirent"],["avoir","eut","eurent"],["être","fut","furent"],["faire","fit","firent"],["venir","vint","vinrent"]]}],
  exemples:[
    {t:"Le griot **se leva** et **commença** son récit.",n:"Deux actions qui se suivent, racontées au passé simple."},
    {t:"Il **fut** surpris par le bruit.",n:"Passé simple du verbe être à la 3e personne du singulier."},
    {t:"Le vieux **prit** son bâton et **partit**.",n:"« Prit » et « partit » : passé simple en -it."}
  ],
  retenir:["Le passé simple est le temps du récit écrit.","On l'emploie surtout à la 3e personne.","Il exprime des actions terminées qui se succèdent.","Il s'associe à l'imparfait, qui donne le décor."],
  plus:"Aux autres personnes, on écrit : je chantai, tu chantas, nous chantâmes, vous chantâtes (avec un accent circonflexe), et pour finir : je finis, tu finis, nous finîmes, vous finîtes. Le **passé composé** se rapproche du présent et s'emploie à l'oral ; le passé simple, lui, raconte des faits complètement détachés du présent. Attention à ne pas confondre « il **chanta** » (passé simple) et « il **chantera** » (futur simple).",
  mini:{t:'qcm',q:"Il ___ la porte. (ouvrir, au passé simple)",o:["ouvrit","ouvrait","ouvre"],a:0,e:"Passé simple de « ouvrir » à la 3e personne : il ouvrit."},
  exercices:[
    {t:'fill',q:"Conjugue au passé simple : Il ___ (chanter) une chanson.",a:["chanta"],e:"Verbe du 1er groupe : -a à la 3e personne du singulier."},
    {t:'qcm',q:"Quelle forme est au passé simple ?",o:["Ils finirent","Ils finissaient","Ils finissent"],a:0,e:"« Finirent » : 3e personne du pluriel du passé simple."},
    {t:'match',q:"Associe chaque verbe à sa forme au passé simple (il).",pairs:[["être","fut"],["avoir","eut"],["faire","fit"],["venir","vint"]],e:"Ce sont des formes irrégulières à connaître."},
    {t:'vf',q:"Le passé simple s'emploie surtout à l'oral.",a:false,e:"Il s'emploie surtout à l'écrit, dans les récits."},
    {t:'find',q:"Touche les verbes au passé simple, puis valide.",s:"Le roi entra dans la salle et tout le monde se tut",a:["entra","tut"],e:"« Entra » et « tut » (se taire) sont au passé simple."}
  ],
  quiz:[
    {t:'qcm',q:"Où emploie-t-on surtout le passé simple ?",o:["Dans les récits écrits","À l'oral","Dans les SMS"],a:0,e:"C'est le temps des contes, des romans et des textes d'histoire."},
    {t:'fill',q:"Conjugue au passé simple : Elle ___ (marcher) longtemps.",a:["marcha"],e:"Verbe du 1er groupe : marcha."},
    {t:'qcm',q:"Ils ___ peur. (avoir, au passé simple)",o:["eurent","avaient","auront"],a:0,e:"Avoir au passé simple, 3e personne du pluriel : ils eurent."},
    {t:'vf',q:"« Il fut » est le passé simple du verbe être.",a:true,e:"Être : il fut, ils furent."},
    {t:'fill',q:"Conjugue au passé simple : Il ___ (faire) un geste.",a:["fit"],e:"Faire au passé simple : il fit."},
    {t:'qcm',q:"Quelle est la 3e personne du pluriel du passé simple de « chanter » ?",o:["chantèrent","chantaient","chanteront"],a:0,e:"Verbes du 1er groupe : -èrent."},
    {t:'fill',q:"Conjugue au passé simple : Ils ___ (venir) très tôt.",a:["vinrent"],e:"Venir au passé simple : ils vinrent."},
    {t:'qcm',q:"Dans « Il pleuvait quand il sortit », quel verbe est au passé simple ?",o:["sortit","pleuvait","quand"],a:0,e:"« Pleuvait » est à l'imparfait ; « sortit » est au passé simple."},
    {t:'vf',q:"Dans un récit, l'imparfait décrit le décor et le passé simple raconte les actions.",a:true,e:"C'est la répartition habituelle."},
    {t:'fix',q:"Corrige l'accord : « Les gardes s'inclina devant le roi. »",o:["Les gardes s'inclinèrent devant le roi.","Les gardes s'inclina devant le roi.","Les gardes s'inclinera devant le roi."],a:0,e:"Le sujet « les gardes » est pluriel : le verbe prend la terminaison -èrent."}
  ]
},

"conj-conditionnel":{
  objectif:"Conjuguer le conditionnel présent et l'employer pour un souhait, un conseil ou une hypothèse.",
  explication:[
    "Le **conditionnel présent** exprime plusieurs choses. Un **souhait poli** : « Je **voudrais** un verre d'eau. » Un **conseil** : « Tu **devrais** te reposer. » Une **information incertaine** : « Il y **aurait** des blessés. » Et surtout la **conséquence d'une condition** qui n'est pas réalisée : « Si j'avais le temps, je **viendrais**. »",
    "Pour le former, on prend le **radical du futur** et on ajoute les **terminaisons de l'imparfait** : **-ais, -ais, -ait, -ions, -iez, -aient**. Chanter → je chanter**ais** ; finir → je finir**ais** ; être → je ser**ais** ; avoir → j'aur**ais** ; aller → j'ir**ais**.",
    "Dans une phrase avec « **si** », il faut respecter un système précis : **si + imparfait** dans la proposition avec « si », et **conditionnel** dans l'autre. « Si tu **travaillais**, tu **réussirais**. » Jamais de conditionnel après « si » : « Si j'aurais… » est une faute."
  ],
  regle:"**Conditionnel présent = radical du futur + terminaisons de l'imparfait** (-ais, -ais, -ait, -ions, -iez, -aient). Système : **si + imparfait → conditionnel**.",
  tableaux:[{titre:"Futur et conditionnel présent",entetes:["","Futur","Conditionnel"],lignes:[["je","je chanterai","je chanterais"],["tu","tu chanteras","tu chanterais"],["nous","nous chanterons","nous chanterions"],["ils","ils chanteront","ils chanteraient"]]}],
  exemples:[
    {t:"Je **voudrais** un peu d'eau, s'il vous plaît.",n:"Le conditionnel exprime ici une demande polie."},
    {t:"Si j'**avais** le temps, je **viendrais**.",n:"Après « si » : imparfait. Dans l'autre proposition : conditionnel."},
    {t:"Tu **devrais** te reposer.",n:"Le conditionnel exprime un conseil."}
  ],
  retenir:["Le conditionnel exprime souhait, politesse, conseil, hypothèse.","Radical du futur + terminaisons de l'imparfait.","Futur : -ai. Conditionnel : -ais.","Après « si », jamais de conditionnel."],
  plus:"Le **conditionnel passé** se forme avec l'auxiliaire au conditionnel et le participe passé : « J'**aurais chanté** », « Elle **serait partie** ». Il sert à exprimer un regret ou une hypothèse dans le passé : « Si j'avais su, je **serais venu**. » Dans les journaux, le conditionnel présente une information **non confirmée** : « Le ministre **aurait démissionné**. »",
  mini:{t:'qcm',q:"Si j'avais de l'argent, j'___ un vélo. (acheter)",o:["achèterais","achèterai","achetais"],a:0,e:"Après « si + imparfait », on emploie le conditionnel : j'achèterais."},
  exercices:[
    {t:'fill',q:"Conjugue au conditionnel : Je ___ (vouloir) un verre d'eau, s'il vous plaît.",a:["voudrais"],e:"Radical « voudr- » + -ais."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Si tu venais, je serais content.","Si tu viendrais, je serais content.","Si tu viendrais, je serai content."],a:0,e:"Après « si », on emploie l'imparfait : « si tu venais »."},
    {t:'match',q:"Associe chaque futur à son conditionnel.",pairs:[["je chanterai","je chanterais"],["nous finirons","nous finirions"],["ils seront","ils seraient"],["tu auras","tu aurais"]],e:"Même radical, mais terminaisons de l'imparfait au conditionnel."},
    {t:'fix',q:"Corrige la phrase : « Si j'aurais du temps, je viendrais. »",o:["Si j'avais du temps, je viendrais.","Si j'aurais du temps, je viendrai.","Si j'avais du temps, je viendrai."],a:0,e:"Après « si », on emploie l'imparfait, pas le conditionnel."},
    {t:'vf',q:"On peut employer le conditionnel juste après « si ».",a:false,e:"Après « si » de la condition, on emploie l'imparfait."}
  ],
  quiz:[
    {t:'qcm',q:"Le conditionnel peut exprimer…",o:["un souhait poli","un ordre","un passé récent"],a:0,e:"« Je voudrais… » est un souhait poli."},
    {t:'fill',q:"Conjugue au conditionnel : Il ___ (être) content de vous voir.",a:["serait"],e:"Radical « ser- » + -ait."},
    {t:'qcm',q:"Quelle est la terminaison de « ils » au conditionnel présent ?",o:["-aient","-ont","-ent"],a:0,e:"Ils chanteraient, ils seraient, ils auraient."},
    {t:'vf',q:"« Je chanterais » est une forme du conditionnel.",a:true,e:"Radical du futur « chanter- » + -ais."},
    {t:'fill',q:"Conjugue au conditionnel : Nous ___ (aller) au marché si nous avions le temps.",a:["irions"],e:"Radical « ir- » + -ions."},
    {t:'qcm',q:"Quelle phrase est correcte ?",o:["Si j'étais riche, j'achèterais une maison.","Si j'aurais été riche, j'achèterais une maison.","Si je serais riche, j'achèterais une maison."],a:0,e:"Si + imparfait dans la condition."},
    {t:'fill',q:"Conjugue au conditionnel (conseil) : Tu ___ (devoir) te reposer.",a:["devrais"],e:"Radical « devr- » + -ais."},
    {t:'qcm',q:"Quelle est la différence entre « je finirai » et « je finirais » ?",o:["futur / conditionnel","conditionnel / futur","imparfait / futur"],a:0,e:"-ai : futur. -ais : conditionnel."},
    {t:'vf',q:"Le conditionnel présent a le même radical que le futur.",a:true,e:"Chanter- : je chanterai, je chanterais."},
    {t:'fix',q:"Corrige la phrase : « Si tu travaillerais, tu réussirais. »",o:["Si tu travaillais, tu réussirais.","Si tu travaillerais, tu réussiras.","Si tu travailles, tu réussirais."],a:0,e:"Après « si », on emploie l'imparfait."}
  ]
},

"conj-plus-que-parfait":{
  objectif:"Former le plus-que-parfait et l'employer pour une action passée antérieure à une autre action passée.",
  explication:[
    "Le **plus-que-parfait** exprime une action **déjà terminée avant** une autre action passée. « Quand je suis arrivé, le cours **avait** déjà **commencé**. » Le cours a commencé avant mon arrivée : le plus-que-parfait marque cette **antériorité**. Il sert aussi à expliquer une cause dans le passé : « Elle pleurait parce qu'elle **avait perdu** son livre. »",
    "Pour le former, on emploie l'**auxiliaire avoir ou être à l'imparfait** suivi du **participe passé** : j'**avais** chanté, il **était** parti, elles **étaient** arrivées. Les règles d'accord du participe passé sont les mêmes qu'au passé composé : avec « être », il s'accorde avec le sujet.",
    "Le plus-que-parfait s'emploie souvent avec l'**imparfait**, le **passé composé** ou le **passé simple**, qui expriment l'action de référence : « Il **était fatigué** parce qu'il **avait couru** toute la journée. »"
  ],
  regle:"**Plus-que-parfait = auxiliaire avoir ou être à l'imparfait + participe passé.** Il exprime une action passée **antérieure** à une autre action passée.",
  tableaux:[{titre:"Le plus-que-parfait",entetes:["","avec avoir (finir)","avec être (partir)"],lignes:[["je","j'avais fini","j'étais parti(e)"],["tu","tu avais fini","tu étais parti(e)"],["il / elle","il avait fini","il / elle était parti(e)"],["nous","nous avions fini","nous étions parti(e)s"],["vous","vous aviez fini","vous étiez parti(e)(s)"],["ils / elles","ils avaient fini","ils / elles étaient parti(e)s"]]}],
  exemples:[
    {t:"Quand je suis arrivé, le cours **avait** déjà **commencé**.",n:"Le cours a commencé avant mon arrivée : action antérieure au passé composé."},
    {t:"Elle pleurait parce qu'elle **avait perdu** son livre.",n:"La perte du livre est antérieure aux pleurs et les explique."},
    {t:"Ils **étaient partis** avant la pluie.",n:"Auxiliaire être à l'imparfait : le participe s'accorde avec « ils »."}
  ],
  retenir:["Le plus-que-parfait exprime une action passée avant une autre action passée.","Auxiliaire à l'imparfait + participe passé.","Accord du participe comme au passé composé.","On l'associe à l'imparfait ou au passé composé."],
  plus:"Le plus-que-parfait est le temps de la **concordance** dans le discours indirect au passé : « Il a dit : « J'ai fini. » » devient « Il a dit qu'il **avait fini**. » On le trouve aussi dans l'expression d'un regret avec le **conditionnel passé** : « Si j'**avais su**, je serais venu. » Attention : ne confonds pas « il **avait** chanté » (plus-que-parfait) et « il **a** chanté » (passé composé).",
  mini:{t:'qcm',q:"Hier, quand je suis arrivé, il ___ déjà fini son travail.",o:["avait","a","aura"],a:0,e:"L'action « finir son travail » est antérieure à mon arrivée : plus-que-parfait."},
  exercices:[
    {t:'fill',q:"Complète avec l'auxiliaire : Nous ___ déjà mangé quand tu es arrivé.",a:["avions"],e:"Plus-que-parfait : auxiliaire avoir à l'imparfait, 1re personne du pluriel."},
    {t:'qcm',q:"Quelle phrase est au plus-que-parfait ?",o:["Elle était partie.","Elle est partie.","Elle partait."],a:0,e:"Auxiliaire être à l'imparfait + participe passé."},
